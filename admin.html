    function eoiHistItem(e){
      var sm = eoiStatusMeta(e.status);
      var when = e.date_sent ? ('Sent '+fmtDate(e.date_sent)) : 'Not sent yet';
      var snip = e.notes || (e.signed_date ? ('Signed '+fmtDate(e.signed_date)) : '');
      return '<div class="hist-item" data-eoi="'+esc(e.id)+'"><div class="hist-top"><span class="hist-when">'+esc(when)+'</span>'
        + '<span class="spill-static" style="color:'+sm.c+';background-color:'+sm.bg+'">'+sm.label+'</span></div>'
        + (snip ? '<div class="hist-snip">'+esc(snip)+'</div>' : '')
        + '</div>';
    }

    /* =========================================================
       DOCUMENTS — PDFs stored in Supabase Storage, linked to an
       office. Metadata in public.documents; files in the
       'office-documents' bucket. (run documents-setup.sql once)
       ========================================================= */
    var DOC_BUCKET = 'office-documents';
    function fmtBytes(n){ n = +n || 0; if(n < 1024) return n+' B'; if(n < 1048576) return Math.round(n/1024)+' KB'; return (n/1048576).toFixed(1)+' MB'; }

    function renderOfficeDocs(o){
      var box = document.getElementById('ofDocs'); if(!box) return;
      if(!o){ box.innerHTML = '<div class="divider-lab">Documents</div><p class="hist-hint">Save this office first, then you can upload documents for it.</p>'; return; }
      box.innerHTML = '<div class="hist-head"><div class="divider-lab">Documents</div><button class="btn-soft" id="ofDocUpload">'+ic('upload')+' Upload PDF</button></div><div id="ofDocsList" class="docs"><div class="hist-loading">Loading\u2026</div></div>';
      var input = document.getElementById('ofDocInput');
      document.getElementById('ofDocUpload').addEventListener('click', function(){ if(input){ input.value = ''; input.click(); } });
      if(input){ input.onchange = function(){ var f = input.files && input.files[0]; if(f) uploadDoc(o, f); }; }
      loadOfficeDocs(o);
    }
    async function loadOfficeDocs(o){
      var list = document.getElementById('ofDocsList'); if(!list) return;
      list.innerHTML = '<div class="hist-loading">Loading\u2026</div>';
      try{
        var res = await sb.from('documents').select('*').eq('office_id', o.id).order('created_at', { ascending:false });
        if(res.error) throw res.error;
        var ds = res.data || [];
        if(ds.length === 0){ list.innerHTML = '<p class="doc-empty">No documents yet.</p>'; return; }
        list.innerHTML = ds.map(docItem).join('');
        function pick(id){ return ds.filter(function(x){ return String(x.id) === String(id); })[0]; }
        Array.prototype.forEach.call(list.querySelectorAll('[data-docview]'), function(b){ b.addEventListener('click', function(){ viewDoc(pick(b.getAttribute('data-docview'))); }); });
        Array.prototype.forEach.call(list.querySelectorAll('[data-docdl]'), function(b){ b.addEventListener('click', function(){ downloadDoc(pick(b.getAttribute('data-docdl'))); }); });
        Array.prototype.forEach.call(list.querySelectorAll('[data-docdel]'), function(b){ b.addEventListener('click', function(){ confirmDocDelete(o, pick(b.getAttribute('data-docdel'))); }); });
      }catch(e){ list.innerHTML = '<p class="doc-empty">'+friendlyDocError(e)+'</p>'; }
    }
    function docItem(d){
      return '<div class="doc-item" data-doc="'+esc(d.id)+'"><span class="doc-ic">'+ic('file')+'</span>'
        + '<div class="doc-meta"><div class="doc-name">'+esc(d.name || 'Document.pdf')+'</div><div class="doc-sub">'+(d.size ? fmtBytes(d.size)+' \u00b7 ' : '')+esc(fmtDate(d.created_at))+'</div></div>'
        + '<div class="doc-act">'
        +   '<button class="ia" data-docview="'+esc(d.id)+'" title="View" aria-label="View">'+ic('eye')+'</button>'
        +   '<button class="ia" data-docdl="'+esc(d.id)+'" title="Download" aria-label="Download">'+ic('download')+'</button>'
        +   '<button class="ia danger" data-docdel="'+esc(d.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button>'
        + '</div></div>';
    }
    async function uploadDoc(o, file){
      if(!file) return;
      var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
      if(!isPdf){ toast('Please choose a PDF file', 'err'); return; }
      if(file.size > 26214400){ toast('That file is over 25 MB', 'err'); return; }
      var btn = document.getElementById('ofDocUpload'); var blabel = btn ? btn.innerHTML : '';
      if(btn){ btn.disabled = true; btn.innerHTML = ic('upload')+' Uploading\u2026'; }
      try{
        var safe = (file.name || 'document.pdf').replace(/[^a-zA-Z0-9._-]/g, '_');
        var path = 'office-'+o.id+'/'+Date.now()+'-'+safe;
        var up = await sb.storage.from(DOC_BUCKET).upload(path, file, { contentType:'application/pdf', upsert:false });
        if(up.error) throw up.error;
        var ins = await sb.from('documents').insert({ office_id:o.id, name:(file.name || safe), path:path, size:file.size, mime:'application/pdf' }).select().single();
        if(ins.error){ try{ await sb.storage.from(DOC_BUCKET).remove([path]); }catch(_e){} throw ins.error; }
        toast('Document uploaded'); loadOfficeDocs(o);
      }catch(e){ toast(friendlyDocError(e), 'err'); }
      finally{ if(btn){ btn.disabled = false; btn.innerHTML = blabel; } }
    }
    async function viewDoc(d){
      if(!d) return;
      try{ var r = await sb.storage.from(DOC_BUCKET).createSignedUrl(d.path, 3600); if(r.error) throw r.error; window.open(r.data.signedUrl, '_blank'); }
      catch(e){ toast(friendlyDocError(e), 'err'); }
    }
    async function downloadDoc(d){
      if(!d) return;
      try{
        var r = await sb.storage.from(DOC_BUCKET).createSignedUrl(d.path, 3600, { download: d.name || true });
        if(r.error) throw r.error;
        var a = document.createElement('a'); a.href = r.data.signedUrl; a.download = d.name || 'document.pdf'; document.body.appendChild(a); a.click(); a.remove();
      }catch(e){ toast(friendlyDocError(e), 'err'); }
    }
    function confirmDocDelete(o, d){
      if(!d) return;
      confirmDialog('Delete document?', 'Delete <b>'+esc(d.name || 'this document')+'</b>? This permanently removes the file.', async function(){
        try{ await sb.storage.from(DOC_BUCKET).remove([d.path]); }catch(_e){}
        var del = await sb.from('documents').delete().eq('id', d.id);
        if(del.error){ toast(friendlyShort(del.error), 'err'); throw del.error; }
        toast('Document deleted'); loadOfficeDocs(o);
      });
    }
    function friendlyDocError(e){
      var m = ((e && (e.message || e.error || e.hint)) || '').toLowerCase(); var code = e && (e.statusCode || e.code);
      if(m.indexOf('bucket not found') >= 0) return 'Document storage isn\u2019t set up yet. Run documents-setup.sql in your Supabase SQL editor.';
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0 || (m.indexOf('does not exist') >= 0 && m.indexOf('documents') >= 0))
        return 'The documents table isn\u2019t set up yet. Run documents-setup.sql, then try again.';
      if(code === '42501' || code === '403' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0 || m.indexOf('unauthorized') >= 0)
        return 'Storage blocked that action. Re-run documents-setup.sql to add the access rules.';
      if(m.indexOf('exceeded') >= 0 || m.indexOf('too large') >= 0 || m.indexOf('maximum allowed size') >= 0) return 'That file is too large to upload.';
      return 'Couldn\u2019t complete that document action. Please try again.';
    }

    /* =========================================================
       NOTES — free-form notes, optionally linked to an office.
       Pinned notes float to the top. Table: public.notes
       (run notes-setup.sql once). Shown as a card grid.
       ========================================================= */
    var NT = { all:[], offices:{}, officeList:null, q:'', filter:'all', loading:true };

    function sortNotes(arr){
      return arr.slice().sort(function(a,b){
        if(!!b.pinned !== !!a.pinned) return (b.pinned?1:0) - (a.pinned?1:0);
        var at = a.updated_at || a.created_at || '', bt = b.updated_at || b.created_at || '';
        return at < bt ? 1 : at > bt ? -1 : 0;
      });
    }

    function notesView(){
      return ''
        + '<div class="view-head">'
        +   '<div class="vh-sub">Free-form notes \u2014 reminders, call summaries, anything worth keeping. Pin the important ones to the top.</div>'
        +   '<div class="tools">'
        +     '<div class="search">'+SVG_SEARCH+'<input id="ntSearch" type="search" placeholder="Search notes\u2026" autocomplete="off"></div>'
        +     '<button class="btn-primary" id="ntAdd">'+ic('plus')+'<span>Add note</span></button>'
        +   '</div>'
        + '</div>'
        + '<div class="summary" id="ntSummary"></div>'
        + '<div class="chips" id="ntChips"></div>'
        + '<div id="ntBody"><div class="loading">Loading notes\u2026</div></div>';
    }

    function notesMount(){
      var body = document.getElementById('ntBody');
      if(!sb){ if(body) body.innerHTML = errBox('Not connected to the database yet.'); return; }
      var s = document.getElementById('ntSearch'); s.addEventListener('input', function(){ NT.q = s.value.trim().toLowerCase(); renderNtList(); });
      document.getElementById('ntAdd').addEventListener('click', function(){ NoteEditor.open(null, loadNotes); });
      loadNotes();
    }

    async function loadNotes(){
      NT.loading = true;
      var body = document.getElementById('ntBody'); if(body) body.innerHTML = '<div class="loading">Loading notes\u2026</div>';
      try{
        var offRes = await sb.from('offices').select('id,name').order('name', { ascending:true });
        if(offRes.error) throw offRes.error;
        NT.officeList = offRes.data || []; NT.offices = {}; NT.officeList.forEach(function(o){ NT.offices[o.id] = o; });
        var res = await sb.from('notes').select('*').order('updated_at', { ascending:false });
        if(res.error) throw res.error;
        NT.all = sortNotes(res.data || []); NT.loading = false;
        renderNtSummary(); renderNtChips(); renderNtList();
      }catch(e){
        NT.loading = false;
        if(body){ body.innerHTML = errBox(friendlyNtError(e)); var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadNotes); }
        renderNtSummary(); renderNtChips();
      }
    }

    function renderNtSummary(){
      var el = document.getElementById('ntSummary'); if(!el) return;
      var pinned = NT.all.filter(function(n){ return n.pinned; }).length;
      var linked = NT.all.filter(function(n){ return !!n.office_id; }).length;
      el.innerHTML = stat('Total notes', NT.all.length) + stat('Pinned', pinned) + stat('Linked to offices', linked);
    }

    function renderNtChips(){
      var el = document.getElementById('ntChips'); if(!el) return;
      var pinned = NT.all.filter(function(n){ return n.pinned; }).length;
      var defs = [{ id:'all', label:'All', ct:NT.all.length },{ id:'pinned', label:'Pinned', ct:pinned }];
      el.innerHTML = defs.map(function(d){ var active = NT.filter === d.id; return '<button class="chip'+(active?' active':'')+'" data-nf="'+d.id+'">'+d.label+' <span class="ct">'+d.ct+'</span></button>'; }).join('');
      Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b){ b.addEventListener('click', function(){ NT.filter = b.getAttribute('data-nf'); renderNtChips(); renderNtList(); }); });
    }

    function renderNtList(){
      var body = document.getElementById('ntBody'); if(!body || NT.loading) return;
      if(NT.all.length === 0){
        body.innerHTML = ntEmpty();
        var b = document.getElementById('ntAddEmpty'); if(b) b.addEventListener('click', function(){ NoteEditor.open(null, loadNotes); });
        return;
      }
      var rows = NT.all.filter(function(n){
        if(NT.filter === 'pinned' && !n.pinned) return false;
        if(NT.q){ var off = n.office_id ? NT.offices[n.office_id] : null; var hay = ((n.title||'')+' '+(n.body||'')+' '+((off&&off.name)||'')).toLowerCase(); if(hay.indexOf(NT.q) < 0) return false; }
        return true;
      });
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No notes match your search or filter.</div>'; return; }
      body.innerHTML = '<div class="notes-grid">' + rows.map(noteCard).join('') + '</div>';
      wireNtCards();
    }

    function noteCard(n){
      var off = n.office_id ? NT.offices[n.office_id] : null;
      var title = (n.title || '').trim();
      var body = (n.body || '').trim();
      var when = timeAgo(n.updated_at || n.created_at);
      return ''
        + '<div class="note-card'+(n.pinned?' pinned':'')+'" data-id="'+esc(n.id)+'">'
        +   '<button class="note-pin'+(n.pinned?' on':'')+'" data-pin="'+esc(n.id)+'" title="'+(n.pinned?'Unpin':'Pin to top')+'" aria-label="'+(n.pinned?'Unpin':'Pin to top')+'">'+ic('pin')+'</button>'
        +   '<div class="note-main" data-edit>'
        +     (title ? '<div class="note-title">'+esc(title)+'</div>' : '')
        +     (body ? '<div class="note-body'+(title?'':' notitle')+'">'+esc(body)+'</div>' : (title ? '' : '<div class="note-body dim">Empty note</div>'))
        +   '</div>'
        +   '<div class="note-foot">'
        +     '<div class="note-meta">'+(off?'<span class="note-office">'+ic('building')+esc(off.name)+'</span>':'')+(when?'<span class="note-when">Edited '+esc(when)+'</span>':'')+'</div>'
        +     '<div class="note-act"><button class="ia" data-nedit="'+esc(n.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-ndel="'+esc(n.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button></div>'
        +   '</div>'
        + '</div>';
    }

    function wireNtCards(){
      var body = document.getElementById('ntBody');
      Array.prototype.forEach.call(body.querySelectorAll('[data-pin]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); togglePin(b.getAttribute('data-pin')); }); });
      Array.prototype.forEach.call(body.querySelectorAll('.note-main[data-edit]'), function(c){ c.addEventListener('click', function(){ var n = findNote(c.closest('.note-card').getAttribute('data-id')); if(n) NoteEditor.open(n, loadNotes); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-nedit]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); var n = findNote(b.getAttribute('data-nedit')); if(n) NoteEditor.open(n, loadNotes); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-ndel]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); confirmNoteDelete(findNote(b.getAttribute('data-ndel'))); }); });
    }
    function findNote(id){ return NT.all.filter(function(n){ return String(n.id) === String(id); })[0]; }

    async function togglePin(id){
      var n = findNote(id); if(!n) return;
      var newval = !n.pinned;
      try{
        var res = await sb.from('notes').update({ pinned: newval }).eq('id', id).select().single();
        if(res.error) throw res.error;
        n.pinned = newval; NT.all = sortNotes(NT.all);
        renderNtSummary(); renderNtChips(); renderNtList();
        toast(newval ? 'Pinned to top' : 'Unpinned');
      }catch(err){ toast(friendlyShort(err), 'err'); loadNotes(); }
    }

    function confirmNoteDelete(n){
      if(!n) return;
      var has = (n.title || n.body || '').trim();
      var label = (n.title || '').trim() || (n.body || '').trim();
      if(label.length > 44) label = label.slice(0, 44) + '\u2026';
      var msg = has ? ('Delete \u201c<b>'+esc(label)+'</b>\u201d? This can\u2019t be undone.') : 'Delete this note? This can\u2019t be undone.';
      confirmDialog('Delete note?', msg, async function(){
        var res = await sb.from('notes').delete().eq('id', n.id);
        if(res.error){ toast(friendlyShort(res.error), 'err'); throw res.error; }
        toast('Note deleted'); loadNotes();
      });
    }

    function ntEmpty(){
      return '<div class="empty"><span class="ptile">'+ic('note')+'</span><h2 class="display">No notes yet</h2>'
        + '<p>Jot down anything \u2014 a reminder, a call summary, a thought about an office. Pin the important ones to keep them up top.</p>'
        + '<button class="btn-primary" id="ntAddEmpty">'+ic('plus')+'<span>Write your first note</span></button></div>';
    }

    function friendlyNtError(e){
      var m = ((e && (e.message || e.hint || e.details)) || '').toLowerCase(); var code = e && e.code;
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0)
        return 'The <b>notes</b> table isn\u2019t set up yet. Run the one-time setup SQL (notes-setup.sql) in your Supabase SQL editor, then press Try again.';
      if(code === '42501' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0)
        return 'Your database blocked that request. Make sure you ran the full setup SQL and that you\u2019re signed in.';
      return 'Couldn\u2019t reach the database. Please check your connection and press Try again.';
    }

    /* ---- shared note editor (slide-over appended to <body>) ---- */
    var NoteEditor = (function(){
      var built = false, editing = null, onSaved = null, els = {};
      function build(){
        if(built) return;
        var form = ''
          + '<div class="frm">'
          +   '<div class="fld span2"><label for="ntTitle">Title <span class="opt">(optional)</span></label><input id="ntTitle" type="text" placeholder="Give it a short title\u2026" maxlength="160"></div>'
          +   '<div class="fld span2"><label for="ntBodyF">Note</label><textarea id="ntBodyF" rows="8" placeholder="Write your note\u2026"></textarea><small class="fe" id="ntErrF"></small></div>'
          +   '<div class="fld span2"><label for="ntOffice">Link to an office <span class="opt">(optional)</span></label><select id="ntOffice"></select></div>'
          +   '<div class="fld span2"><label class="chkline"><input type="checkbox" id="ntPin"> <span>Pin this note to the top</span></label></div>'
          + '</div>';
        var html = ''
          + '<div class="ov-scrim l2" id="ntScrim"></div>'
          + '<aside class="ov l2" id="ntOv" aria-hidden="true" aria-label="Note">'
          +   '<div class="ov-head"><h2 id="ntTitleH" class="display">New note</h2><button class="icon-btn" id="ntClose" aria-label="Close">'+SVG_X+'</button></div>'
          +   '<div class="ov-body">'+form+'</div>'
          +   '<div class="ov-foot"><div class="ov-err" id="ntErr"></div><button class="btn-out" id="ntCancel">Cancel</button><button class="btn-primary" id="ntSave"><span>Save note</span></button></div>'
          + '</aside>';
        var wrap = document.createElement('div'); wrap.innerHTML = html; while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
        els.scrim = document.getElementById('ntScrim'); els.ov = document.getElementById('ntOv');
        document.getElementById('ntClose').addEventListener('click', close);
        document.getElementById('ntCancel').addEventListener('click', close);
        els.scrim.addEventListener('click', close);
        document.getElementById('ntSave').addEventListener('click', save);
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && els.ov.classList.contains('show')) close(); });
        built = true;
      }
      async function fillOffices(selId){
        var sel = document.getElementById('ntOffice'); sel.innerHTML = '<option value="">Loading\u2026</option>';
        try{
          var res = await sb.from('offices').select('id,name').order('name', { ascending:true });
          if(res.error) throw res.error;
          var list = res.data || [];
          sel.innerHTML = '<option value="">\u2014 No office \u2014</option>' + list.map(function(o){ return '<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>'; }).join('');
          if(selId) sel.value = selId;
        }catch(e){ sel.innerHTML = '<option value="">\u2014 No office \u2014</option>'; }
      }
      function show(on){
        if(on){ els.scrim.classList.add('show'); els.ov.classList.add('show'); els.ov.setAttribute('aria-hidden','false'); }
        else { els.scrim.classList.remove('show'); els.ov.classList.remove('show'); els.ov.setAttribute('aria-hidden','true'); }
      }
      function open(note, savedCb){
        build();
        editing = note || null; onSaved = savedCb || null;
        document.getElementById('ntTitleH').textContent = note ? 'Edit note' : 'New note';
        document.getElementById('ntTitle').value = (note && note.title) || '';
        document.getElementById('ntBodyF').value = (note && note.body) || '';
        document.getElementById('ntPin').checked = !!(note && note.pinned);
        document.getElementById('ntErrF').textContent = ''; document.getElementById('ntErr').textContent = '';
        show(true);
        setTimeout(function(){ var t = document.getElementById('ntTitle'); if(t) t.focus(); }, 80);
        fillOffices(note ? note.office_id : '');
      }
      function close(){ show(false); }
      async function save(){
        var title = nn(document.getElementById('ntTitle').value);
        var bodyv = nn(document.getElementById('ntBodyF').value);
        document.getElementById('ntErrF').textContent = ''; document.getElementById('ntErr').textContent = '';
        if(!title && !bodyv){ document.getElementById('ntErrF').textContent = 'Add a title or some text first.'; var b = document.getElementById('ntBodyF'); if(b) b.focus(); return; }
        var payload = { title: title, body: bodyv, office_id: (document.getElementById('ntOffice').value || null), pinned: document.getElementById('ntPin').checked };
        var btn = document.getElementById('ntSave'), span = btn.querySelector('span'); var label = span ? span.textContent : '';
        btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
        try{
          var res = editing
            ? await sb.from('notes').update(payload).eq('id', editing.id).select().single()
            : await sb.from('notes').insert(payload).select().single();
          if(res.error) throw res.error;
          var wasEdit = !!editing; close();
          toast(wasEdit ? 'Note updated' : 'Note added');
          if(onSaved) onSaved();
        }catch(e){ document.getElementById('ntErr').textContent = friendlyShort(e); }
        finally{ btn.disabled = false; if(span) span.textContent = label || 'Save note'; }
      }
      return { open: open };
    })();

    boot();
  })();
  </script>
</body>
</html>
