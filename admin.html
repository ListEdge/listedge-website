    function followupsMount(){
      var body = document.getElementById('fuBody');
      if(!sb){ if(body) body.innerHTML = errBox('Not connected to the database yet.'); return; }
      var s = document.getElementById('fuSearch'); s.addEventListener('input', function(){ FU.q = s.value.trim().toLowerCase(); renderFuList(); });
      var so = document.getElementById('fuSort'); so.value = FU.sort; so.addEventListener('change', function(){ FU.sort = so.value; renderFuList(); });
      document.getElementById('fuAdd').addEventListener('click', function(){
        if(FU.officeList && FU.officeList.length === 0){ toast('Add an office first', 'err'); return; }
        FollowUpEditor.open(null, null, loadFollowUps);
      });
      loadFollowUps();
    }

    async function loadFollowUps(){
      FU.loading = true;
      var body = document.getElementById('fuBody'); if(body) body.innerHTML = '<div class="loading">Loading follow-ups\u2026</div>';
      try{
        var offRes = await sb.from('offices').select('id,name,suburb').order('name', { ascending:true });
        if(offRes.error) throw offRes.error;
        FU.officeList = offRes.data || []; FU.offices = {}; FU.officeList.forEach(function(o){ FU.offices[o.id] = o; });
        var res = await sb.from('follow_ups').select('*').order('due_date', { ascending:true, nullsFirst:false });
        if(res.error) throw res.error;
        FU.all = res.data || [];
        FU.loading = false;
        renderFuSummary(); renderFuChips(); renderFuList();
      }catch(e){
        FU.loading = false;
        if(body){ body.innerHTML = errBox(friendlyFuError(e)); var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadFollowUps); }
        renderFuSummary(); renderFuChips();
      }
    }

    function renderFuSummary(){
      var el = document.getElementById('fuSummary'); if(!el) return;
      var open = 0, over = 0, done = 0;
      FU.all.forEach(function(f){ var e = fuEff(f); if(e === 'completed') done++; else { open++; if(e === 'overdue') over++; } });
      el.innerHTML = stat('Open', open) + stat('Overdue', over) + stat('Completed', done);
    }

    function renderFuChips(){
      var el = document.getElementById('fuChips'); if(!el) return;
      var defs = [{ id:'all', label:'All' }, { id:'pending', label:'Pending' }, { id:'overdue', label:'Overdue' }, { id:'completed', label:'Completed' }];
      function count(id){ return id === 'all' ? FU.all.length : FU.all.filter(function(f){ return fuEff(f) === id; }).length; }
      el.innerHTML = defs.map(function(s){
        var active = FU.status === s.id; var meta = FUSTAT[s.id];
        var style = (active && meta) ? (' style="background-color:'+meta.bg+';color:'+meta.c+';border-color:transparent"') : '';
        return '<button class="chip'+(active?' active':'')+'" data-fst="'+s.id+'"'+style+'>'+s.label+' <span class="ct">'+count(s.id)+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b){
        b.addEventListener('click', function(){ FU.status = b.getAttribute('data-fst'); renderFuChips(); renderFuList(); });
      });
    }

    function fuComparator(a, b){
      var ac = a.status === 'completed', bc = b.status === 'completed';
      if(ac !== bc) return ac ? 1 : -1;                 // completed sink to the bottom
      if(FU.sort === 'priority'){
        var po = { high:0, medium:1, low:2 };
        var pa = po[a.priority] != null ? po[a.priority] : 1, pb = po[b.priority] != null ? po[b.priority] : 1;
        if(pa !== pb) return pa - pb;
      }
      var ad = a.due_date ? String(a.due_date).slice(0,10) : '9999-12-31';
      var bd = b.due_date ? String(b.due_date).slice(0,10) : '9999-12-31';
      return ad < bd ? -1 : ad > bd ? 1 : 0;             // soonest / most overdue first
    }

    function renderFuList(){
      var body = document.getElementById('fuBody'); if(!body || FU.loading) return;
      if(FU.all.length === 0){
        body.innerHTML = fuEmpty();
        var b = document.getElementById('fuAddEmpty'); if(b) b.addEventListener('click', function(){ FollowUpEditor.open(null, null, loadFollowUps); });
        return;
      }
      var rows = FU.all.filter(function(f){
        if(FU.status !== 'all' && fuEff(f) !== FU.status) return false;
        if(FU.q){ var off = FU.offices[f.office_id]; var hay = (((off && off.name) || '')+' '+(f.type||'')+' '+(f.notes||'')).toLowerCase(); if(hay.indexOf(FU.q) < 0) return false; }
        return true;
      });
      rows.sort(fuComparator);
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No follow-ups match your search or filter.</div>'; return; }
      var head = '<div class="fu-head"><div></div><div>Follow-up</div><div>Due</div><div>Priority</div><div>Status</div><div></div></div>';
      body.innerHTML = '<div class="of-table">' + head + rows.map(fuRow).join('') + '</div>';
      wireFuRows();
    }

    function fuRow(f){
      var off = FU.offices[f.office_id];
      var eff = fuEff(f); var sm = FUSTAT[eff]; var pm = FUPRIO[f.priority] || FUPRIO.medium;
      var done = f.status === 'completed';
      var title = f.type ? esc(f.type) : '<span class="dim">Follow-up</span>';
      var officeName = off ? esc(off.name) : '<span class="dim">Unknown office</span>';
      var linked = f.meeting_id ? '<span class="fu-link" title="Linked to a meeting">'+SVG_LINK+'</span>' : '';
      var due = f.due_date ? ('<span class="'+(eff === 'overdue' ? 'due-over' : '')+'">'+esc(fmtDate(f.due_date))+'</span>') : '<span class="dim">\u2014</span>';
      return ''
        + '<div class="fu-row'+(eff === 'overdue' ? ' overdue' : '')+(done ? ' done' : '')+'" data-id="'+esc(f.id)+'">'
        +   '<button class="chk'+(done ? ' on' : '')+'" data-fucheck="'+esc(f.id)+'" title="'+(done ? 'Mark as not done' : 'Mark as done')+'" aria-label="Toggle done">'+ic('check')+'</button>'
        +   '<div class="fu-main" data-edit><b>'+title+linked+'</b><span class="sub">'+officeName+'</span></div>'
        +   '<div class="fu-due"><span class="cl">Due</span>'+due+'</div>'
        +   '<div class="fu-prio"><span class="cl">Priority</span><span class="spill-static" style="color:'+pm.c+';background-color:'+pm.bg+'">'+pm.label+'</span></div>'
        +   '<div class="fu-status"><span class="cl">Status</span><span class="spill-static" style="color:'+sm.c+';background-color:'+sm.bg+'">'+sm.label+'</span></div>'
        +   '<div class="c-act"><button class="ia" data-fedit="'+esc(f.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-fdel="'+esc(f.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button></div>'
        + '</div>';
    }

    function wireFuRows(){
      var body = document.getElementById('fuBody');
      Array.prototype.forEach.call(body.querySelectorAll('[data-fucheck]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); toggleFuDone(b.getAttribute('data-fucheck')); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-fedit]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); var f = findFu(b.getAttribute('data-fedit')); if(f) FollowUpEditor.open(f, null, loadFollowUps); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-fdel]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); confirmFuDelete(findFu(b.getAttribute('data-fdel'))); }); });
      Array.prototype.forEach.call(body.querySelectorAll('.fu-main[data-edit]'), function(c){ c.addEventListener('click', function(){ var f = findFu(c.closest('.fu-row').getAttribute('data-id')); if(f) FollowUpEditor.open(f, null, loadFollowUps); }); });
    }
    function findFu(id){ return FU.all.filter(function(f){ return String(f.id) === String(id); })[0]; }

    async function toggleFuDone(id){
      var f = findFu(id); if(!f) return;
      var next = f.status === 'completed' ? 'pending' : 'completed';
      try{
        var res = await sb.from('follow_ups').update({ status: next }).eq('id', id).select().single();
        if(res.error) throw res.error;
        f.status = next;
        renderFuSummary(); renderFuChips(); renderFuList();
        toast(next === 'completed' ? 'Marked done' : 'Reopened');
      }catch(e){ toast(friendlyShort(e), 'err'); loadFollowUps(); }
    }

    function confirmFuDelete(f){
      if(!f) return; var off = FU.offices[f.office_id];
      var what = f.type ? ('\u201c'+esc(f.type)+'\u201d') : 'this follow-up';
      confirmDialog('Delete follow-up?', 'Delete '+what+(off ? (' for <b>'+esc(off.name)+'</b>') : '')+'? This can\u2019t be undone.', async function(){
        var res = await sb.from('follow_ups').delete().eq('id', f.id);
        if(res.error){ toast(friendlyShort(res.error), 'err'); throw res.error; }
        toast('Follow-up deleted'); loadFollowUps();
      });
    }

    function fuEmpty(){
      if(FU.officeList && FU.officeList.length === 0){
        return '<div class="empty"><span class="ptile">'+ic('bell')+'</span><h2 class="display">No follow-ups yet</h2>'
          + '<p>Follow-ups are linked to your offices. Add an office first, then you can set reminders against it.</p>'
          + '<a class="btn-primary" href="#/offices">'+ic('building')+'<span>Go to Offices</span></a></div>';
      }
      return '<div class="empty"><span class="ptile">'+ic('bell')+'</span><h2 class="display">No follow-ups yet</h2>'
        + '<p>Add your first follow-up to keep track of every touchpoint you owe. Everything saves to your database.</p>'
        + '<button class="btn-primary" id="fuAddEmpty">'+ic('plus')+'<span>Add your first follow-up</span></button></div>';
    }

    function friendlyFuError(e){
      var m = ((e && (e.message || e.hint || e.details)) || '').toLowerCase(); var code = e && e.code;
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0)
        return 'The <b>follow_ups</b> table isn\u2019t set up yet. Run the one-time setup SQL (follow-ups-setup.sql) in your Supabase SQL editor, then press Try again.';
      if(code === '42501' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0)
        return 'Your database blocked that request. Make sure you ran the full setup SQL and that you\u2019re signed in.';
      return 'Couldn\u2019t reach the database. Please check your connection and press Try again.';
    }

    /* ---- shared follow-up editor (slide-over appended to <body>) ---- */
    var FollowUpEditor = (function(){
      var built = false, editing = null, onSaved = null, els = {};
      function build(){
        if(built) return;
        var form = ''
          + '<div class="frm">'
          +   '<div class="fld span2"><label for="fuOffice">Office *</label><select id="fuOffice"></select><small class="fe" id="fuOfficeErr"></small></div>'
          +   '<div class="fld span2"><label for="fuMeeting">Related meeting <span class="opt">optional</span></label><select id="fuMeeting" disabled><option value="">\u2014 No meeting \u2014</option></select></div>'
          +   '<div class="fld span2"><label for="fuType">Follow-up type</label><input id="fuType" list="fuTypeList" placeholder="e.g. Phone call, Send documents"><datalist id="fuTypeList"><option>Phone call</option><option>Email</option><option>Send documents</option><option>Send founding-office pack</option><option>Check-in</option><option>Site visit</option></datalist></div>'
          +   '<div class="fld"><label for="fuDue">Due date</label><input id="fuDue" type="date"></div>'
          +   '<div class="fld"><label for="fuPriority">Priority</label><select id="fuPriority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>'
          +   '<div class="fld span2"><label for="fuStatus">Status</label><select id="fuStatus"><option value="pending">Pending</option><option value="completed">Completed</option></select><small class="fld-hint">Overdue is set automatically when a pending follow-up passes its due date.</small></div>'
          +   '<div class="fld span2"><label for="fuNotes">Notes</label><textarea id="fuNotes" rows="3" placeholder="Anything to remember\u2026"></textarea></div>'
          + '</div>';
        var html = ''
          + '<div class="ov-scrim l2" id="fuoScrim"></div>'
          + '<aside class="ov l2" id="fuOv" aria-hidden="true" aria-label="Follow-up details">'
          +   '<div class="ov-head"><h2 id="fuoTitle" class="display">Add follow-up</h2><button class="icon-btn" id="fuoClose" aria-label="Close">'+SVG_X+'</button></div>'
          +   '<div class="ov-body">'+form+'</div>'
          +   '<div class="ov-foot"><div class="ov-err" id="fuoErr"></div><button class="btn-out" id="fuoCancel">Cancel</button><button class="btn-primary" id="fuoSave"><span>Save follow-up</span></button></div>'
          + '</aside>';
        var wrap = document.createElement('div'); wrap.innerHTML = html;
        while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
        els.scrim = document.getElementById('fuoScrim'); els.ov = document.getElementById('fuOv');
        document.getElementById('fuoClose').addEventListener('click', close);
        document.getElementById('fuoCancel').addEventListener('click', close);
        els.scrim.addEventListener('click', close);
        document.getElementById('fuoSave').addEventListener('click', save);
        document.getElementById('fuOffice').addEventListener('change', function(){ fillMeetings(document.getElementById('fuOffice').value, null); });
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && els.ov.classList.contains('show')) close(); });
        built = true;
      }
      async function fillOffices(selId){
        var sel = document.getElementById('fuOffice');
        sel.innerHTML = '<option value="">Loading\u2026</option>';
        try{
          var res = await sb.from('offices').select('id,name').order('name', { ascending:true });
          if(res.error) throw res.error;
          var list = res.data || [];
          if(list.length === 0){ sel.innerHTML = '<option value="">No offices yet</option>'; }
          else { sel.innerHTML = '<option value="">Select an office\u2026</option>' + list.map(function(o){ return '<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>'; }).join(''); }
          if(selId) sel.value = selId;
        }catch(e){ sel.innerHTML = '<option value="">Could not load offices</option>'; }
      }
      async function fillMeetings(officeId, selMeetingId){
        var sel = document.getElementById('fuMeeting');
        if(!officeId){ sel.innerHTML = '<option value="">\u2014 No meeting \u2014</option>'; sel.disabled = true; return; }
        sel.disabled = false; sel.innerHTML = '<option value="">Loading\u2026</option>';
        try{
          var res = await sb.from('meetings').select('*').eq('office_id', officeId).order('meeting_date', { ascending:false, nullsFirst:false });
          if(res.error) throw res.error;
          var ms = res.data || [];
          sel.innerHTML = '<option value="">\u2014 No meeting \u2014</option>' + ms.map(function(m){
            var lbl = (m.meeting_date ? fmtDate(m.meeting_date) : 'No date') + (m.meeting_time ? ' ' + fmtTime(m.meeting_time) : '') + ' \u00b7 ' + mtgStatusMeta(m.status).label;
            return '<option value="'+esc(m.id)+'">'+esc(lbl)+'</option>';
          }).join('');
          if(selMeetingId) sel.value = selMeetingId;
        }catch(e){ sel.innerHTML = '<option value="">\u2014 No meeting \u2014</option>'; }
      }
      function show(on){
        if(on){ els.scrim.classList.add('show'); els.ov.classList.add('show'); els.ov.setAttribute('aria-hidden','false'); }
        else { els.scrim.classList.remove('show'); els.ov.classList.remove('show'); els.ov.setAttribute('aria-hidden','true'); }
      }
      function open(fu, presetOfficeId, savedCb){
        build();
        editing = fu || null; onSaved = savedCb || null;
        document.getElementById('fuoTitle').textContent = fu ? 'Edit follow-up' : 'Add follow-up';
        document.getElementById('fuType').value = (fu && fu.type) || '';
        document.getElementById('fuDue').value = (fu && fu.due_date) ? String(fu.due_date).slice(0,10) : '';
        document.getElementById('fuPriority').value = (fu && fu.priority) || 'medium';
        document.getElementById('fuStatus').value = (fu && fu.status) || 'pending';
        document.getElementById('fuNotes').value = (fu && fu.notes) || '';
        document.getElementById('fuOfficeErr').textContent = ''; document.getElementById('fuoErr').textContent = '';
        show(true);
        (async function(){
          await fillOffices(fu ? fu.office_id : (presetOfficeId || ''));
          await fillMeetings(document.getElementById('fuOffice').value, fu ? fu.meeting_id : null);
        })();
      }
      function close(){ show(false); }
      async function save(){
        var officeId = document.getElementById('fuOffice').value;
        document.getElementById('fuOfficeErr').textContent = ''; document.getElementById('fuoErr').textContent = '';
        if(!officeId){ document.getElementById('fuOfficeErr').textContent = 'Please choose an office.'; return; }
        var payload = {
          office_id: officeId,
          meeting_id: nn(document.getElementById('fuMeeting').value),
          type: nn(document.getElementById('fuType').value),
          due_date: nn(document.getElementById('fuDue').value),
          priority: document.getElementById('fuPriority').value || 'medium',
          status: document.getElementById('fuStatus').value || 'pending',
          notes: nn(document.getElementById('fuNotes').value)
        };
        var btn = document.getElementById('fuoSave'), span = btn.querySelector('span'); var label = span ? span.textContent : '';
        btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
        try{
          if(!editing){ payload.user_id = await ownerId(); }
          var res = editing
            ? await sb.from('follow_ups').update(payload).eq('id', editing.id).select().single()
            : await sb.from('follow_ups').insert(payload).select().single();
          if(res.error) throw res.error;
          var wasEdit = !!editing; close();
          toast(wasEdit ? 'Follow-up updated' : 'Follow-up added');
          if(onSaved) onSaved();
        }catch(e){ document.getElementById('fuoErr').textContent = friendlyShort(e); }
        finally{ btn.disabled = false; if(span) span.textContent = label || 'Save follow-up'; }
      }
      return { open: open };
    })();

    /* =========================================================
       EOIs — expressions of interest, linked to offices.
       Table: public.eois (run eois-setup.sql once).
       ========================================================= */
    var EOISTAT = {
      draft:        { label:'Draft',        c:'#5C6760', bg:'#ECE8DD' },
      sent:         { label:'Sent',         c:'#2563EB', bg:'#E7EEFC' },
      under_review: { label:'Under review', c:'#9A6A00', bg:'#FBF1D8' },
      signed:       { label:'Signed',       c:'#0E5A3C', bg:'#E7F0EA' },
      declined:     { label:'Declined',     c:'#B42318', bg:'#FBEAE8' }
    };
    function eoiStatusMeta(s){ return EOISTAT[s] || EOISTAT.draft; }

    var EO = { all:[], offices:{}, officeList:null, q:'', status:'all', loading:true };

    function eoisView(){
      return ''
        + '<div class="view-head">'
        +   '<div class="vh-sub">Expressions of interest sent to offices \u2014 from first draft to signed.</div>'
        +   '<div class="tools">'
        +     '<div class="search">'+SVG_SEARCH+'<input id="eoSearch" type="search" placeholder="Search office, notes\u2026" autocomplete="off"></div>'
        +     '<button class="btn-primary" id="eoAdd">'+ic('plus')+'<span>Add EOI</span></button>'
        +   '</div>'
        + '</div>'
        + '<div class="summary" id="eoSummary"></div>'
        + '<div class="chips" id="eoChips"></div>'
        + '<div id="eoBody"><div class="loading">Loading EOIs\u2026</div></div>';
    }

    function eoisMount(){
      var body = document.getElementById('eoBody');
      if(!sb){ if(body) body.innerHTML = errBox('Not connected to the database yet.'); return; }
      var s = document.getElementById('eoSearch'); s.addEventListener('input', function(){ EO.q = s.value.trim().toLowerCase(); renderEoList(); });
      document.getElementById('eoAdd').addEventListener('click', function(){
        if(EO.officeList && EO.officeList.length === 0){ toast('Add an office first', 'err'); return; }
        EOIEditor.open(null, null, loadEOIs);
      });
      loadEOIs();
    }

    async function loadEOIs(){
      EO.loading = true;
      var body = document.getElementById('eoBody'); if(body) body.innerHTML = '<div class="loading">Loading EOIs\u2026</div>';
      try{
        var offRes = await sb.from('offices').select('id,name,suburb').order('name', { ascending:true });
        if(offRes.error) throw offRes.error;
        EO.officeList = offRes.data || []; EO.offices = {}; EO.officeList.forEach(function(o){ EO.offices[o.id] = o; });
        var res = await sb.from('eois').select('*').order('date_sent', { ascending:false, nullsFirst:false });
        if(res.error) throw res.error;
        EO.all = res.data || []; EO.loading = false;
        renderEoSummary(); renderEoChips(); renderEoList();
      }catch(e){
        EO.loading = false;
        if(body){ body.innerHTML = errBox(friendlyEoError(e)); var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadEOIs); }
        renderEoSummary(); renderEoChips();
      }
    }

    function renderEoSummary(){
      var el = document.getElementById('eoSummary'); if(!el) return;
      var ur = EO.all.filter(function(e){ return e.status === 'under_review'; }).length;
      var signed = EO.all.filter(function(e){ return e.status === 'signed'; }).length;
      el.innerHTML = stat('Total EOIs', EO.all.length) + stat('Under review', ur) + stat('Signed', signed);
    }

    function renderEoChips(){
      var el = document.getElementById('eoChips'); if(!el) return;
      var defs = [{ id:'all', label:'All' },{ id:'draft', label:'Draft' },{ id:'sent', label:'Sent' },{ id:'under_review', label:'Under review' },{ id:'signed', label:'Signed' },{ id:'declined', label:'Declined' }];
      function count(id){ return id === 'all' ? EO.all.length : EO.all.filter(function(e){ return e.status === id; }).length; }
      el.innerHTML = defs.map(function(s){
        var active = EO.status === s.id; var meta = EOISTAT[s.id];
        var style = (active && meta) ? (' style="background-color:'+meta.bg+';color:'+meta.c+';border-color:transparent"') : '';
        return '<button class="chip'+(active?' active':'')+'" data-est="'+s.id+'"'+style+'>'+s.label+' <span class="ct">'+count(s.id)+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b){ b.addEventListener('click', function(){ EO.status = b.getAttribute('data-est'); renderEoChips(); renderEoList(); }); });
    }

    function renderEoList(){
      var body = document.getElementById('eoBody'); if(!body || EO.loading) return;
      if(EO.all.length === 0){
        body.innerHTML = eoEmpty();
        var b = document.getElementById('eoAddEmpty'); if(b) b.addEventListener('click', function(){ EOIEditor.open(null, null, loadEOIs); });
        return;
      }
      var rows = EO.all.filter(function(e){
        if(EO.status !== 'all' && e.status !== EO.status) return false;
        if(EO.q){ var off = EO.offices[e.office_id]; var hay = (((off && off.name) || '')+' '+(e.notes||'')).toLowerCase(); if(hay.indexOf(EO.q) < 0) return false; }
        return true;
      });
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No EOIs match your search or filter.</div>'; return; }
      var head = '<div class="eo-head"><div>Office</div><div>Date sent</div><div>Status</div><div>Signed</div><div></div></div>';
      body.innerHTML = '<div class="of-table">' + head + rows.map(eoRow).join('') + '</div>';
      wireEoRows();
    }

    function eoRow(e){
      var off = EO.offices[e.office_id]; var sm = eoiStatusMeta(e.status);
      var opts = Object.keys(EOISTAT).map(function(k){ return '<option value="'+k+'"'+(k===e.status?' selected':'')+'>'+EOISTAT[k].label+'</option>'; }).join('');
      var sent = e.date_sent ? esc(fmtDate(e.date_sent)) : '<span class="dim">\u2014</span>';
      var signed = e.signed_date ? esc(fmtDate(e.signed_date)) : '<span class="dim">\u2014</span>';
      return ''
        + '<div class="eo-row" data-id="'+esc(e.id)+'">'
        +   '<div class="eo-office" data-edit><b>'+(off?esc(off.name):'<span class="dim">Unknown office</span>')+'</b>'+(off&&off.suburb?'<span class="sub">'+esc(off.suburb)+'</span>':'')+'</div>'
        +   '<div class="eo-sent"><span class="cl">Date sent</span>'+sent+'</div>'
        +   '<div class="eo-status"><span class="cl">Status</span><select class="spill" data-estatus="'+esc(e.id)+'" style="color:'+sm.c+';background-color:'+sm.bg+'">'+opts+'</select></div>'
        +   '<div class="eo-signed"><span class="cl">Signed</span>'+signed+'</div>'
        +   '<div class="c-act"><button class="ia" data-eedit="'+esc(e.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-edel="'+esc(e.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button></div>'
        + '</div>';
    }

    function wireEoRows(){
      var body = document.getElementById('eoBody');
      Array.prototype.forEach.call(body.querySelectorAll('[data-estatus]'), function(sel){
        sel.addEventListener('change', function(){ changeEoStatus(sel.getAttribute('data-estatus'), sel.value); });
        sel.addEventListener('click', function(ev){ ev.stopPropagation(); });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-eedit]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); var e = findEo(b.getAttribute('data-eedit')); if(e) EOIEditor.open(e, null, loadEOIs); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-edel]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); confirmEoDelete(findEo(b.getAttribute('data-edel'))); }); });
      Array.prototype.forEach.call(body.querySelectorAll('.eo-office[data-edit]'), function(c){ c.addEventListener('click', function(){ var e = findEo(c.closest('.eo-row').getAttribute('data-id')); if(e) EOIEditor.open(e, null, loadEOIs); }); });
    }
    function findEo(id){ return EO.all.filter(function(e){ return String(e.id) === String(id); })[0]; }

    async function changeEoStatus(id, status){
      var e = findEo(id); if(!e) return;
      var patch = { status: status };
      if(status === 'signed' && !e.signed_date){ patch.signed_date = todayStr(); }
      try{
        var res = await sb.from('eois').update(patch).eq('id', id).select().single();
        if(res.error) throw res.error;
        e.status = status; if(patch.signed_date) e.signed_date = patch.signed_date;
        renderEoSummary(); renderEoChips(); renderEoList();
        toast('Status updated');
      }catch(err){ toast(friendlyShort(err), 'err'); loadEOIs(); }
    }

    function confirmEoDelete(e){
      if(!e) return; var off = EO.offices[e.office_id];
      confirmDialog('Delete EOI?', 'Delete this EOI'+(off?(' for <b>'+esc(off.name)+'</b>'):'')+'? This can\u2019t be undone.', async function(){
        var res = await sb.from('eois').delete().eq('id', e.id);
        if(res.error){ toast(friendlyShort(res.error), 'err'); throw res.error; }
        toast('EOI deleted'); loadEOIs();
      });
    }

    function eoEmpty(){
      if(EO.officeList && EO.officeList.length === 0){
        return '<div class="empty"><span class="ptile">'+ic('file')+'</span><h2 class="display">No EOIs yet</h2>'
          + '<p>EOIs are linked to your offices. Add an office first, then you can record an expression of interest.</p>'
          + '<a class="btn-primary" href="#/offices">'+ic('building')+'<span>Go to Offices</span></a></div>';
      }
      return '<div class="empty"><span class="ptile">'+ic('file')+'</span><h2 class="display">No EOIs yet</h2>'
        + '<p>Record your first expression of interest. Everything saves to your database.</p>'
        + '<button class="btn-primary" id="eoAddEmpty">'+ic('plus')+'<span>Add your first EOI</span></button></div>';
    }

    function friendlyEoError(e){
      var m = ((e && (e.message || e.hint || e.details)) || '').toLowerCase(); var code = e && e.code;
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0)
        return 'The <b>eois</b> table isn\u2019t set up yet. Run the one-time setup SQL (eois-setup.sql) in your Supabase SQL editor, then press Try again.';
      if(code === '42501' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0)
        return 'Your database blocked that request. Make sure you ran the full setup SQL and that you\u2019re signed in.';
      return 'Couldn\u2019t reach the database. Please check your connection and press Try again.';
    }

    /* ---- shared EOI editor (slide-over appended to <body>) ---- */
    var EOIEditor = (function(){
      var built = false, editing = null, onSaved = null, els = {};
      function build(){
        if(built) return;
        var form = ''
          + '<div class="frm">'
          +   '<div class="fld span2"><label for="eoOffice">Office *</label><select id="eoOffice"></select><small class="fe" id="eoOfficeErr"></small></div>'
          +   '<div class="fld"><label for="eoSent">Date sent</label><input id="eoSent" type="date"></div>'
          +   '<div class="fld"><label for="eoStatusF">Status</label><select id="eoStatusF"><option value="draft">Draft</option><option value="sent">Sent</option><option value="under_review">Under review</option><option value="signed">Signed</option><option value="declined">Declined</option></select></div>'
          +   '<div class="fld span2"><label for="eoSigned">Signed date</label><input id="eoSigned" type="date"><small class="fld-hint">Filled in automatically when you set the status to Signed \u2014 you can change it.</small></div>'
          +   '<div class="fld span2"><label for="eoNotes">Notes</label><textarea id="eoNotes" rows="3" placeholder="Anything to remember about this EOI\u2026"></textarea></div>'
          + '</div>';
        var html = ''
          + '<div class="ov-scrim l2" id="eoScrim"></div>'
          + '<aside class="ov l2" id="eoOv" aria-hidden="true" aria-label="EOI details">'
          +   '<div class="ov-head"><h2 id="eoTitle" class="display">Add EOI</h2><button class="icon-btn" id="eoClose" aria-label="Close">'+SVG_X+'</button></div>'
          +   '<div class="ov-body">'+form+'</div>'
          +   '<div class="ov-foot"><div class="ov-err" id="eoErr"></div><button class="btn-out" id="eoCancel">Cancel</button><button class="btn-primary" id="eoSave"><span>Save EOI</span></button></div>'
          + '</aside>';
        var wrap = document.createElement('div'); wrap.innerHTML = html; while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
        els.scrim = document.getElementById('eoScrim'); els.ov = document.getElementById('eoOv');
        document.getElementById('eoClose').addEventListener('click', close);
        document.getElementById('eoCancel').addEventListener('click', close);
        els.scrim.addEventListener('click', close);
        document.getElementById('eoSave').addEventListener('click', save);
        document.getElementById('eoStatusF').addEventListener('change', function(){ var st = document.getElementById('eoStatusF').value; var sd = document.getElementById('eoSigned'); if(st === 'signed' && !sd.value) sd.value = todayStr(); });
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && els.ov.classList.contains('show')) close(); });
        built = true;
      }
      async function fillOffices(selId){
        var sel = document.getElementById('eoOffice'); sel.innerHTML = '<option value="">Loading\u2026</option>';
        try{
          var res = await sb.from('offices').select('id,name').order('name', { ascending:true });
          if(res.error) throw res.error;
          var list = res.data || [];
          if(list.length === 0){ sel.innerHTML = '<option value="">No offices yet</option>'; }
          else { sel.innerHTML = '<option value="">Select an office\u2026</option>' + list.map(function(o){ return '<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>'; }).join(''); }
          if(selId) sel.value = selId;
        }catch(e){ sel.innerHTML = '<option value="">Could not load offices</option>'; }
      }
      function show(on){
        if(on){ els.scrim.classList.add('show'); els.ov.classList.add('show'); els.ov.setAttribute('aria-hidden','false'); }
        else { els.scrim.classList.remove('show'); els.ov.classList.remove('show'); els.ov.setAttribute('aria-hidden','true'); }
      }
      function open(eo, presetOfficeId, savedCb){
        build();
        editing = eo || null; onSaved = savedCb || null;
        document.getElementById('eoTitle').textContent = eo ? 'Edit EOI' : 'Add EOI';
        document.getElementById('eoSent').value = (eo && eo.date_sent) ? String(eo.date_sent).slice(0,10) : '';
        document.getElementById('eoStatusF').value = (eo && eo.status) || 'draft';
        document.getElementById('eoSigned').value = (eo && eo.signed_date) ? String(eo.signed_date).slice(0,10) : '';
        document.getElementById('eoNotes').value = (eo && eo.notes) || '';
        document.getElementById('eoOfficeErr').textContent = ''; document.getElementById('eoErr').textContent = '';
        show(true);
        fillOffices(eo ? eo.office_id : (presetOfficeId || ''));
      }
      function close(){ show(false); }
      async function save(){
        var officeId = document.getElementById('eoOffice').value;
        document.getElementById('eoOfficeErr').textContent = ''; document.getElementById('eoErr').textContent = '';
        if(!officeId){ document.getElementById('eoOfficeErr').textContent = 'Please choose an office.'; return; }
        var status = document.getElementById('eoStatusF').value || 'draft';
        var signed = nn(document.getElementById('eoSigned').value);
        if(status === 'signed' && !signed){ signed = todayStr(); }
        var payload = { office_id: officeId, date_sent: nn(document.getElementById('eoSent').value), status: status, signed_date: signed, notes: nn(document.getElementById('eoNotes').value) };
        var btn = document.getElementById('eoSave'), span = btn.querySelector('span'); var label = span ? span.textContent : '';
        btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
        try{
          if(!editing){ payload.user_id = await ownerId(); }
          var res = editing
            ? await sb.from('eois').update(payload).eq('id', editing.id).select().single()
            : await sb.from('eois').insert(payload).select().single();
          if(res.error) throw res.error;
          var wasEdit = !!editing; close();
          toast(wasEdit ? 'EOI updated' : 'EOI added');
          if(onSaved) onSaved();
        }catch(e){ document.getElementById('eoErr').textContent = friendlyShort(e); }
        finally{ btn.disabled = false; if(span) span.textContent = label || 'Save EOI'; }
      }
      return { open: open };
    })();

    /* ---- office drawer: EOI history ---- */
    function renderOfficeEoiHistory(o){
      var box = document.getElementById('ofEoiHistory'); if(!box) return;
      if(!o){ box.innerHTML = '<div class="divider-lab">EOI history</div><p class="hist-hint">Save this office first, then you can record EOIs against it.</p>'; return; }
      box.innerHTML = '<div class="hist-head"><div class="divider-lab">EOI history</div><button class="btn-soft" id="ofNewEoi">'+ic('plus')+' New EOI</button></div><div id="ofEoiList" class="hist"><div class="hist-loading">Loading\u2026</div></div>';
      document.getElementById('ofNewEoi').addEventListener('click', function(){ EOIEditor.open(null, o.id, function(){ loadOfficeEoiHistory(o); }); });
      loadOfficeEoiHistory(o);
    }
    async function loadOfficeEoiHistory(o){
      var list = document.getElementById('ofEoiList'); if(!list) return;
      list.innerHTML = '<div class="hist-loading">Loading\u2026</div>';
      try{
        var res = await sb.from('eois').select('*').eq('office_id', o.id).order('date_sent', { ascending:false, nullsFirst:false });
        if(res.error) throw res.error;
        var es = res.data || [];
        if(es.length === 0){ list.innerHTML = '<p class="hist-empty">No EOIs recorded yet.</p>'; return; }
        list.innerHTML = es.map(eoiHistItem).join('');
        Array.prototype.forEach.call(list.querySelectorAll('[data-eoi]'), function(el){
          el.addEventListener('click', function(){ var e = es.filter(function(x){ return String(x.id) === String(el.getAttribute('data-eoi')); })[0]; EOIEditor.open(e, o.id, function(){ loadOfficeEoiHistory(o); }); });
        });
      }catch(e){
        var mm = ((e && e.message) || '').toLowerCase(); var setup = (mm.indexOf('schema cache') >= 0 || mm.indexOf('does not exist') >= 0 || mm.indexOf('could not find the table') >= 0 || (e && e.code) === 'PGRST205');
        list.innerHTML = '<p class="hist-empty">'+(setup ? 'Run the eois setup SQL to enable EOI history.' : 'Couldn\u2019t load EOIs.')+'</p>';
      }
    }
    function eoiHistItem(e){
      var sm = eoiStatusMeta(e.status);
      var when = e.date_sent ? ('Sent '+fmtDate(e.date_sent)) : 'Not sent yet';
      var snip = e.notes || (e.signed_date ? ('Signed '+fmtDate(e.signed_date)) : '');
      return '<div class="hist-item" data-eoi="'+esc(e.id)+'"><div class="hist-top"><span class="hist-when">'+esc(when)+'</span>'
        + '<span class="spill-static" style="color:'+sm.c+';background-color:'+sm.bg+'">'+sm.label+'</span></div>'
        + (snip ? '<div class="hist-snip">'+esc(snip)+'</div>' : '')
        + '</div>';
    }

    /* =========================================================
       DOCUMENTS — PDFs stored in Supabase Storage, linked to an
       office. Metadata in public.documents; files in the
       'office-documents' bucket. (run documents-setup.sql once)
       ========================================================= */
    var DOC_BUCKET = 'office-documents';
    function fmtBytes(n){ n = +n || 0; if(n < 1024) return n+' B'; if(n < 1048576) return Math.round(n/1024)+' KB'; return (n/1048576).toFixed(1)+' MB'; }

    function renderOfficeDocs(o){
      var box = document.getElementById('ofDocs'); if(!box) return;
      if(!o){ box.innerHTML = '<div class="divider-lab">Documents</div><p class="hist-hint">Save this office first, then you can upload documents for it.</p>'; return; }
      box.innerHTML = '<div class="hist-head"><div class="divider-lab">Documents</div><button class="btn-soft" id="ofDocUpload">'+ic('upload')+' Upload PDF</button></div><div id="ofDocsList" class="docs"><div class="hist-loading">Loading\u2026</div></div>';
      var input = document.getElementById('ofDocInput');
      document.getElementById('ofDocUpload').addEventListener('click', function(){ if(input){ input.value = ''; input.click(); } });
      if(input){ input.onchange = function(){ var f = input.files && input.files[0]; if(f) uploadDoc(o, f); }; }
      loadOfficeDocs(o);
    }
    async function loadOfficeDocs(o){
      var list = document.getElementById('ofDocsList'); if(!list) return;
      list.innerHTML = '<div class="hist-loading">Loading\u2026</div>';
      try{
        var res = await sb.from('documents').select('*').eq('office_id', o.id).order('created_at', { ascending:false });
        if(res.error) throw res.error;
        var ds = res.data || [];
        if(ds.length === 0){ list.innerHTML = '<p class="doc-empty">No documents yet.</p>'; return; }
        list.innerHTML = ds.map(docItem).join('');
        function pick(id){ return ds.filter(function(x){ return String(x.id) === String(id); })[0]; }
        Array.prototype.forEach.call(list.querySelectorAll('[data-docview]'), function(b){ b.addEventListener('click', function(){ viewDoc(pick(b.getAttribute('data-docview'))); }); });
        Array.prototype.forEach.call(list.querySelectorAll('[data-docdl]'), function(b){ b.addEventListener('click', function(){ downloadDoc(pick(b.getAttribute('data-docdl'))); }); });
        Array.prototype.forEach.call(list.querySelectorAll('[data-docdel]'), function(b){ b.addEventListener('click', function(){ confirmDocDelete(o, pick(b.getAttribute('data-docdel'))); }); });
      }catch(e){ list.innerHTML = '<p class="doc-empty">'+friendlyDocError(e)+'</p>'; }
    }
    function docItem(d){
      return '<div class="doc-item" data-doc="'+esc(d.id)+'"><span class="doc-ic">'+ic('file')+'</span>'
        + '<div class="doc-meta"><div class="doc-name">'+esc(d.name || 'Document.pdf')+'</div><div class="doc-sub">'+(d.size ? fmtBytes(d.size)+' \u00b7 ' : '')+esc(fmtDate(d.created_at))+'</div></div>'
        + '<div class="doc-act">'
        +   '<button class="ia" data-docview="'+esc(d.id)+'" title="View" aria-label="View">'+ic('eye')+'</button>'
        +   '<button class="ia" data-docdl="'+esc(d.id)+'" title="Download" aria-label="Download">'+ic('download')+'</button>'
        +   '<button class="ia danger" data-docdel="'+esc(d.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button>'
        + '</div></div>';
    }
    async function uploadDoc(o, file){
      if(!file) return;
      var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
      if(!isPdf){ toast('Please choose a PDF file', 'err'); return; }
      if(file.size > 26214400){ toast('That file is over 25 MB', 'err'); return; }
      var btn = document.getElementById('ofDocUpload'); var blabel = btn ? btn.innerHTML : '';
      if(btn){ btn.disabled = true; btn.innerHTML = ic('upload')+' Uploading\u2026'; }
      try{
        var safe = (file.name || 'document.pdf').replace(/[^a-zA-Z0-9._-]/g, '_');
        var path = 'office-'+o.id+'/'+Date.now()+'-'+safe;
        var up = await sb.storage.from(DOC_BUCKET).upload(path, file, { contentType:'application/pdf', upsert:false });
        if(up.error) throw up.error;
        var owner = await ownerId();
        var ins = await sb.from('documents').insert({ office_id:o.id, name:(file.name || safe), path:path, size:file.size, mime:'application/pdf', user_id:owner }).select().single();
        if(ins.error){ try{ await sb.storage.from(DOC_BUCKET).remove([path]); }catch(_e){} throw ins.error; }
        toast('Document uploaded'); loadOfficeDocs(o);
      }catch(e){ toast(friendlyDocError(e), 'err'); }
      finally{ if(btn){ btn.disabled = false; btn.innerHTML = blabel; } }
    }
    async function viewDoc(d){
      if(!d) return;
      try{ var r = await sb.storage.from(DOC_BUCKET).createSignedUrl(d.path, 3600); if(r.error) throw r.error; window.open(r.data.signedUrl, '_blank'); }
      catch(e){ toast(friendlyDocError(e), 'err'); }
    }
    async function downloadDoc(d){
      if(!d) return;
      try{
        var r = await sb.storage.from(DOC_BUCKET).createSignedUrl(d.path, 3600, { download: d.name || true });
        if(r.error) throw r.error;
        var a = document.createElement('a'); a.href = r.data.signedUrl; a.download = d.name || 'document.pdf'; document.body.appendChild(a); a.click(); a.remove();
      }catch(e){ toast(friendlyDocError(e), 'err'); }
    }
    function confirmDocDelete(o, d){
      if(!d) return;
      confirmDialog('Delete document?', 'Delete <b>'+esc(d.name || 'this document')+'</b>? This permanently removes the file.', async function(){
        try{ await sb.storage.from(DOC_BUCKET).remove([d.path]); }catch(_e){}
        var del = await sb.from('documents').delete().eq('id', d.id);
        if(del.error){ toast(friendlyShort(del.error), 'err'); throw del.error; }
        toast('Document deleted'); loadOfficeDocs(o);
      });
    }
    function friendlyDocError(e){
      var m = ((e && (e.message || e.error || e.hint)) || '').toLowerCase(); var code = e && (e.statusCode || e.code);
      if(m.indexOf('bucket not found') >= 0) return 'Document storage isn\u2019t set up yet. Run documents-setup.sql in your Supabase SQL editor.';
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0 || (m.indexOf('does not exist') >= 0 && m.indexOf('documents') >= 0))
        return 'The documents table isn\u2019t set up yet. Run documents-setup.sql, then try again.';
      if(code === '42501' || code === '403' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0 || m.indexOf('unauthorized') >= 0)
        return 'Storage blocked that action. Re-run documents-setup.sql to add the access rules.';
      if(m.indexOf('exceeded') >= 0 || m.indexOf('too large') >= 0 || m.indexOf('maximum allowed size') >= 0) return 'That file is too large to upload.';
      return 'Couldn\u2019t complete that document action. Please try again.';
    }

    /* =========================================================
       NOTES — free-form notes, optionally linked to an office.
       Pinned notes float to the top. Table: public.notes
       (run notes-setup.sql once). Shown as a card grid.
       ========================================================= */
    var NT = { all:[], offices:{}, officeList:null, q:'', filter:'all', loading:true };

    function sortNotes(arr){
      return arr.slice().sort(function(a,b){
        if(!!b.pinned !== !!a.pinned) return (b.pinned?1:0) - (a.pinned?1:0);
        var at = a.updated_at || a.created_at || '', bt = b.updated_at || b.created_at || '';
        return at < bt ? 1 : at > bt ? -1 : 0;
      });
    }

    function notesView(){
      return ''
        + '<div class="view-head">'
        +   '<div class="vh-sub">Free-form notes \u2014 reminders, call summaries, anything worth keeping. Pin the important ones to the top.</div>'
        +   '<div class="tools">'
        +     '<div class="search">'+SVG_SEARCH+'<input id="ntSearch" type="search" placeholder="Search notes\u2026" autocomplete="off"></div>'
        +     '<button class="btn-primary" id="ntAdd">'+ic('plus')+'<span>Add note</span></button>'
        +   '</div>'
        + '</div>'
        + '<div class="summary" id="ntSummary"></div>'
        + '<div class="chips" id="ntChips"></div>'
        + '<div id="ntBody"><div class="loading">Loading notes\u2026</div></div>';
    }

    function notesMount(){
      var body = document.getElementById('ntBody');
      if(!sb){ if(body) body.innerHTML = errBox('Not connected to the database yet.'); return; }
      var s = document.getElementById('ntSearch'); s.addEventListener('input', function(){ NT.q = s.value.trim().toLowerCase(); renderNtList(); });
      document.getElementById('ntAdd').addEventListener('click', function(){ NoteEditor.open(null, loadNotes); });
      loadNotes();
    }

    async function loadNotes(){
      NT.loading = true;
      var body = document.getElementById('ntBody'); if(body) body.innerHTML = '<div class="loading">Loading notes\u2026</div>';
      try{
        var offRes = await sb.from('offices').select('id,name').order('name', { ascending:true });
        if(offRes.error) throw offRes.error;
        NT.officeList = offRes.data || []; NT.offices = {}; NT.officeList.forEach(function(o){ NT.offices[o.id] = o; });
        var res = await sb.from('notes').select('*').order('updated_at', { ascending:false });
        if(res.error) throw res.error;
        NT.all = sortNotes(res.data || []); NT.loading = false;
        renderNtSummary(); renderNtChips(); renderNtList();
      }catch(e){
        NT.loading = false;
        if(body){ body.innerHTML = errBox(friendlyNtError(e)); var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadNotes); }
        renderNtSummary(); renderNtChips();
      }
    }

    function renderNtSummary(){
      var el = document.getElementById('ntSummary'); if(!el) return;
      var pinned = NT.all.filter(function(n){ return n.pinned; }).length;
      var linked = NT.all.filter(function(n){ return !!n.office_id; }).length;
      el.innerHTML = stat('Total notes', NT.all.length) + stat('Pinned', pinned) + stat('Linked to offices', linked);
    }

    function renderNtChips(){
      var el = document.getElementById('ntChips'); if(!el) return;
      var pinned = NT.all.filter(function(n){ return n.pinned; }).length;
      var defs = [{ id:'all', label:'All', ct:NT.all.length },{ id:'pinned', label:'Pinned', ct:pinned }];
      el.innerHTML = defs.map(function(d){ var active = NT.filter === d.id; return '<button class="chip'+(active?' active':'')+'" data-nf="'+d.id+'">'+d.label+' <span class="ct">'+d.ct+'</span></button>'; }).join('');
      Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b){ b.addEventListener('click', function(){ NT.filter = b.getAttribute('data-nf'); renderNtChips(); renderNtList(); }); });
    }

    function renderNtList(){
      var body = document.getElementById('ntBody'); if(!body || NT.loading) return;
      if(NT.all.length === 0){
        body.innerHTML = ntEmpty();
        var b = document.getElementById('ntAddEmpty'); if(b) b.addEventListener('click', function(){ NoteEditor.open(null, loadNotes); });
        return;
      }
      var rows = NT.all.filter(function(n){
        if(NT.filter === 'pinned' && !n.pinned) return false;
        if(NT.q){ var off = n.office_id ? NT.offices[n.office_id] : null; var hay = ((n.title||'')+' '+(n.body||'')+' '+((off&&off.name)||'')).toLowerCase(); if(hay.indexOf(NT.q) < 0) return false; }
        return true;
      });
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No notes match your search or filter.</div>'; return; }
      body.innerHTML = '<div class="notes-grid">' + rows.map(noteCard).join('') + '</div>';
      wireNtCards();
    }

    function noteCard(n){
      var off = n.office_id ? NT.offices[n.office_id] : null;
      var title = (n.title || '').trim();
      var body = (n.body || '').trim();
      var when = timeAgo(n.updated_at || n.created_at);
      return ''
        + '<div class="note-card'+(n.pinned?' pinned':'')+'" data-id="'+esc(n.id)+'">'
        +   '<button class="note-pin'+(n.pinned?' on':'')+'" data-pin="'+esc(n.id)+'" title="'+(n.pinned?'Unpin':'Pin to top')+'" aria-label="'+(n.pinned?'Unpin':'Pin to top')+'">'+ic('pin')+'</button>'
        +   '<div class="note-main" data-edit>'
        +     (title ? '<div class="note-title">'+esc(title)+'</div>' : '')
        +     (body ? '<div class="note-body'+(title?'':' notitle')+'">'+esc(body)+'</div>' : (title ? '' : '<div class="note-body dim">Empty note</div>'))
        +   '</div>'
        +   '<div class="note-foot">'
        +     '<div class="note-meta">'+(off?'<span class="note-office">'+ic('building')+esc(off.name)+'</span>':'')+(when?'<span class="note-when">Edited '+esc(when)+'</span>':'')+'</div>'
        +     '<div class="note-act"><button class="ia" data-nedit="'+esc(n.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-ndel="'+esc(n.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button></div>'
        +   '</div>'
        + '</div>';
    }

    function wireNtCards(){
      var body = document.getElementById('ntBody');
      Array.prototype.forEach.call(body.querySelectorAll('[data-pin]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); togglePin(b.getAttribute('data-pin')); }); });
      Array.prototype.forEach.call(body.querySelectorAll('.note-main[data-edit]'), function(c){ c.addEventListener('click', function(){ var n = findNote(c.closest('.note-card').getAttribute('data-id')); if(n) NoteEditor.open(n, loadNotes); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-nedit]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); var n = findNote(b.getAttribute('data-nedit')); if(n) NoteEditor.open(n, loadNotes); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-ndel]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); confirmNoteDelete(findNote(b.getAttribute('data-ndel'))); }); });
    }
    function findNote(id){ return NT.all.filter(function(n){ return String(n.id) === String(id); })[0]; }

    async function togglePin(id){
      var n = findNote(id); if(!n) return;
      var newval = !n.pinned;
      try{
        var res = await sb.from('notes').update({ pinned: newval }).eq('id', id).select().single();
        if(res.error) throw res.error;
        n.pinned = newval; NT.all = sortNotes(NT.all);
        renderNtSummary(); renderNtChips(); renderNtList();
        toast(newval ? 'Pinned to top' : 'Unpinned');
      }catch(err){ toast(friendlyShort(err), 'err'); loadNotes(); }
    }

    function confirmNoteDelete(n){
      if(!n) return;
      var has = (n.title || n.body || '').trim();
      var label = (n.title || '').trim() || (n.body || '').trim();
      if(label.length > 44) label = label.slice(0, 44) + '\u2026';
      var msg = has ? ('Delete \u201c<b>'+esc(label)+'</b>\u201d? This can\u2019t be undone.') : 'Delete this note? This can\u2019t be undone.';
      confirmDialog('Delete note?', msg, async function(){
        var res = await sb.from('notes').delete().eq('id', n.id);
        if(res.error){ toast(friendlyShort(res.error), 'err'); throw res.error; }
        toast('Note deleted'); loadNotes();
      });
    }

    function ntEmpty(){
      return '<div class="empty"><span class="ptile">'+ic('note')+'</span><h2 class="display">No notes yet</h2>'
        + '<p>Jot down anything \u2014 a reminder, a call summary, a thought about an office. Pin the important ones to keep them up top.</p>'
        + '<button class="btn-primary" id="ntAddEmpty">'+ic('plus')+'<span>Write your first note</span></button></div>';
    }

    function friendlyNtError(e){
      var m = ((e && (e.message || e.hint || e.details)) || '').toLowerCase(); var code = e && e.code;
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0)
        return 'The <b>notes</b> table isn\u2019t set up yet. Run the one-time setup SQL (notes-setup.sql) in your Supabase SQL editor, then press Try again.';
      if(code === '42501' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0)
        return 'Your database blocked that request. Make sure you ran the full setup SQL and that you\u2019re signed in.';
      return 'Couldn\u2019t reach the database. Please check your connection and press Try again.';
    }

    /* ---- shared note editor (slide-over appended to <body>) ---- */
    var NoteEditor = (function(){
      var built = false, editing = null, onSaved = null, els = {};
      function build(){
        if(built) return;
        var form = ''
          + '<div class="frm">'
          +   '<div class="fld span2"><label for="ntTitle">Title <span class="opt">(optional)</span></label><input id="ntTitle" type="text" placeholder="Give it a short title\u2026" maxlength="160"></div>'
          +   '<div class="fld span2"><label for="ntBodyF">Note</label><textarea id="ntBodyF" rows="8" placeholder="Write your note\u2026"></textarea><small class="fe" id="ntErrF"></small></div>'
          +   '<div class="fld span2"><label for="ntOffice">Link to an office <span class="opt">(optional)</span></label><select id="ntOffice"></select></div>'
          +   '<div class="fld span2"><label class="chkline"><input type="checkbox" id="ntPin"> <span>Pin this note to the top</span></label></div>'
          + '</div>';
        var html = ''
          + '<div class="ov-scrim l2" id="ntScrim"></div>'
          + '<aside class="ov l2" id="ntOv" aria-hidden="true" aria-label="Note">'
          +   '<div class="ov-head"><h2 id="ntTitleH" class="display">New note</h2><button class="icon-btn" id="ntClose" aria-label="Close">'+SVG_X+'</button></div>'
          +   '<div class="ov-body">'+form+'</div>'
          +   '<div class="ov-foot"><div class="ov-err" id="ntErr"></div><button class="btn-out" id="ntCancel">Cancel</button><button class="btn-primary" id="ntSave"><span>Save note</span></button></div>'
          + '</aside>';
        var wrap = document.createElement('div'); wrap.innerHTML = html; while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
        els.scrim = document.getElementById('ntScrim'); els.ov = document.getElementById('ntOv');
        document.getElementById('ntClose').addEventListener('click', close);
        document.getElementById('ntCancel').addEventListener('click', close);
        els.scrim.addEventListener('click', close);
        document.getElementById('ntSave').addEventListener('click', save);
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && els.ov.classList.contains('show')) close(); });
        built = true;
      }
      async function fillOffices(selId){
        var sel = document.getElementById('ntOffice'); sel.innerHTML = '<option value="">Loading\u2026</option>';
        try{
          var res = await sb.from('offices').select('id,name').order('name', { ascending:true });
          if(res.error) throw res.error;
          var list = res.data || [];
          sel.innerHTML = '<option value="">\u2014 No office \u2014</option>' + list.map(function(o){ return '<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>'; }).join('');
          if(selId) sel.value = selId;
        }catch(e){ sel.innerHTML = '<option value="">\u2014 No office \u2014</option>'; }
      }
      function show(on){
        if(on){ els.scrim.classList.add('show'); els.ov.classList.add('show'); els.ov.setAttribute('aria-hidden','false'); }
        else { els.scrim.classList.remove('show'); els.ov.classList.remove('show'); els.ov.setAttribute('aria-hidden','true'); }
      }
      function open(note, savedCb){
        build();
        editing = note || null; onSaved = savedCb || null;
        document.getElementById('ntTitleH').textContent = note ? 'Edit note' : 'New note';
        document.getElementById('ntTitle').value = (note && note.title) || '';
        document.getElementById('ntBodyF').value = (note && note.body) || '';
        document.getElementById('ntPin').checked = !!(note && note.pinned);
        document.getElementById('ntErrF').textContent = ''; document.getElementById('ntErr').textContent = '';
        show(true);
        setTimeout(function(){ var t = document.getElementById('ntTitle'); if(t) t.focus(); }, 80);
        fillOffices(note ? note.office_id : '');
      }
      function close(){ show(false); }
      async function save(){
        var title = nn(document.getElementById('ntTitle').value);
        var bodyv = nn(document.getElementById('ntBodyF').value);
        document.getElementById('ntErrF').textContent = ''; document.getElementById('ntErr').textContent = '';
        if(!title && !bodyv){ document.getElementById('ntErrF').textContent = 'Add a title or some text first.'; var b = document.getElementById('ntBodyF'); if(b) b.focus(); return; }
        var payload = { title: title, body: bodyv, office_id: (document.getElementById('ntOffice').value || null), pinned: document.getElementById('ntPin').checked };
        var btn = document.getElementById('ntSave'), span = btn.querySelector('span'); var label = span ? span.textContent : '';
        btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
        try{
          if(!editing){ payload.user_id = await ownerId(); }
          var res = editing
            ? await sb.from('notes').update(payload).eq('id', editing.id).select().single()
            : await sb.from('notes').insert(payload).select().single();
          if(res.error) throw res.error;
          var wasEdit = !!editing; close();
          toast(wasEdit ? 'Note updated' : 'Note added');
          if(onSaved) onSaved();
        }catch(e){ document.getElementById('ntErr').textContent = friendlyShort(e); }
        finally{ btn.disabled = false; if(span) span.textContent = label || 'Save note'; }
      }
      return { open: open };
    })();

    /* =========================================================
       FOUNDING OFFICES — a stable, numbered registry of signed
       founding partners. Linked to offices; numbers are assigned
       sequentially (#001, #002, ...) and never change.
       Table: public.founding_offices (run founding-offices-setup.sql).
       ========================================================= */
    function foNumLabel(n){ n = parseInt(n, 10); if(isNaN(n) || n < 1) return '#\u2014'; return '#' + String(n).padStart(3, '0'); }
    function inThisMonth(d){ if(!d) return false; var s = String(d).slice(0,7); var now = new Date(); return s === (now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0')); }

    var FO = { all:[], offices:{}, officeList:null, foundingIds:{}, q:'', loading:true };

    function foundingView(){
      return ''
        + '<div class="view-head">'
        +   '<div class="vh-sub">Your signed founding partners \u2014 each with a permanent founding number.</div>'
        +   '<div class="tools">'
        +     '<div class="search">'+SVG_SEARCH+'<input id="foSearch" type="search" placeholder="Search office, notes\u2026" autocomplete="off"></div>'
        +     '<button class="btn-primary" id="foAdd">'+ic('plus')+'<span>Add founding office</span></button>'
        +   '</div>'
        + '</div>'
        + '<div class="summary" id="foSummary"></div>'
        + '<div id="foBody"><div class="loading">Loading founding offices\u2026</div></div>';
    }

    function foundingMount(){
      var body = document.getElementById('foBody');
      if(!sb){ if(body) body.innerHTML = errBox('Not connected to the database yet.'); return; }
      var s = document.getElementById('foSearch'); s.addEventListener('input', function(){ FO.q = s.value.trim().toLowerCase(); renderFoList(); });
      document.getElementById('foAdd').addEventListener('click', function(){
        if(FO.officeList && FO.officeList.length === 0){ toast('Add an office first', 'err'); return; }
        var available = availableFoundingOffices();
        if(available.length === 0){ toast('All your offices are already founding offices', 'err'); return; }
        FoundingEditor.open({ available: available });
      });
      loadFounding();
    }

    function availableFoundingOffices(){ return (FO.officeList || []).filter(function(o){ return !FO.foundingIds[o.id]; }); }
    function foOfficeName(f){ var o = f.office_id ? FO.offices[f.office_id] : null; return (o && o.name) || f.office_name || 'Unknown office'; }

    async function loadFounding(){
      FO.loading = true;
      var body = document.getElementById('foBody'); if(body) body.innerHTML = '<div class="loading">Loading founding offices\u2026</div>';
      try{
        var offRes = await sb.from('offices').select('id,name,suburb').order('name', { ascending:true });
        if(offRes.error) throw offRes.error;
        FO.officeList = offRes.data || []; FO.offices = {}; FO.officeList.forEach(function(o){ FO.offices[o.id] = o; });
        var res = await sb.from('founding_offices').select('*').order('number', { ascending:true });
        if(res.error) throw res.error;
        FO.all = res.data || []; FO.foundingIds = {}; FO.all.forEach(function(f){ if(f.office_id) FO.foundingIds[f.office_id] = true; });
        FO.loading = false;
        renderFoSummary(); renderFoList();
      }catch(e){
        FO.loading = false;
        if(body){ body.innerHTML = errBox(friendlyFoError(e)); var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadFounding); }
        renderFoSummary();
      }
    }

    function renderFoSummary(){
      var el = document.getElementById('foSummary'); if(!el) return;
      var month = FO.all.filter(function(f){ return inThisMonth(f.date_signed); }).length;
      var max = FO.all.reduce(function(m, f){ return Math.max(m, f.number || 0); }, 0);
      el.innerHTML = stat('Founding offices', FO.all.length) + stat('Signed this month', month) + stat('Most recent', FO.all.length ? foNumLabel(max) : '\u2014');
    }

    function renderFoList(){
      var body = document.getElementById('foBody'); if(!body || FO.loading) return;
      if(FO.all.length === 0){
        body.innerHTML = foEmpty();
        var b = document.getElementById('foAddEmpty'); if(b) b.addEventListener('click', function(){ var a = availableFoundingOffices(); if(a.length === 0){ toast('Add an office first', 'err'); return; } FoundingEditor.open({ available:a }); });
        return;
      }
      var rows = FO.all.filter(function(f){
        if(FO.q){ var hay = ((foOfficeName(f) || '') + ' ' + (f.notes || '')).toLowerCase(); if(hay.indexOf(FO.q) < 0) return false; }
        return true;
      });
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No founding offices match your search.</div>'; return; }
      body.innerHTML = '<div class="fo-list">' + rows.map(foRow).join('') + '</div>';
      wireFoRows();
    }

    function foRow(f){
      var name = foOfficeName(f);
      var signed = f.date_signed ? ('Signed ' + fmtDate(f.date_signed)) : 'Date not set';
      return ''
        + '<div class="fo-row" data-id="'+esc(f.id)+'">'
        +   '<div class="fo-badge" data-edit>'+foNumLabel(f.number)+'</div>'
        +   '<div class="fo-main" data-edit><div class="fo-name">'+esc(name)+'</div><div class="fo-sub">'+esc(signed)+(f.notes ? ' \u00b7 ' + esc(f.notes) : '')+'</div></div>'
        +   '<div class="c-act"><button class="ia" data-foedit="'+esc(f.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-fodel="'+esc(f.id)+'" title="Remove" aria-label="Remove">'+SVG_TRASH+'</button></div>'
        + '</div>';
    }

    function wireFoRows(){
      var body = document.getElementById('foBody');
      Array.prototype.forEach.call(body.querySelectorAll('[data-foedit]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); var f = findFo(b.getAttribute('data-foedit')); if(f) FoundingEditor.open({ editing:f }); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-fodel]'), function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation(); confirmFoDelete(findFo(b.getAttribute('data-fodel'))); }); });
      Array.prototype.forEach.call(body.querySelectorAll('.fo-row [data-edit]'), function(c){ c.addEventListener('click', function(){ var f = findFo(c.closest('.fo-row').getAttribute('data-id')); if(f) FoundingEditor.open({ editing:f }); }); });
    }
    function findFo(id){ return FO.all.filter(function(f){ return String(f.id) === String(id); })[0]; }

    function confirmFoDelete(f){
      if(!f) return; var name = foOfficeName(f);
      confirmDialog('Remove founding office?', 'Remove <b>'+esc(name)+'</b> ('+foNumLabel(f.number)+') from your founding registry? The office itself stays \u2014 only its founding status is removed.', async function(){
        var res = await sb.from('founding_offices').delete().eq('id', f.id);
        if(res.error){ toast(friendlyShort(res.error), 'err'); throw res.error; }
        toast('Founding office removed'); loadFounding();
      });
    }

    function foEmpty(){
      if(FO.officeList && FO.officeList.length === 0){
        return '<div class="empty"><span class="ptile">'+ic('star')+'</span><h2 class="display">No founding offices yet</h2>'
          + '<p>Founding offices are your signed launch partners. Add an office first, then convert it from its own record \u2014 or with the button above.</p>'
          + '<a class="btn-primary" href="#/offices">'+ic('building')+'<span>Go to Offices</span></a></div>';
      }
      return '<div class="empty"><span class="ptile">'+ic('star')+'</span><h2 class="display">No founding offices yet</h2>'
        + '<p>When an office signs on as a founding partner, convert it here or from the office\u2019s own record. Each one gets a permanent founding number, starting at '+foNumLabel(1)+'.</p>'
        + '<button class="btn-primary" id="foAddEmpty">'+ic('plus')+'<span>Add your first founding office</span></button></div>';
    }

    function friendlyFoError(e){
      var m = ((e && (e.message || e.hint || e.details)) || '').toLowerCase(); var code = e && e.code;
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0)
        return 'The <b>founding_offices</b> table isn\u2019t set up yet. Run the one-time setup SQL (founding-offices-setup.sql) in your Supabase SQL editor, then press Try again.';
      if(code === '42501' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0)
        return 'Your database blocked that request. Make sure you ran the full setup SQL and that you\u2019re signed in.';
      return 'Couldn\u2019t reach the database. Please check your connection and press Try again.';
    }

    /* ---- shared numbering + creation (used by editor and convert) ---- */
    async function nextFoundingNumber(){
      var res = await sb.from('founding_offices').select('number');
      if(res.error) throw res.error;
      var max = (res.data || []).reduce(function(m, r){ return Math.max(m, r.number || 0); }, 0);
      return max + 1;
    }
    async function createFoundingOffice(officeId, officeName, dateSigned, notes){
      var lastErr = null, owner = await ownerId();
      for(var attempt = 0; attempt < 2; attempt++){
        var number = await nextFoundingNumber();
        var ins = await sb.from('founding_offices').insert({ office_id:officeId, office_name:officeName, number:number, date_signed:dateSigned, notes:notes, user_id:owner }).select().single();
        if(!ins.error) return ins;
        lastErr = ins.error; var code = ins.error.code || ''; var msg = (ins.error.message || '').toLowerCase();
        if(code === '23505' && msg.indexOf('number') >= 0){ continue; }   // number race — retry with fresh number
        return ins;                                                       // office already founding, or other error
      }
      return { error: lastErr || { message:'Could not assign a founding number.' } };
    }
    async function markOfficeSigned(officeId){ try{ await sb.from('offices').update({ stage:'signed' }).eq('id', officeId); }catch(e){} }

    /* ---- shared founding editor (slide-over appended to <body>) ---- */
    var FoundingEditor = (function(){
      var built = false, mode = 'add', editing = null, presetOffice = null, available = null, onSaved = null, els = {};
      function build(){
        if(built) return;
        var form = ''
          + '<div class="frm">'
          +   '<div class="fld span2"><label for="foOffice">Office *</label><select id="foOffice"></select><div class="fo-office-fixed" id="foOfficeFixed" style="display:none"></div><small class="fe" id="foOfficeErr"></small></div>'
          +   '<div class="fld"><label>Founding number</label><div class="fo-num-preview" id="foNumPreview">#\u2014</div></div>'
          +   '<div class="fld"><label for="foSigned">Date signed</label><input id="foSigned" type="date"></div>'
          +   '<div class="fld span2"><label for="foNotes">Notes</label><textarea id="foNotes" rows="3" placeholder="Anything to remember about this founding office\u2026"></textarea></div>'
          + '</div>';
        var html = ''
          + '<div class="ov-scrim l2" id="foScrim"></div>'
          + '<aside class="ov l2" id="foOv" aria-hidden="true" aria-label="Founding office">'
          +   '<div class="ov-head"><h2 id="foTitle" class="display">Add founding office</h2><button class="icon-btn" id="foClose" aria-label="Close">'+SVG_X+'</button></div>'
          +   '<div class="ov-body">'+form+'</div>'
          +   '<div class="ov-foot"><div class="ov-err" id="foErr"></div><button class="btn-out" id="foCancel">Cancel</button><button class="btn-primary" id="foSave"><span>Save</span></button></div>'
          + '</aside>';
        var wrap = document.createElement('div'); wrap.innerHTML = html; while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
        els.scrim = document.getElementById('foScrim'); els.ov = document.getElementById('foOv');
        document.getElementById('foClose').addEventListener('click', close);
        document.getElementById('foCancel').addEventListener('click', close);
        els.scrim.addEventListener('click', close);
        document.getElementById('foSave').addEventListener('click', save);
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && els.ov.classList.contains('show')) close(); });
        built = true;
      }
      function show(on){
        if(on){ els.scrim.classList.add('show'); els.ov.classList.add('show'); els.ov.setAttribute('aria-hidden','false'); }
        else { els.scrim.classList.remove('show'); els.ov.classList.remove('show'); els.ov.setAttribute('aria-hidden','true'); }
      }
      function setFixedOffice(name){
        var sel = document.getElementById('foOffice'), fixed = document.getElementById('foOfficeFixed');
        sel.style.display = 'none'; fixed.style.display = 'block'; fixed.textContent = name;
      }
      function setDropdown(list, selId){
        var sel = document.getElementById('foOffice'), fixed = document.getElementById('foOfficeFixed');
        fixed.style.display = 'none'; sel.style.display = 'block';
        sel.innerHTML = '<option value="">Select an office\u2026</option>' + list.map(function(o){ return '<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>'; }).join('');
        if(selId) sel.value = selId;
      }
      function editName(f){ var o = f.office_id ? FO.offices[f.office_id] : null; return (o && o.name) || f.office_name || 'Office'; }
      async function previewNumber(){
        var el = document.getElementById('foNumPreview'); el.textContent = '#\u2026';
        try{ var n = await nextFoundingNumber(); el.textContent = foNumLabel(n); }catch(e){ el.textContent = '#\u2014'; }
      }
      function open(opts){
        build(); opts = opts || {};
        editing = opts.editing || null; presetOffice = opts.presetOffice || null; available = opts.available || null; onSaved = opts.savedCb || null;
        var title = document.getElementById('foTitle');
        document.getElementById('foSigned').value = editing ? (editing.date_signed ? String(editing.date_signed).slice(0,10) : '') : todayStr();
        document.getElementById('foNotes').value = editing ? (editing.notes || '') : '';
        document.getElementById('foOfficeErr').textContent = ''; document.getElementById('foErr').textContent = '';
        var saveSpan = document.getElementById('foSave').querySelector('span');
        if(editing){
          mode = 'edit'; title.textContent = 'Edit founding office';
          setFixedOffice(editName(editing));
          document.getElementById('foNumPreview').textContent = foNumLabel(editing.number);
          if(saveSpan) saveSpan.textContent = 'Save changes';
        } else if(presetOffice){
          mode = 'convert'; title.textContent = 'Convert to founding office';
          setFixedOffice(presetOffice.name);
          if(saveSpan) saveSpan.textContent = 'Convert';
          previewNumber();
        } else {
          mode = 'add'; title.textContent = 'Add founding office';
          setDropdown(available || [], '');
          if(saveSpan) saveSpan.textContent = 'Add founding office';
          previewNumber();
        }
        show(true);
      }
      function close(){ show(false); }
      async function save(){
        document.getElementById('foOfficeErr').textContent = ''; document.getElementById('foErr').textContent = '';
        var dateSigned = nn(document.getElementById('foSigned').value);
        var notes = nn(document.getElementById('foNotes').value);
        var btn = document.getElementById('foSave'), span = btn.querySelector('span'); var lbl = span ? span.textContent : '';
        if(mode === 'edit'){
          btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
          try{
            var upd = await sb.from('founding_offices').update({ date_signed:dateSigned, notes:notes }).eq('id', editing.id).select().single();
            if(upd.error) throw upd.error;
            close(); toast('Founding office updated'); if(onSaved) onSaved(); else loadFounding();
          }catch(e){ document.getElementById('foErr').textContent = friendlyShort(e); }
          finally{ btn.disabled = false; if(span) span.textContent = lbl || 'Save changes'; }
          return;
        }
        var officeId, officeName;
        if(mode === 'convert'){ officeId = presetOffice.id; officeName = presetOffice.name; }
        else {
          var sel = document.getElementById('foOffice'); officeId = sel.value;
          officeName = (sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '');
          if(!officeId){ document.getElementById('foOfficeErr').textContent = 'Please choose an office.'; return; }
        }
        btn.disabled = true; if(span) span.textContent = (mode === 'convert' ? 'Converting\u2026' : 'Adding\u2026');
        try{
          var ins = await createFoundingOffice(officeId, officeName, dateSigned, notes);
          if(ins.error){
            var msg = (ins.error.message || '').toLowerCase();
            if(ins.error.code === '23505' && msg.indexOf('number') < 0){ document.getElementById('foErr').textContent = 'That office is already a founding office.'; }
            else { document.getElementById('foErr').textContent = friendlyShort(ins.error); }
            return;
          }
          await markOfficeSigned(officeId);
          var num = ins.data ? ins.data.number : null;
          close(); toast('Founding office ' + foNumLabel(num) + ' created');
          if(onSaved) onSaved(ins.data); else loadFounding();
        }catch(e){ document.getElementById('foErr').textContent = friendlyShort(e); }
        finally{ btn.disabled = false; if(span) span.textContent = lbl; }
      }
      return { open: open };
    })();

    /* ---- office drawer: Founding status / convert action ---- */
    function renderOfficeFounding(o){
      var box = document.getElementById('ofFounding'); if(!box) return;
      if(!o){ box.innerHTML = ''; return; }
      box.innerHTML = '<div id="ofFoundingInner" class="fo-inner"><div class="hist-loading">Loading\u2026</div></div>';
      loadOfficeFounding(o);
    }
    async function loadOfficeFounding(o){
      var box = document.getElementById('ofFoundingInner'); if(!box) return;
      try{
        var res = await sb.from('founding_offices').select('*').eq('office_id', o.id).order('number', { ascending:true });
        if(res.error) throw res.error;
        var f = (res.data || [])[0];
        if(f){
          box.className = 'fo-inner is-founding';
          box.innerHTML = '<span class="fo-inner-badge">'+ic('star')+foNumLabel(f.number)+'</span>'
            + '<div class="fo-inner-text"><div class="fo-inner-title">Founding office</div><div class="fo-inner-sub">'+(f.date_signed ? ('Signed ' + esc(fmtDate(f.date_signed))) : 'Date not set')+'</div></div>'
            + '<a class="btn-soft" href="#/founding">View</a>';
        } else {
          box.className = 'fo-inner';
          box.innerHTML = '<div class="fo-inner-text"><div class="fo-inner-title">Founding office</div><div class="fo-inner-sub">Mark this office as a signed founding partner.</div></div>'
            + '<button class="btn-soft" id="ofConvertFounding">'+ic('star')+' Convert to Founding Office</button>';
          var btn = document.getElementById('ofConvertFounding');
          if(btn) btn.addEventListener('click', function(){
            FoundingEditor.open({ presetOffice:o, savedCb:function(){
              var st = document.getElementById('ofStage'); if(st) st.value = 'signed';
              if(o) o.stage = 'signed';
              loadOfficeFounding(o);
              if(typeof loadOffices === 'function') loadOffices();
            }});
          });
        }
      }catch(e){
        var mm = ((e && e.message) || '').toLowerCase(); var setup = (mm.indexOf('schema cache') >= 0 || mm.indexOf('does not exist') >= 0 || mm.indexOf('could not find the table') >= 0 || (e && e.code) === 'PGRST205');
        box.className = 'fo-inner';
        box.innerHTML = '<div class="fo-inner-text"><div class="fo-inner-sub">'+(setup ? 'Run the founding-offices setup SQL to enable this.' : 'Couldn\u2019t check founding status.')+'</div></div>';
      }
    }

    boot();
  })();
  </script>
</body>
</html>
