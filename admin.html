<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ListEdge Admin</title>
<meta name="theme-color" content="#0A4630">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --green:#0E5A3C; --green-dk:#0A4630; --green-deep:#063225; --citron:#C8F24A;
    --bone:#F2EFE7; --bone-2:#ECE8DD; --ink:#16191A; --sub:#5C6760; --sage:#A6C0B1;
    --line:#E2DCCE; --card:#FFFFFF; --muted:#9aa39d;
  }
  body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--bone);-webkit-font-smoothing:antialiased}
  .display{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;letter-spacing:-.02em}
  a{text-decoration:none;color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}

  /* ---- loading splash ---- */
  .splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:linear-gradient(180deg,#0A4630,#063225);color:#fff}
  .splash .lk{display:flex;align-items:center;gap:11px}
  .splash .tile{width:34px;height:34px;border-radius:10px;background:var(--citron);display:flex;align-items:center;justify-content:center}
  .splash .word{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px}
  .splash .word .e{color:var(--citron)}
  .splash .ld{font-size:12.5px;color:#A9C3B5;letter-spacing:.04em}

  /* ---- app shell ---- */
  .app{min-height:100vh;min-height:100dvh}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:248px;z-index:50;display:flex;flex-direction:column;padding:18px 14px;
    background:linear-gradient(185deg,#0A4630 0%,#073525 100%);color:#fff}
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 2px;margin-bottom:20px}
  .side-brand .tile{width:32px;height:32px;border-radius:9px;background:var(--citron);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .side-brand .word{font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;color:#fff;letter-spacing:-.02em}
  .side-brand .word .e{color:var(--citron)}
  .side-lab{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#6f897b;padding:0 10px 8px}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#A9C3B5;font-size:14px;font-weight:500;
    transition:background .14s ease,color .14s ease;cursor:pointer}
  .navitem svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
  .navitem:hover{background:rgba(255,255,255,.07);color:#fff}
  .navitem.active{background:rgba(200,242,74,.15);color:var(--citron);font-weight:600}
  .navitem.active svg{opacity:1}
  .side-foot{margin-top:8px;padding:13px 12px 4px;border-top:1px solid rgba(255,255,255,.08);
    color:#6f897b;font-size:11.5px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:7px}
  .side-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--citron)}

  /* ---- main column ---- */
  .main{margin-left:248px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:0 24px;height:64px;
    background:rgba(242,239,231,.86);backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--line)}
  .icon-btn{background:#fff;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .icon-btn:hover{box-shadow:0 4px 12px -8px rgba(0,0,0,.4)}
  .menu{display:none}
  .page-title{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .spacer{flex:1}

  .profile{position:relative}
  .profile-btn{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 6px;cursor:pointer;color:var(--ink)}
  .profile-btn:hover{box-shadow:0 4px 14px -8px rgba(0,0,0,.35)}
  .profile-btn .chev{color:var(--sub)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--citron);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .pinfo{line-height:1.15;text-align:left}
  .pinfo b{display:block;font-size:13px;font-weight:600}
  .pinfo span{display:block;font-size:11.5px;color:var(--sub);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pop{position:absolute;right:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:14px;min-width:236px;padding:8px;
    box-shadow:0 22px 48px -16px rgba(0,0,0,.34);z-index:40;animation:rise .14s both}
  @keyframes rise{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .pop[hidden]{display:none}
  .pop-head{padding:9px 11px 11px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);margin-bottom:6px;line-height:1.5}
  .pop-head b{color:var(--ink);font-size:13px;word-break:break-all}
  .pop-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:13.5px;color:var(--ink);padding:10px 11px;border-radius:9px;cursor:pointer}
  .pop-item:hover{background:#F0F3F0}
  .pop-item svg{width:16px;height:16px;color:var(--sub)}
  .pop-item.danger{color:#B42318}
  .pop-item.danger svg{color:#B42318}

  /* ---- content ---- */
  .content{padding:26px 24px 44px;max-width:1320px;width:100%}
  .view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .vh-sub{color:var(--sub);font-size:14.5px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--green);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--citron)}

  /* metric cards */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:16px;margin-bottom:22px}
  .metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .18s ease,box-shadow .18s ease}
  .metric:hover{transform:translateY(-2px);box-shadow:0 16px 34px -20px rgba(20,30,24,.3)}
  .metric .mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .metric .mlabel{font-size:12.5px;font-weight:600;color:var(--sub)}
  .metric .mtile{width:34px;height:34px;border-radius:10px;background:#E7F0EA;color:var(--green);display:flex;align-items:center;justify-content:center}
  .metric .mtile svg{width:18px;height:18px}
  .metric .mval{font-family:'Bricolage Grotesque';font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1}
  .metric .mdelta{margin-top:9px;font-size:12.5px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:5px}
  .metric .mdelta.up{color:var(--green)}
  .metric .mdelta.warn{color:#9A6A00}
  .metric .mdelta svg{width:13px;height:13px}

  /* panels */
  .panels{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .col{display:flex;flex-direction:column;gap:18px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-family:'Bricolage Grotesque';font-weight:700;font-size:16px;letter-spacing:-.01em}
  .panel-head .link{font-size:12.5px;font-weight:600;color:var(--green);cursor:pointer;opacity:.85}
  .panel-head .link:hover{opacity:1}
  .panel-body{padding:8px}

  .row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px}
  .row:hover{background:#FAFBF8}
  .row .ricon{width:34px;height:34px;border-radius:9px;background:#E7F0EA;color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .row .ricon svg{width:17px;height:17px}
  .row .rtext{flex:1;font-size:13.5px;color:var(--ink);line-height:1.4}
  .row .rtext b{font-weight:600}
  .row .rwhen{font-size:12px;color:var(--muted);white-space:nowrap}

  .mrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px}
  .mrow:hover{background:#FAFBF8}
  .datebox{width:46px;text-align:center;background:#0A4630;color:#fff;border-radius:10px;padding:6px 0;flex-shrink:0}
  .datebox .d{font-family:'Bricolage Grotesque';font-weight:700;font-size:17px;line-height:1}
  .datebox .mo{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--citron);margin-top:2px}
  .minfo{flex:1}
  .minfo .nm{font-size:13.5px;font-weight:600}
  .minfo .tm{font-size:12.5px;color:var(--sub);margin-top:1px}
  .tag{font-size:11px;font-weight:600;color:var(--green);background:#E7F0EA;border-radius:999px;padding:4px 9px;white-space:nowrap}

  .task{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer}
  .task:hover{background:#FAFBF8}
  .box{width:20px;height:20px;border:2px solid #c9d2c8;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .12s,border-color .12s}
  .box svg{width:12px;height:12px;opacity:0}
  .task.done .box{background:var(--green);border-color:var(--green)}
  .task.done .box svg{opacity:1}
  .task .tlabel{flex:1;font-size:13.5px;line-height:1.4}
  .task.done .tlabel{color:var(--muted);text-decoration:line-through}
  .due{font-size:11px;font-weight:600;color:var(--sub);background:var(--bone-2);border-radius:999px;padding:4px 9px;white-space:nowrap}
  .due.today{color:#9A6A00;background:#FBF1D8}

  .btn-out{font-family:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 18px;cursor:pointer}
  .btn-out:hover{background:#FAFBF8}
  .btn-out.danger{color:#B42318;border-color:#f0c8c2}
  .btn-out.danger:hover{background:#fdf3f2}

  /* placeholder module view */
  .placeholder{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
  .placeholder .ptile{width:64px;height:64px;border-radius:18px;background:#E7F0EA;color:var(--green);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  .placeholder .ptile svg{width:30px;height:30px}
  .placeholder h2{font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;letter-spacing:-.02em;margin-bottom:10px}
  .placeholder p{color:var(--sub);font-size:15px;max-width:44ch;margin-bottom:18px;line-height:1.6}
  .pnote{font-size:12.5px;color:var(--muted)}

  /* scrim (mobile drawer) */
  .scrim{position:fixed;inset:0;background:rgba(6,30,20,.45);z-index:45;opacity:0;visibility:hidden;transition:opacity .2s}
  .scrim.show{opacity:1;visibility:visible}

  /* ---- responsive ---- */
  @media(min-width:961px){ .scrim{display:none} }
  @media(max-width:960px){
    .sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 70px rgba(0,0,0,.45)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0}
    .menu{display:flex}
    .panels{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .content{padding:18px 16px 36px}
    .topbar{padding:0 14px;gap:10px}
    .pinfo{display:none}
    .metric .mval{font-size:30px}
    .page-title{font-size:19px}
  }
  @media(prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
<style>
  /* ===================== Offices module (CRM) ===================== */
  .btn-primary{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:600;font-size:14px;border:none;border-radius:11px;padding:11px 16px;cursor:pointer;background:var(--citron);color:var(--ink);transition:transform .15s,box-shadow .15s,opacity .15s}
  .btn-primary svg{width:17px;height:17px}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px -12px rgba(200,242,74,.7)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .btn-danger{font-family:inherit;font-weight:600;font-size:14px;border:none;border-radius:11px;padding:11px 18px;cursor:pointer;background:#B42318;color:#fff}
  .btn-danger:hover:not(:disabled){background:#9c1d14}
  .btn-danger:disabled{opacity:.6}

  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:12px;width:16px;height:16px;color:var(--sub);pointer-events:none}
  .search input{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 14px 10px 34px;outline:none;width:268px;transition:border-color .15s,box-shadow .15s}
  .search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(14,90,60,.1)}
  .search input::placeholder{color:#9aa39d}

  .summary{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .st{flex:1;min-width:132px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .st-v{font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1}
  .st-l{font-size:12.5px;color:var(--sub);margin-top:5px}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13px;font-weight:600;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .14s,color .14s,border-color .14s}
  .chip:hover{border-color:#c9d2c8}
  .chip.active{background:var(--green);color:#fff;border-color:transparent}
  .chip .ct{font-size:11.5px;font-weight:700;opacity:.75}

  .of-table{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .of-head,.of-row{display:grid;grid-template-columns:2.4fr 2.2fr 1.1fr 1.2fr 1fr auto;align-items:center;gap:14px;padding:13px 18px}
  .of-head{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);background:#FAFBF8;border-bottom:1px solid var(--line)}
  .of-row{border-bottom:1px solid var(--line)}
  .of-row:last-child{border-bottom:none}
  .of-row:hover{background:#FAFBF8}
  .c-name{cursor:pointer;min-width:0}
  .c-name b{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-name .sub{font-size:12px;color:var(--sub);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-contact{font-size:13.5px;min-width:0}
  .c-contact .dim2{display:block;font-size:12px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-suburb,.c-follow{font-size:13.5px}
  .dim{color:#bcc4bc}
  .cl{display:none}
  .spill{font-family:inherit;font-weight:600;font-size:12.5px;border:none;border-radius:999px;padding:5px 27px 5px 12px;cursor:pointer;-webkit-appearance:none;appearance:none;outline:none;
    background-repeat:no-repeat;background-position:right 9px center;background-size:11px;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%235C6760'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='m6%209%206%206%206-6'/%3E%3C/svg%3E")}
  .spill:focus{box-shadow:0 0 0 3px rgba(14,90,60,.12)}
  .c-act{display:flex;gap:6px;justify-content:flex-end}
  .ia{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub)}
  .ia svg{width:16px;height:16px}
  .ia:hover{background:#F0F3F0;color:var(--ink)}
  .ia.danger:hover{color:#B42318;border-color:#f0c8c2;background:#fdf3f2}

  .loading{padding:42px;text-align:center;color:var(--sub);font-size:14px}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center}
  .empty .ptile{width:60px;height:60px;border-radius:16px;background:#E7F0EA;color:var(--green);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .empty .ptile svg{width:28px;height:28px}
  .empty h2{font-family:'Bricolage Grotesque';font-weight:700;font-size:23px;letter-spacing:-.02em;margin-bottom:9px}
  .empty p{color:var(--sub);font-size:14.5px;max-width:44ch;margin-bottom:18px;line-height:1.6}
  .empty-sm{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;text-align:center;color:var(--sub);font-size:14px}
  .err-box{background:#fff;border:1px solid #f0d8c2;border-radius:16px;padding:26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
  .err-box .eb-ic{width:46px;height:46px;border-radius:12px;background:#FBF1D8;color:#9A6A00;display:flex;align-items:center;justify-content:center}
  .err-box .eb-ic svg{width:24px;height:24px}
  .err-box .eb-tx{font-size:14px;color:var(--ink);max-width:54ch;line-height:1.55}
  .err-box .eb-tx b{font-weight:700}

  .ov-scrim{position:fixed;inset:0;background:rgba(6,30,20,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
  .ov-scrim.show{opacity:1;pointer-events:auto}
  .ov{position:fixed;top:0;right:0;bottom:0;width:444px;max-width:92vw;background:var(--bone);z-index:61;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .24s ease;box-shadow:-30px 0 80px -30px rgba(0,0,0,.5)}
  .ov.show{transform:translateX(0)}
  .ov-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line);background:#fff}
  .ov-head h2{font-family:'Bricolage Grotesque';font-weight:700;font-size:19px;letter-spacing:-.01em}
  .ov-body{flex:1;overflow-y:auto;padding:20px}
  .ov-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fff}
  .ov-err{color:#B42318;font-size:13px;font-weight:500;margin-right:auto;max-width:58%;line-height:1.4}
  .frm{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld.span2{grid-column:1 / -1}
  .fld label{font-size:12.5px;font-weight:600;color:#33403a}
  .fld input,.fld select,.fld textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
  .fld textarea{resize:vertical;min-height:86px}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(14,90,60,.1)}
  .fe{color:#B42318;font-size:12px;font-weight:500}
  .divider-lab{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);padding-top:12px;border-top:1px solid var(--line);margin-top:2px}

  .cf-scrim{position:fixed;inset:0;background:rgba(6,30,20,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .18s}
  .cf-scrim.show{opacity:1}
  .cf{background:#fff;border-radius:18px;padding:26px;max-width:380px;width:100%;box-shadow:0 40px 90px -30px rgba(0,0,0,.5);transform:scale(.96);transition:transform .18s}

    function renderDashMetrics(){
      var el=document.getElementById('dashMetrics'); if(!el) return;
      var O=DASH.offices, M=DASH.meetings, F=DASH.follows;
      var oVal = O ? O.length : '\u2014';
      var oDelta = O ? (O.filter(function(o){ return o.stage!=='signed' && o.stage!=='passed'; }).length+' in pipeline') : 'Run setup SQL';
      var mVal = M ? M.length : '\u2014';
      var mDelta = M ? (M.filter(isUpcomingMeeting).length+' upcoming') : 'Run setup SQL';
      var fVal = F ? F.length : '\u2014';
      var overdue = F ? F.filter(function(f){ return fuEff(f)==='overdue'; }).length : 0;
      var open = F ? F.filter(function(f){ return f.status!=='completed'; }).length : 0;
      var fDelta = F ? (overdue>0 ? overdue+' overdue' : open+' open') : 'Run setup SQL';
      var E=DASH.eois;
      var eVal = E ? E.length : '\u2014';
      var eUnder = E ? E.filter(function(x){ return x.status==='under_review'; }).length : 0;
      var eSigned = E ? E.filter(function(x){ return x.status==='signed'; }).length : 0;
      var eDelta = E ? (eUnder>0 ? eUnder+' under review' : (eSigned>0 ? eSigned+' signed' : E.length+' total')) : 'Run setup SQL';
      el.innerHTML =
          dashCard('Offices','building', oVal, oDelta, '', 'offices')
        + dashCard('Meetings','calendar', mVal, mDelta, '', 'meetings')
        + dashCard('EOIs','file', eVal, eDelta, '', 'eois')
        + dashCard('Follow-ups','bell', fVal, fDelta, (overdue>0?'warn':''), 'followups');

    function isUpcomingMeeting(m){
      if(!m.meeting_date) return false;
      if(String(m.meeting_date).slice(0,10) < todayStr()) return false;

    }

    function renderDashActivity(){
      var el=document.getElementById('dashActivity'); if(!el) return;
      var O=DASH.offices||[], M=DASH.meetings||[], F=DASH.follows||[], E=DASH.eois||[], N=DASH.notes||[], map=DASH.byId||{};
      var items=[];
      O.forEach(function(o){ items.push({ t:tstamp(o), icon:'building', html:'New office \u2014 <b>'+esc(o.name)+'</b>' }); });
      M.forEach(function(m){ var o=map[m.office_id]; items.push({ t:tstamp(m), icon:'calendar', html:'Meeting logged \u2014 <b>'+esc(o?o.name:'office')+'</b>'+(m.meeting_date?' ('+esc(fmtDate(m.meeting_date))+')':'') }); });
      F.forEach(function(f){ var o=map[f.office_id]; items.push({ t:tstamp(f), icon:'bell', html:'Follow-up added \u2014 <b>'+esc(f.type||(o?o.name:'office'))+'</b>' }); });
      E.forEach(function(x){ var o=map[x.office_id]; items.push({ t:tstamp(x), icon:'file', html:(x.status==='signed'?'EOI signed \u2014 ':'EOI added \u2014 ')+'<b>'+esc(o?o.name:'office')+'</b>' }); });
      N.forEach(function(n){ var lab=(n.title||'').trim()||(n.body||'').trim().slice(0,40)||'Note'; items.push({ t:tstamp(n), icon:'note', html:'Note added \u2014 <b>'+esc(lab)+'</b>' }); });
      items.sort(function(a,b){ return a.t<b.t?1:a.t>b.t?-1:0; });
      items=items.slice(0,6);
      if(items.length===0){ el.innerHTML='<div class="panel-empty">No activity yet \u2014 add an office to get started.</div>'; return; }
      el.innerHTML=items.map(function(a){ return '<div class="row"><span class="ricon">'+ic(a.icon)+'</span><span class="rtext">'+a.html+'</span><span class="rwhen">'+timeAgo(a.t)+'</span></div>'; }).join('');
    }
    function tstamp(r){ return r.created_at || r.updated_at || ''; }
    function timeAgo(iso){
      if(!iso) return ''; var then=new Date(iso).getTime(); if(isNaN(then)) return '';
      var mins=Math.floor((Date.now()-then)/60000);
      if(mins<1) return 'Just now'; if(mins<60) return mins+'m ago';
      var hrs=Math.floor(mins/60); if(hrs<24) return hrs+'h ago';
      var days=Math.floor(hrs/24); if(days===1) return 'Yesterday'; if(days<7) return days+' days ago';
      return fmtDate(iso);
    }

    var cfg    = window.LISTEDGE_SUPABASE || {};

    function configured(){
      return cfg.url && cfg.anonKey &&

             cfg.anonKey.indexOf('YOUR-') === -1;
    }
    function gotoLogin(){ location.replace('login.html'); }

    async function boot(){
      if(!window.supabase || !configured()){ gotoLogin(); return; }
      try{ sb = window.supabase.createClient(cfg.url, cfg.anonKey); }
      catch(e){ gotoLogin(); return; }

      var session = null;
      try{ var r = await sb.auth.getSession(); session = (r && r.data) ? r.data.session : null; }
      catch(e){ session = null; }

      if(!session){ gotoLogin(); return; }   // protected: no session -> login

      setProfile(session.user);
      buildNav();
      wire();
      splash.hidden = true;
      app.hidden = false;
      route();

      // if the session ends anywhere, return to login
      sb.auth.onAuthStateChange(function(evt, sess){
        if(evt === 'SIGNED_OUT' || !sess){ gotoLogin(); }
      });
    }

    function setProfile(user){
      var email = (user && user.email) ? user.email : 'admin';
      STATE.email = email;
      STATE.initial = (email.charAt(0) || 'A').toUpperCase();
      document.getElementById('pemail').textContent = email;
      document.getElementById('pemail2').textContent = email;
      document.getElementById('avatar').textContent = STATE.initial;

    function buildNav(){
      document.getElementById('nav').innerHTML = MODULES.map(function(m){

      }).join('');
    }

    /* ---- routing ---- */
    function currentId(){ var h = (location.hash || '').replace(/^#\/?/, ''); return h || 'dashboard'; }
    function route(){
      var id = currentId();
      var m = MODULES.filter(function(x){ return x.id === id; })[0] || MODULES[0];
      document.getElementById('pageTitle').textContent = m.title;
      document.getElementById('view').innerHTML = m.render();
      if(typeof m.mount === 'function'){ m.mount(); }
      var items = document.querySelectorAll('.navitem');
      for(var i=0;i<items.length;i++){ items[i].classList.toggle('active', items[i].getAttribute('data-id') === m.id); }
      closeDrawer();
      window.scrollTo(0,0);
    }
    window.addEventListener('hashchange', route);

    /* ---- interactions ---- */
    function wire(){
      var pop = document.getElementById('pop');
      var pbtn = document.getElementById('profileBtn');
      function setPop(open){ pop.hidden = !open; pbtn.setAttribute('aria-expanded', open ? 'true':'false'); }
      pbtn.addEventListener('click', function(e){ e.stopPropagation(); setPop(pop.hidden); });
      document.addEventListener('click', function(e){ if(!pop.hidden && !pop.contains(e.target) && !pbtn.contains(e.target)) setPop(false); });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ setPop(false); closeDrawer(); } });

      document.getElementById('logoutBtn').addEventListener('click', logout);

      // mobile drawer
      document.getElementById('menuBtn').addEventListener('click', function(){ openDrawer(); });
      document.getElementById('scrim').addEventListener('click', closeDrawer);

      // delegated clicks inside the view (settings logout)
      document.getElementById('view').addEventListener('click', function(e){
        if(e.target.closest('#setLogout')){ logout(); }
      });
    }

      var fu = document.getElementById('fuOv'); if(fu && fu.classList.contains('show')) return;
      closeForm(); closeConfirm(); }

    async function loadOffices(){
      OF.loading = true;
      var body = document.getElementById('ofBody');
      if(body) body.innerHTML = '<div class="loading">Loading offices\u2026</div>';
      try{
        var res = await sb.from('offices').select('*').order('updated_at', { ascending:false });
        if(res.error) throw res.error;
        OF.all = res.data || [];
        OF.loading = false;
        renderSummary(); renderChips(); renderList();
      }catch(e){
        OF.loading = false;
        if(body){
          body.innerHTML = errBox(friendlyDbError(e));
          var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadOffices);
        }
        renderSummary(); renderChips();
      }
    }

    function renderSummary(){
      var el = document.getElementById('ofSummary'); if(!el) return;
      var total = OF.all.length;
      var signed = OF.all.filter(function(o){ return o.stage === 'signed'; }).length;
      var active = OF.all.filter(function(o){ return o.stage !== 'signed' && o.stage !== 'passed'; }).length;
      el.innerHTML = stat('Total offices', total) + stat('Active pipeline', active) + stat('Signed', signed);
    }
    function stat(label, val){ return '<div class="st"><div class="st-v">'+val+'</div><div class="st-l">'+label+'</div></div>'; }

    function renderChips(){
      var el = document.getElementById('ofChips'); if(!el) return;
      function count(id){ return id === 'all' ? OF.all.length : OF.all.filter(function(o){ return o.stage === id; }).length; }
      var items = [{ id:'all', label:'All' }].concat(STAGES);
      el.innerHTML = items.map(function(s){
        var active = OF.stage === s.id;
        var style = (active && s.id !== 'all') ? (' style="background-color:'+s.bg+';color:'+s.c+';border-color:transparent"') : '';
        return '<button class="chip'+(active?' active':'')+'" data-stage="'+s.id+'"'+style+'>'+s.label+' <span class="ct">'+count(s.id)+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b){
        b.addEventListener('click', function(){ OF.stage = b.getAttribute('data-stage'); renderChips(); renderList(); });
      });
    }

    function renderList(){
      var body = document.getElementById('ofBody'); if(!body || OF.loading) return;
      if(OF.all.length === 0){ body.innerHTML = emptyBox(); var b = document.getElementById('ofAddEmpty'); if(b) b.addEventListener('click', function(){ openForm(null); }); return; }
      var rows = OF.all.filter(function(o){
        if(OF.stage !== 'all' && o.stage !== OF.stage) return false;
        if(OF.q){
          var hay = ((o.name||'')+' '+(o.brand||'')+' '+(o.contact_name||'')+' '+(o.suburb||'')+' '+(o.contact_email||'')).toLowerCase();
          if(hay.indexOf(OF.q) < 0) return false;
        }
        return true;
      });
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No offices match your search or filter.</div>'; return; }
      var head = '<div class="of-head"><div>Office</div><div>Contact</div><div>Suburb</div><div>Stage</div><div>Follow-up</div><div></div></div>';
      body.innerHTML = '<div class="of-table">' + head + rows.map(rowHTML).join('') + '</div>';
      wireRows();
    }

    function rowHTML(o){
      var sm = stageMeta(o.stage);
      var sub = [o.brand, (o.agents ? o.agents + ' agents' : '')].filter(Boolean).map(esc).join(' \u00b7 ');
      var contact = o.contact_name ? esc(o.contact_name) : '<span class="dim">\u2014</span>';
      var cd = []; if(o.contact_email) cd.push(esc(o.contact_email)); if(o.contact_phone) cd.push(esc(o.contact_phone));
      var follow = o.next_follow_up ? fmtDate(o.next_follow_up) : '<span class="dim">\u2014</span>';
      var opts = STAGES.map(function(s){ return '<option value="'+s.id+'"'+(s.id===o.stage?' selected':'')+'>'+s.label+'</option>'; }).join('');
      return ''
        + '<div class="of-row" data-id="'+esc(o.id)+'">'
        +   '<div class="c-name" data-edit><b>'+esc(o.name)+'</b>'+(sub ? '<span class="sub">'+sub+'</span>' : '')+'</div>'
        +   '<div class="c-contact"><span class="cl">Contact</span>'+contact+(cd.length ? '<span class="dim2">'+cd.join(' \u00b7 ')+'</span>' : '')+'</div>'
        +   '<div class="c-suburb"><span class="cl">Suburb</span>'+(o.suburb ? esc(o.suburb) : '<span class="dim">\u2014</span>')+'</div>'
        +   '<div class="c-stage"><span class="cl">Stage</span><select class="spill" data-stage-for="'+esc(o.id)+'" style="color:'+sm.c+';background-color:'+sm.bg+'">'+opts+'</select></div>'
        +   '<div class="c-follow"><span class="cl">Follow-up</span>'+follow+'</div>'
        +   '<div class="c-act"><button class="ia" data-edit-id="'+esc(o.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-del-id="'+esc(o.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button></div>'
        + '</div>';
    }

    function wireRows(){
      var body = document.getElementById('ofBody');
      Array.prototype.forEach.call(body.querySelectorAll('select[data-stage-for]'), function(sel){
        sel.addEventListener('change', function(){ changeStage(sel.getAttribute('data-stage-for'), sel.value, sel); });
        sel.addEventListener('click', function(e){ e.stopPropagation(); });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-edit-id]'), function(b){
        b.addEventListener('click', function(e){ e.stopPropagation(); openForm(findOffice(b.getAttribute('data-edit-id'))); });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-del-id]'), function(b){
        b.addEventListener('click', function(e){ e.stopPropagation(); openConfirm(findOffice(b.getAttribute('data-del-id'))); });
      });
      Array.prototype.forEach.call(body.querySelectorAll('.c-name[data-edit]'), function(c){
        c.addEventListener('click', function(){ var row = c.closest('.of-row'); openForm(findOffice(row.getAttribute('data-id'))); });
      });
    }
    function findOffice(id){ return OF.all.filter(function(o){ return String(o.id) === String(id); })[0]; }

    async function changeStage(id, stage, sel){
      var sm = stageMeta(stage);
      if(sel){ sel.style.color = sm.c; sel.style.backgroundColor = sm.bg; }
      try{
        var res = await sb.from('offices').update({ stage: stage }).eq('id', id).select().single();
        if(res.error) throw res.error;
        var o = findOffice(id); if(o){ o.stage = stage; if(res.data && res.data.updated_at) o.updated_at = res.data.updated_at; }
        renderSummary(); renderChips();
        toast('Stage updated');
      }catch(e){ toast(friendlyShort(e), 'err'); loadOffices(); }
    }

    function openForm(o){
      OF.editing = o || null;
      document.getElementById('ovTitle').textContent = o ? 'Edit office' : 'Add office';
      setVal('ofName', o && o.name); setVal('ofBrand', o && o.brand); setVal('ofSuburb', o && o.suburb);
      setVal('ofAgents', o && o.agents); setVal('ofContactName', o && o.contact_name);
      setVal('ofContactEmail', o && o.contact_email); setVal('ofContactPhone', o && o.contact_phone);
      setVal('ofWebsite', o && o.website); setVal('ofFollow', o && (o.next_follow_up ? String(o.next_follow_up).slice(0,10) : '')); setVal('ofNotes', o && o.notes);
      document.getElementById('ofStage').value = (o && o.stage) || 'lead';
      document.getElementById('ofNameErr').textContent = '';
      document.getElementById('ovErr').textContent = '';
      showOverlay(true);
      setTimeout(function(){ var n = document.getElementById('ofName'); if(n) n.focus(); }, 80);
      renderOfficeEoiHistory(o);
      renderOfficeHistory(o);
      renderOfficeDocs(o);
    }
    function setVal(id, v){ var el = document.getElementById(id); if(el) el.value = (v === 0 ? '0' : (v || '')); }
    function val(id){ var el = document.getElementById(id); return el ? el.value : ''; }

    function showOverlay(on){
      var ov = document.getElementById('ov'), sc = document.getElementById('ovScrim');
      if(!ov || !sc) return;
      if(on){ sc.hidden = false; ov.hidden = false; ov.setAttribute('aria-hidden','false'); requestAnimationFrame(function(){ sc.classList.add('show'); ov.classList.add('show'); }); }
      else { sc.classList.remove('show'); ov.classList.remove('show'); ov.setAttribute('aria-hidden','true'); setTimeout(function(){ sc.hidden = true; ov.hidden = true; }, 230); }
    }
    function closeForm(){ showOverlay(false); }

    async function saveForm(){
      var name = (val('ofName') || '').trim();
      document.getElementById('ofNameErr').textContent = '';
      document.getElementById('ovErr').textContent = '';
      if(!name){ document.getElementById('ofNameErr').textContent = 'Please enter the office name.'; var nm = document.getElementById('ofName'); if(nm) nm.focus(); return; }

      var payload = {
        name: name,
        brand: nn(val('ofBrand')),
        stage: val('ofStage') || 'lead',
        suburb: nn(val('ofSuburb')),
        agents: intOrNull(val('ofAgents')),
        contact_name: nn(val('ofContactName')),
        contact_email: nn(val('ofContactEmail')),
        contact_phone: nn(val('ofContactPhone')),
        website: nn(val('ofWebsite')),
        next_follow_up: nn(val('ofFollow')),
        notes: nn(val('ofNotes'))
      };

      var btn = document.getElementById('ovSave'), span = btn.querySelector('span');
      var label = span ? span.textContent : '';
      btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
      try{
        var res = OF.editing
          ? await sb.from('offices').update(payload).eq('id', OF.editing.id).select().single()
          : await sb.from('offices').insert(payload).select().single();
        if(res.error) throw res.error;
        var wasEdit = !!OF.editing;
        closeForm();
        toast(wasEdit ? 'Office updated' : 'Office added');
        await loadOffices();
      }catch(e){
        document.getElementById('ovErr').textContent = friendlyShort(e);
      }finally{
        btn.disabled = false; if(span) span.textContent = label || 'Save office';
      }
    }

    function openConfirm(o){
      if(!o) return;
      OF.deleting = o;
      document.getElementById('cfText').innerHTML = 'Delete <b>'+esc(o.name)+'</b>? This can\u2019t be undone.';
      var sc = document.getElementById('cfScrim');
      sc.hidden = false; requestAnimationFrame(function(){ sc.classList.add('show'); });
      document.getElementById('cfDelete').onclick = function(){ doDelete(o); };
    }
    function closeConfirm(){ var sc = document.getElementById('cfScrim'); if(!sc) return; sc.classList.remove('show'); setTimeout(function(){ sc.hidden = true; }, 200); OF.deleting = null; }

    async function doDelete(o){
      var del = document.getElementById('cfDelete'); var t = del.textContent;
      del.disabled = true; del.textContent = 'Deleting\u2026';
      try{
        var res = await sb.from('offices').delete().eq('id', o.id);
        if(res.error) throw res.error;
        closeConfirm(); toast('Office deleted'); await loadOffices();
      }catch(e){ toast(friendlyShort(e), 'err'); }
      finally{ del.disabled = false; del.textContent = t || 'Delete'; }
    }

    function emptyBox(){
      return '<div class="empty"><span class="ptile">'+ic('building')+'</span>'
        + '<h2 class="display">No offices yet</h2>'
        + '<p>Add your first agency to start building your pipeline. Everything you add is saved straight to your database.</p>'
        + '<button class="btn-primary" id="ofAddEmpty">'+ic('plus')+'<span>Add your first office</span></button></div>';
    }
    function errBox(msg){
      return '<div class="err-box"><div class="eb-ic">'+SVG_WARN+'</div><div class="eb-tx">'+msg+'</div><button class="btn-out" id="ofRetry">Try again</button></div>';
    }

    /* small helpers */
    function nn(s){ s = (s == null ? '' : String(s)).trim(); return s === '' ? null : s; }
    function intOrNull(s){ s = (s == null ? '' : String(s)).trim(); if(s === '') return null; var n = parseInt(s, 10); return isNaN(n) ? null : n; }
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
    function fmtDate(d){ try{ var p = String(d).slice(0,10).split('-'); var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return (+p[2]) + ' ' + mo[(+p[1]) - 1] + ' ' + p[0]; }catch(e){ return esc(d); } }
    function toast(msg, kind){
      var t = document.getElementById('le-toast');
      if(!t){ t = document.createElement('div'); t.id = 'le-toast'; document.body.appendChild(t); }
      t.textContent = msg;
      t.className = 'toast show' + (kind === 'err' ? ' err' : '');
      clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = 'toast' + (kind === 'err' ? ' err' : ''); }, 2600);
    }
    function friendlyDbError(e){
      var m = ((e && (e.message || e.hint || e.details)) || '').toLowerCase(); var code = e && e.code;
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0)
        return 'The <b>offices</b> table isn\u2019t set up yet. Run the one-time setup SQL (offices-setup.sql) in your Supabase SQL editor, then press Try again.';
      if(code === '42501' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0)
        return 'Your database blocked that request. Make sure you ran the full setup SQL (it adds the access rule) and that you\u2019re signed in.';
      return 'Couldn\u2019t reach the database. Please check your connection and press Try again.';
    }
    function friendlyShort(e){
      var m = ((e && e.message) || '').toLowerCase();
      if(m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0) return 'Database table isn\u2019t set up yet \u2014 run the setup SQL.';
      if(m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0) return 'The database blocked that request.';
      return 'Something went wrong \u2014 please try again.';
    }

    /* =========================================================
       MEETINGS — linked to offices, backed by Supabase.
       Table: public.meetings (run meetings-setup.sql once in Supabase).
       Re-uses the Offices patterns; the editor is shared so a meeting
       can be logged from the Meetings tab OR from inside an Office.
       ========================================================= */
    var MSTATUS = [
      { id:'scheduled', label:'Scheduled', full:'Scheduled',          c:'#2563EB', bg:'#E7EEFC' },
      { id:'completed', label:'Completed', full:'Completed',          c:'#0E5A3C', bg:'#E7F0EA' },
      { id:'follow_up', label:'Follow-up', full:'Follow up required',  c:'#9A6A00', bg:'#FBF1D8' },
      { id:'cancelled', label:'Cancelled', full:'Cancelled',          c:'#5C6760', bg:'#ECE8DD' }
    ];
    function mtgStatusMeta(id){ for(var i=0;i<MSTATUS.length;i++){ if(MSTATUS[i].id===id) return MSTATUS[i]; } return MSTATUS[0]; }
    function fmtTime(t){ if(!t) return ''; var p=String(t).split(':'); var h=parseInt(p[0],10); var mi=p[1]||'00'; if(isNaN(h)) return esc(t); var ap=h<12?'AM':'PM'; var h12=h%12; if(h12===0) h12=12; return h12+':'+mi+' '+ap; }

    var MT = { all:[], offices:{}, officeList:[], q:'', status:'all', loading:true };

    function meetingsView(){
      return ''
        + '<div class="view-head">'
        +   '<div class="vh-sub">Every demo, intro call and follow-up \u2014 each linked to its office.</div>'
        +   '<div class="tools">'
        +     '<div class="search">'+SVG_SEARCH+'<input id="mtSearch" type="search" placeholder="Search office, attendees, notes\u2026" autocomplete="off"></div>'
        +     '<button class="btn-primary" id="mtAdd">'+ic('plus')+'<span>Add meeting</span></button>'
        +   '</div>'
        + '</div>'
        + '<div class="summary" id="mtSummary"></div>'
        + '<div class="chips" id="mtChips"></div>'
        + '<div id="mtBody"><div class="loading">Loading meetings\u2026</div></div>';
    }

    function meetingsMount(){
      var body = document.getElementById('mtBody');
      if(!sb){ if(body) body.innerHTML = errBox('Not connected to the database yet.'); return; }
      var search = document.getElementById('mtSearch');
      search.addEventListener('input', function(){ MT.q = search.value.trim().toLowerCase(); renderMtList(); });
      document.getElementById('mtAdd').addEventListener('click', function(){
        if(MT.officeList.length === 0){ toast('Add an office first', 'err'); return; }
        MeetingEditor.open(null, null, loadMeetings);
      });
      loadMeetings();
    }

    async function loadMeetings(){
      MT.loading = true;
      var body = document.getElementById('mtBody'); if(body) body.innerHTML = '<div class="loading">Loading meetings\u2026</div>';
      try{
        var offRes = await sb.from('offices').select('id,name,suburb').order('name', { ascending:true });
        if(offRes.error) throw offRes.error;
        MT.officeList = offRes.data || [];
        MT.offices = {}; MT.officeList.forEach(function(o){ MT.offices[o.id] = o; });
        var res = await sb.from('meetings').select('*').order('meeting_date', { ascending:false, nullsFirst:false });
        if(res.error) throw res.error;
        MT.all = res.data || [];
        MT.loading = false;
        renderMtSummary(); renderMtChips(); renderMtList();
      }catch(e){
        MT.loading = false;
        if(body){ body.innerHTML = errBox(friendlyMtError(e)); var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadMeetings); }
        renderMtSummary(); renderMtChips();
      }
    }

    function renderMtSummary(){
      var el = document.getElementById('mtSummary'); if(!el) return;
      var total = MT.all.length;
      var sched = MT.all.filter(function(m){ return m.status === 'scheduled'; }).length;
      var fu = MT.all.filter(function(m){ return m.status === 'follow_up'; }).length;
      el.innerHTML = stat('Total meetings', total) + stat('Scheduled', sched) + stat('Follow-ups required', fu);
    }

    function renderMtChips(){
      var el = document.getElementById('mtChips'); if(!el) return;
      function count(id){ return id === 'all' ? MT.all.length : MT.all.filter(function(m){ return m.status === id; }).length; }
      var items = [{ id:'all', label:'All' }].concat(MSTATUS);
      el.innerHTML = items.map(function(s){
        var active = MT.status === s.id;
        var style = (active && s.id !== 'all') ? (' style="background-color:'+s.bg+';color:'+s.c+';border-color:transparent"') : '';
        return '<button class="chip'+(active?' active':'')+'" data-st="'+s.id+'"'+style+'>'+s.label+' <span class="ct">'+count(s.id)+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b){
        b.addEventListener('click', function(){ MT.status = b.getAttribute('data-st'); renderMtChips(); renderMtList(); });
      });
    }

    function renderMtList(){
      var body = document.getElementById('mtBody'); if(!body || MT.loading) return;
      if(MT.all.length === 0){
        body.innerHTML = mtEmpty();
        var b = document.getElementById('mtAddEmpty'); if(b) b.addEventListener('click', function(){ MeetingEditor.open(null, null, loadMeetings); });
        return;
      }
      var rows = MT.all.filter(function(m){
        if(MT.status !== 'all' && m.status !== MT.status) return false;
        if(MT.q){
          var off = MT.offices[m.office_id];
          var hay = (((off && off.name) || '')+' '+(m.attendees||'')+' '+(m.notes||'')+' '+(m.outcome||'')+' '+(m.next_action||'')).toLowerCase();
          if(hay.indexOf(MT.q) < 0) return false;
        }
        return true;
      });
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No meetings match your search or filter.</div>'; return; }
      var head = '<div class="mt-head"><div>Office</div><div>When</div><div>Attendees</div><div>Status</div><div>Follow-up</div><div></div></div>';
      body.innerHTML = '<div class="of-table">' + head + rows.map(mtRow).join('') + '</div>';
      wireMtRows();
    }

    function mtRow(m){
      var off = MT.offices[m.office_id];
      var sm = mtgStatusMeta(m.status);
      var oname = off ? esc(off.name) : '<span class="dim">Unknown office</span>';
      var osub = (off && off.suburb) ? esc(off.suburb) : '';
      var when = m.meeting_date ? (esc(fmtDate(m.meeting_date)) + (m.meeting_time ? ' \u00b7 ' + esc(fmtTime(m.meeting_time)) : '')) : '<span class="dim">No date</span>';
      var att = m.attendees ? esc(m.attendees) : '<span class="dim">\u2014</span>';
      var fu = m.follow_up_date ? esc(fmtDate(m.follow_up_date)) : '<span class="dim">\u2014</span>';
      var opts = MSTATUS.map(function(s){ return '<option value="'+s.id+'"'+(s.id===m.status?' selected':'')+'>'+s.full+'</option>'; }).join('');
      return ''
        + '<div class="mt-row" data-id="'+esc(m.id)+'">'
        +   '<div class="c-name" data-edit><b>'+oname+'</b>'+(osub ? '<span class="sub">'+osub+'</span>' : '')+'</div>'
        +   '<div><span class="cl">When</span>'+when+'</div>'
        +   '<div><span class="cl">Attendees</span>'+att+'</div>'
        +   '<div><span class="cl">Status</span><select class="spill" data-mtstatus-for="'+esc(m.id)+'" style="color:'+sm.c+';background-color:'+sm.bg+'">'+opts+'</select></div>'
        +   '<div><span class="cl">Follow-up</span>'+fu+'</div>'
        +   '<div class="c-act"><button class="ia" data-medit="'+esc(m.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-mdel="'+esc(m.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button></div>'
        + '</div>';
    }

    function wireMtRows(){
      var body = document.getElementById('mtBody');
      Array.prototype.forEach.call(body.querySelectorAll('select[data-mtstatus-for]'), function(sel){
        sel.addEventListener('change', function(){ changeMtStatus(sel.getAttribute('data-mtstatus-for'), sel.value, sel); });
        sel.addEventListener('click', function(e){ e.stopPropagation(); });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-medit]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); openMtEdit(b.getAttribute('data-medit')); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-mdel]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); confirmMtDelete(findMtg(b.getAttribute('data-mdel'))); }); });
      Array.prototype.forEach.call(body.querySelectorAll('.mt-row .c-name[data-edit]'), function(c){ c.addEventListener('click', function(){ openMtEdit(c.closest('.mt-row').getAttribute('data-id')); }); });
    }
    function findMtg(id){ return MT.all.filter(function(m){ return String(m.id) === String(id); })[0]; }
    function openMtEdit(id){ var m = findMtg(id); if(m) MeetingEditor.open(m, null, loadMeetings); }

    async function changeMtStatus(id, status, sel){
      var sm = mtgStatusMeta(status);
      if(sel){ sel.style.color = sm.c; sel.style.backgroundColor = sm.bg; }
      try{
        var res = await sb.from('meetings').update({ status: status }).eq('id', id).select().single();
        if(res.error) throw res.error;
        var m = findMtg(id); if(m) m.status = status;
        renderMtSummary(); renderMtChips();
        toast('Status updated');
      }catch(e){ toast(friendlyShort(e), 'err'); loadMeetings(); }
    }

    function confirmMtDelete(m){
      if(!m) return;
      var off = MT.offices[m.office_id];
      var msg = 'Delete the meeting with <b>'+esc(off ? off.name : 'this office')+'</b>'+(m.meeting_date ? ' on '+esc(fmtDate(m.meeting_date)) : '')+'? This can\u2019t be undone.';
      confirmDialog('Delete meeting?', msg, async function(){
        var res = await sb.from('meetings').delete().eq('id', m.id);
        if(res.error){ toast(friendlyShort(res.error), 'err'); throw res.error; }
        toast('Meeting deleted'); loadMeetings();
      });
    }

        return '<div class="empty"><span class="ptile">'+ic('calendar')+'</span><h2 class="display">No meetings yet</h2>'
          + '<p>Meetings are linked to your offices. Add an office first, then you can log meetings against it.</p>'
          + '<a class="btn-primary" href="#/offices">'+ic('building')+'<span>Go to Offices</span></a></div>';
      }
      return '<div class="empty"><span class="ptile">'+ic('calendar')+'</span><h2 class="display">No meetings yet</h2>'
        + '<p>Log your first meeting to start building each office\u2019s history. Everything saves to your database.</p>'
        + '<button class="btn-primary" id="mtAddEmpty">'+ic('plus')+'<span>Log your first meeting</span></button></div>';
    }

    function friendlyMtError(e){
      var m = ((e && (e.message || e.hint || e.details)) || '').toLowerCase(); var code = e && e.code;
      if(code === '42P01' || code === 'PGRST205' || m.indexOf('does not exist') >= 0 || m.indexOf('could not find the table') >= 0 || m.indexOf('schema cache') >= 0)
        return 'The <b>meetings</b> table isn\u2019t set up yet. Run the one-time setup SQL (meetings-setup.sql) in your Supabase SQL editor, then press Try again.';
      if(code === '42501' || m.indexOf('row-level security') >= 0 || m.indexOf('permission') >= 0)
        return 'Your database blocked that request. Make sure you ran the full setup SQL and that you\u2019re signed in.';
      return 'Couldn\u2019t reach the database. Please check your connection and press Try again.';
    }

    /* ---- shared meeting editor (a slide-over appended to <body>) ---- */
    var MeetingEditor = (function(){
      var built = false, editing = null, onSaved = null, els = {};
      function build(){
        if(built) return;
        var statusOpts = MSTATUS.map(function(s){ return '<option value="'+s.id+'">'+s.full+'</option>'; }).join('');
        var html = ''
          + '<div class="ov-scrim l2" id="meScrim"></div>'
          + '<aside class="ov l2" id="meOv" aria-hidden="true" aria-label="Meeting details">'
          +   '<div class="ov-head"><h2 id="meTitle" class="display">Log a meeting</h2><button class="icon-btn" id="meClose" aria-label="Close">'+SVG_X+'</button></div>'
          +   '<div class="ov-body"><div class="frm">'
          +     '<div class="fld span2"><label for="meOffice">Office *</label><select id="meOffice"></select><small class="fe" id="meOfficeErr"></small></div>'
          +     '<div class="fld"><label for="meDate">Date *</label><input id="meDate" type="date"><small class="fe" id="meDateErr"></small></div>'
          +     '<div class="fld"><label for="meTime">Time</label><input id="meTime" type="time"></div>'
          +     '<div class="fld span2"><label for="meAttendees">Attendees</label><input id="meAttendees" placeholder="e.g. Sarah Thompson, Harsh Kansara"></div>'
          +     '<div class="fld span2"><label for="meStatus">Status</label><select id="meStatus">'+statusOpts+'</select></div>'
          +     '<div class="fld span2"><div class="divider-lab">Notes &amp; outcome</div></div>'
          +     '<div class="fld span2"><label for="meNotes">Notes</label><textarea id="meNotes" rows="3" placeholder="What was discussed\u2026"></textarea></div>'
          +     '<div class="fld span2"><label for="meOutcome">Outcome</label><textarea id="meOutcome" rows="2" placeholder="What was the result\u2026"></textarea></div>'
          +     '<div class="fld span2"><label for="meNext">Next action</label><input id="meNext" placeholder="e.g. Send the founding-office pack"></div>'
          +     '<div class="fld"><label for="meFollow">Follow-up date</label><input id="meFollow" type="date"></div>'
          +   '</div></div>'
          +   '<div class="ov-foot"><div class="ov-err" id="meErr"></div><button class="btn-out" id="meCancel">Cancel</button><button class="btn-primary" id="meSave"><span>Save meeting</span></button></div>'
          + '</aside>';
        var wrap = document.createElement('div'); wrap.innerHTML = html;
        while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
        els.scrim = document.getElementById('meScrim'); els.ov = document.getElementById('meOv');
        document.getElementById('meClose').addEventListener('click', close);
        document.getElementById('meCancel').addEventListener('click', close);
        els.scrim.addEventListener('click', close);
        document.getElementById('meSave').addEventListener('click', save);
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && els.ov.classList.contains('show')) close(); });
        built = true;
      }
      async function fillOffices(selId){
        var sel = document.getElementById('meOffice');
        sel.innerHTML = '<option value="">Loading\u2026</option>';
        try{
          var res = await sb.from('offices').select('id,name').order('name', { ascending:true });
          if(res.error) throw res.error;
          var list = res.data || [];
          if(list.length === 0){ sel.innerHTML = '<option value="">No offices yet</option>'; }
          else { sel.innerHTML = '<option value="">Select an office\u2026</option>' + list.map(function(o){ return '<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>'; }).join(''); }
          if(selId) sel.value = selId;
        }catch(e){ sel.innerHTML = '<option value="">Could not load offices</option>'; }
      }
      function show(on){
        if(on){ els.scrim.classList.add('show'); els.ov.classList.add('show'); els.ov.setAttribute('aria-hidden','false'); }
        else { els.scrim.classList.remove('show'); els.ov.classList.remove('show'); els.ov.setAttribute('aria-hidden','true'); }
      }
      function open(meeting, presetOfficeId, savedCb){
        build();
        editing = meeting || null; onSaved = savedCb || null;
        document.getElementById('meTitle').textContent = meeting ? 'Edit meeting' : 'Log a meeting';
        document.getElementById('meDate').value = (meeting && meeting.meeting_date) ? String(meeting.meeting_date).slice(0,10) : '';
        document.getElementById('meTime').value = (meeting && meeting.meeting_time) ? String(meeting.meeting_time).slice(0,5) : '';
        document.getElementById('meAttendees').value = (meeting && meeting.attendees) || '';
        document.getElementById('meStatus').value = (meeting && meeting.status) || 'scheduled';
        document.getElementById('meNotes').value = (meeting && meeting.notes) || '';
        document.getElementById('meOutcome').value = (meeting && meeting.outcome) || '';
        document.getElementById('meNext').value = (meeting && meeting.next_action) || '';
        document.getElementById('meFollow').value = (meeting && meeting.follow_up_date) ? String(meeting.follow_up_date).slice(0,10) : '';
        document.getElementById('meOfficeErr').textContent = ''; document.getElementById('meDateErr').textContent = ''; document.getElementById('meErr').textContent = '';
        show(true);
        fillOffices(meeting ? meeting.office_id : presetOfficeId);
      }
      function close(){ show(false); }
      async function save(){
        var officeId = document.getElementById('meOffice').value;
        var date = document.getElementById('meDate').value;
        document.getElementById('meOfficeErr').textContent = ''; document.getElementById('meDateErr').textContent = ''; document.getElementById('meErr').textContent = '';
        var bad = false;
        if(!officeId){ document.getElementById('meOfficeErr').textContent = 'Please choose an office.'; bad = true; }
        if(!date){ document.getElementById('meDateErr').textContent = 'Please choose a date.'; bad = true; }
        if(bad) return;
        var payload = {
          office_id: officeId,
          meeting_date: date,
          meeting_time: nn(document.getElementById('meTime').value),
          attendees: nn(document.getElementById('meAttendees').value),
          status: document.getElementById('meStatus').value || 'scheduled',
          notes: nn(document.getElementById('meNotes').value),
          outcome: nn(document.getElementById('meOutcome').value),
          next_action: nn(document.getElementById('meNext').value),
          follow_up_date: nn(document.getElementById('meFollow').value)
        };
        var btn = document.getElementById('meSave'), span = btn.querySelector('span'); var label = span ? span.textContent : '';
        btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
        try{
          var res = editing
            ? await sb.from('meetings').update(payload).eq('id', editing.id).select().single()
            : await sb.from('meetings').insert(payload).select().single();
          if(res.error) throw res.error;
          var wasEdit = !!editing; close();
          toast(wasEdit ? 'Meeting updated' : 'Meeting logged');
          if(onSaved) onSaved();
        }catch(e){ document.getElementById('meErr').textContent = friendlyShort(e); }
        finally{ btn.disabled = false; if(span) span.textContent = label || 'Save meeting'; }
      }
      return { open: open };
    })();

    /* ---- reusable confirm dialog (appended to <body>) ---- */
    function confirmDialog(title, messageHtml, onConfirm){
      var sc = document.getElementById('cfxScrim');
      if(!sc){
        var wrap = document.createElement('div');
        wrap.innerHTML = '<div class="cf-scrim l3" id="cfxScrim"><div class="cf"><h3 id="cfxTitle"></h3><p id="cfxText"></p><div class="cf-act"><button class="btn-out" id="cfxCancel">Cancel</button><button class="btn-danger" id="cfxOk">Delete</button></div></div></div>';
        while(wrap.firstChild) document.body.appendChild(wrap.firstChild);
        sc = document.getElementById('cfxScrim');
        document.getElementById('cfxCancel').addEventListener('click', closeCfx);
        sc.addEventListener('click', function(e){ if(e.target.id === 'cfxScrim') closeCfx(); });
      }
      document.getElementById('cfxTitle').textContent = title;
      document.getElementById('cfxText').innerHTML = messageHtml;
      var ok = document.getElementById('cfxOk');
      ok.disabled = false; ok.textContent = 'Delete';
      ok.onclick = async function(){
        ok.disabled = true; var t = ok.textContent; ok.textContent = 'Deleting\u2026';
        try{ await onConfirm(); }catch(e){}
        closeCfx(); ok.disabled = false; ok.textContent = t || 'Delete';
      };
      sc.hidden = false; requestAnimationFrame(function(){ sc.classList.add('show'); });
    }
    function closeCfx(){ var sc = document.getElementById('cfxScrim'); if(!sc) return; sc.classList.remove('show'); setTimeout(function(){ sc.hidden = true; }, 200); }

    /* ---- meeting history inside an Office record ---- */
    function renderOfficeHistory(o){
      var box = document.getElementById('ofHistory'); if(!box) return;
      if(!o){
        box.innerHTML = '<div class="divider-lab">Meeting history</div><p class="hist-hint">Save this office first, then you can log meetings against it.</p>';
        return;
      }
      box.innerHTML = '<div class="hist-head"><div class="divider-lab">Meeting history</div><button class="btn-soft" id="ofLogMtg">'+ic('plus')+' Log a meeting</button></div><div id="ofHistList" class="hist"><div class="hist-loading">Loading\u2026</div></div>';
      document.getElementById('ofLogMtg').addEventListener('click', function(){ MeetingEditor.open(null, o.id, function(){ loadOfficeHistory(o); }); });
      loadOfficeHistory(o);
    }
    async function loadOfficeHistory(o){
      var list = document.getElementById('ofHistList'); if(!list) return;
      list.innerHTML = '<div class="hist-loading">Loading\u2026</div>';
      try{
        var res = await sb.from('meetings').select('*').eq('office_id', o.id).order('meeting_date', { ascending:false, nullsFirst:false });
        if(res.error) throw res.error;
        var ms = res.data || [];
        if(ms.length === 0){ list.innerHTML = '<p class="hist-empty">No meetings logged yet.</p>'; return; }
        list.innerHTML = ms.map(histItem).join('');
        Array.prototype.forEach.call(list.querySelectorAll('[data-mtg]'), function(el){
          el.addEventListener('click', function(){
            var m = ms.filter(function(x){ return String(x.id) === String(el.getAttribute('data-mtg')); })[0];
            MeetingEditor.open(m, o.id, function(){ loadOfficeHistory(o); });
          });
        });
      }catch(e){
        var mm = ((e && e.message) || '').toLowerCase(); var setup = (mm.indexOf('schema cache') >= 0 || mm.indexOf('does not exist') >= 0 || mm.indexOf('could not find the table') >= 0 || (e && e.code) === 'PGRST205');
        list.innerHTML = '<p class="hist-empty">'+(setup ? 'Run the meetings setup SQL to enable meeting history.' : 'Couldn\u2019t load meetings.')+'</p>';
      }
    }
    function histItem(m){
      var sm = mtgStatusMeta(m.status);
      var when = (m.meeting_date ? fmtDate(m.meeting_date) : 'No date') + (m.meeting_time ? ' \u00b7 ' + fmtTime(m.meeting_time) : '');
      var snip = m.outcome || m.notes || m.next_action || '';
      return '<div class="hist-item" data-mtg="'+esc(m.id)+'"><div class="hist-top"><span class="hist-when">'+esc(when)+'</span>'
        + '<span class="spill-static" style="color:'+sm.c+';background-color:'+sm.bg+'">'+sm.label+'</span></div>'
        + (snip ? '<div class="hist-snip">'+esc(snip)+'</div>' : '')
        + '</div>';
    }

    /* =========================================================
       FOLLOW UPS — linked to offices, optionally to meetings.
       Table: public.follow_ups (run follow-ups-setup.sql once).
       "Overdue" is DERIVED: a pending follow-up past its due date.
       Stored status is only pending / completed, so overdue is
       always accurate as time passes.
       ========================================================= */
    var SVG_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>';

    var FUSTAT = {
      pending:   { label:'Pending',   c:'#2563EB', bg:'#E7EEFC' },
      overdue:   { label:'Overdue',   c:'#B42318', bg:'#FBEAE8' },
      completed: { label:'Completed', c:'#0E5A3C', bg:'#E7F0EA' }
    };
    var FUPRIO = {
      high:   { label:'High',   c:'#B42318', bg:'#FBEAE8' },
      medium: { label:'Medium', c:'#9A6A00', bg:'#FBF1D8' },
      low:    { label:'Low',    c:'#5C6760', bg:'#ECE8DD' }
    };
    function todayStr(){ var d=new Date(); var m=d.getMonth()+1, day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day); }
    function fuEff(f){ if(f.status==='completed') return 'completed'; if(f.due_date && String(f.due_date).slice(0,10) < todayStr()) return 'overdue'; return 'pending'; }

    var FU = { all:[], offices:{}, officeList:null, q:'', status:'all', sort:'due', loading:true };

    function followupsView(){
      return ''
        + '<div class="view-head">'
        +   '<div class="vh-sub">Every touchpoint you owe an office \u2014 sorted by what\u2019s due next.</div>'
        +   '<div class="tools">'
        +     '<div class="search">'+SVG_SEARCH+'<input id="fuSearch" type="search" placeholder="Search office, type, notes\u2026" autocomplete="off"></div>'
        +     '<select class="sortsel" id="fuSort"><option value="due">Sort: Due date</option><option value="priority">Sort: Priority</option></select>'
        +     '<button class="btn-primary" id="fuAdd">'+ic('plus')+'<span>Add follow-up</span></button>'
        +   '</div>'
        + '</div>'
        + '<div class="summary" id="fuSummary"></div>'
        + '<div class="chips" id="fuChips"></div>'
        + '<div id="fuBody"><div class="loading">Loading follow-ups\u2026</div></div>';
    }

    function followupsMount(){
      var body = document.getElementById('fuBody');
      if(!sb){ if(body) body.innerHTML = errBox('Not connected to the database yet.'); return; }
      var s = document.getElementById('fuSearch'); s.addEventListener('input', function(){ FU.q = s.value.trim().toLowerCase(); renderFuList(); });
      var so = document.getElementById('fuSort'); so.value = FU.sort; so.addEventListener('change', function(){ FU.sort = so.value; renderFuList(); });
      document.getElementById('fuAdd').addEventListener('click', function(){
        if(FU.officeList && FU.officeList.length === 0){ toast('Add an office first', 'err'); return; }
        FollowUpEditor.open(null, null, loadFollowUps);
      });
      loadFollowUps();
    }

    async function loadFollowUps(){
      FU.loading = true;
      var body = document.getElementById('fuBody'); if(body) body.innerHTML = '<div class="loading">Loading follow-ups\u2026</div>';
      try{
        var offRes = await sb.from('offices').select('id,name,suburb').order('name', { ascending:true });
        if(offRes.error) throw offRes.error;
        FU.officeList = offRes.data || []; FU.offices = {}; FU.officeList.forEach(function(o){ FU.offices[o.id] = o; });
        var res = await sb.from('follow_ups').select('*').order('due_date', { ascending:true, nullsFirst:false });
        if(res.error) throw res.error;
        FU.all = res.data || [];
        FU.loading = false;
        renderFuSummary(); renderFuChips(); renderFuList();
      }catch(e){
        FU.loading = false;
        if(body){ body.innerHTML = errBox(friendlyFuError(e)); var r = document.getElementById('ofRetry'); if(r) r.addEventListener('click', loadFollowUps); }
        renderFuSummary(); renderFuChips();
      }
    }

    function renderFuSummary(){
      var el = document.getElementById('fuSummary'); if(!el) return;
      var open = 0, over = 0, done = 0;
      FU.all.forEach(function(f){ var e = fuEff(f); if(e === 'completed') done++; else { open++; if(e === 'overdue') over++; } });
      el.innerHTML = stat('Open', open) + stat('Overdue', over) + stat('Completed', done);
    }

    function renderFuChips(){
      var el = document.getElementById('fuChips'); if(!el) return;
      var defs = [{ id:'all', label:'All' }, { id:'pending', label:'Pending' }, { id:'overdue', label:'Overdue' }, { id:'completed', label:'Completed' }];
      function count(id){ return id === 'all' ? FU.all.length : FU.all.filter(function(f){ return fuEff(f) === id; }).length; }
      el.innerHTML = defs.map(function(s){
        var active = FU.status === s.id; var meta = FUSTAT[s.id];
        var style = (active && meta) ? (' style="background-color:'+meta.bg+';color:'+meta.c+';border-color:transparent"') : '';
        return '<button class="chip'+(active?' active':'')+'" data-fst="'+s.id+'"'+style+'>'+s.label+' <span class="ct">'+count(s.id)+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b){
        b.addEventListener('click', function(){ FU.status = b.getAttribute('data-fst'); renderFuChips(); renderFuList(); });
      });
    }

    function fuComparator(a, b){
      var ac = a.status === 'completed', bc = b.status === 'completed';
      if(ac !== bc) return ac ? 1 : -1;                 // completed sink to the bottom
      if(FU.sort === 'priority'){
        var po = { high:0, medium:1, low:2 };
        var pa = po[a.priority] != null ? po[a.priority] : 1, pb = po[b.priority] != null ? po[b.priority] : 1;
        if(pa !== pb) return pa - pb;
      }
      var ad = a.due_date ? String(a.due_date).slice(0,10) : '9999-12-31';
      var bd = b.due_date ? String(b.due_date).slice(0,10) : '9999-12-31';
      return ad < bd ? -1 : ad > bd ? 1 : 0;             // soonest / most overdue first
    }

    function renderFuList(){
      var body = document.getElementById('fuBody'); if(!body || FU.loading) return;
      if(FU.all.length === 0){
        body.innerHTML = fuEmpty();
        var b = document.getElementById('fuAddEmpty'); if(b) b.addEventListener('click', function(){ FollowUpEditor.open(null, null, loadFollowUps); });
        return;
      }
      var rows = FU.all.filter(function(f){
        if(FU.status !== 'all' && fuEff(f) !== FU.status) return false;
        if(FU.q){ var off = FU.offices[f.office_id]; var hay = (((off && off.name) || '')+' '+(f.type||'')+' '+(f.notes||'')).toLowerCase(); if(hay.indexOf(FU.q) < 0) return false; }
        return true;
      });
      rows.sort(fuComparator);
      if(rows.length === 0){ body.innerHTML = '<div class="empty-sm">No follow-ups match your search or filter.</div>'; return; }
      var head = '<div class="fu-head"><div></div><div>Follow-up</div><div>Due</div><div>Priority</div><div>Status</div><div></div></div>';
      body.innerHTML = '<div class="of-table">' + head + rows.map(fuRow).join('') + '</div>';
      wireFuRows();
    }

    function fuRow(f){
      var off = FU.offices[f.office_id];
      var eff = fuEff(f); var sm = FUSTAT[eff]; var pm = FUPRIO[f.priority] || FUPRIO.medium;
      var done = f.status === 'completed';
      var title = f.type ? esc(f.type) : '<span class="dim">Follow-up</span>';
      var officeName = off ? esc(off.name) : '<span class="dim">Unknown office</span>';
      var linked = f.meeting_id ? '<span class="fu-link" title="Linked to a meeting">'+SVG_LINK+'</span>' : '';
      var due = f.due_date ? ('<span class="'+(eff === 'overdue' ? 'due-over' : '')+'">'+esc(fmtDate(f.due_date))+'</span>') : '<span class="dim">\u2014</span>';
      return ''
        + '<div class="fu-row'+(eff === 'overdue' ? ' overdue' : '')+(done ? ' done' : '')+'" data-id="'+esc(f.id)+'">'
        +   '<button class="chk'+(done ? ' on' : '')+'" data-fucheck="'+esc(f.id)+'" title="'+(done ? 'Mark as not done' : 'Mark as done')+'" aria-label="Toggle done">'+ic('check')+'</button>'
        +   '<div class="fu-main" data-edit><b>'+title+linked+'</b><span class="sub">'+officeName+'</span></div>'
        +   '<div class="fu-due"><span class="cl">Due</span>'+due+'</div>'
        +   '<div class="fu-prio"><span class="cl">Priority</span><span class="spill-static" style="color:'+pm.c+';background-color:'+pm.bg+'">'+pm.label+'</span></div>'
        +   '<div class="fu-status"><span class="cl">Status</span><span class="spill-static" style="color:'+sm.c+';background-color:'+sm.bg+'">'+sm.label+'</span></div>'
        +   '<div class="c-act"><button class="ia" data-fedit="'+esc(f.id)+'" title="Edit" aria-label="Edit">'+SVG_EDIT+'</button><button class="ia danger" data-fdel="'+esc(f.id)+'" title="Delete" aria-label="Delete">'+SVG_TRASH+'</button></div>'
        + '</div>';
    }

    function wireFuRows(){
      var body = document.getElementById('fuBody');
      Array.prototype.forEach.call(body.querySelectorAll('[data-fucheck]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); toggleFuDone(b.getAttribute('data-fucheck')); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-fedit]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); var f = findFu(b.getAttribute('data-fedit')); if(f) FollowUpEditor.open(f, null, loadFollowUps); }); });
      Array.prototype.forEach.call(body.querySelectorAll('[data-fdel]'), function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); confirmFuDelete(findFu(b.getAttribute('data-fdel'))); }); });
      Array.prototype.forEach.call(body.querySelectorAll('.fu-main[data-edit]'), function(c){ c.addEventListener('click', function(){ var f = findFu(c.closest('.fu-row').getAttribute('data-id')); if(f) FollowUpEditor.open(f, null, loadFollowUps); }); });
    }
    function findFu(id){ return FU.all.filter(function(f){ return String(f.id) === String(id); })[0]; }

    async function toggleFuDone(id){
      var f = findFu(id); if(!f) return;
      var next = f.status === 'completed' ? 'pending' : 'completed';
      try{
        var res = await sb.from('follow_ups').update({ status: next }).eq('id', id).select().single();
        if(res.error) throw res.error;
        f.status = next;
        renderFuSummary(); renderFuChips(); renderFuList();
        toast(next === 'completed' ? 'Marked done' : 'Reopened');
      }catch(e){ toast(friendlyShort(e), 'err'); loadFollowUps(); }
    }

    function confirmFuDelete(f){
      if(!f) return; var off = FU.offices[f.office_id];
      var what = f.type ? ('\u201c'+esc(f.type)+'\u201d') : 'this follow-up';
      confirmDialog('Delete follow-up?', 'Delete '+what+(off ? (' for <b>'+esc(off.name)+'</b>') : '')+'? This can\u2019t be undone.', async function(){
        var res = await sb.from('follow_ups').delete().eq('id', f.id);
        if(res.error){ toast(friendlyShort(res.error), 'err'); throw res.error; }
        toast('Follow-up deleted'); loadFollowUps();
      });

        document.getElementById('eoOfficeErr').textContent = ''; document.getElementById('eoErr').textContent = '';
        if(!officeId){ document.getElementById('eoOfficeErr').textContent = 'Please choose an office.'; return; }
        var status = document.getElementById('eoStatusF').value || 'draft';
        var signed = nn(document.getElementById('eoSigned').value);
        if(status === 'signed' && !signed){ signed = todayStr(); }
        var payload = { office_id: officeId, date_sent: nn(document.getElementById('eoSent').value), status: status, signed_date: signed, notes: nn(document.getElementById('eoNotes').value) };
        var btn = document.getElementById('eoSave'), span = btn.querySelector('span'); var label = span ? span.textContent : '';
        btn.disabled = true; if(span) span.textContent = 'Saving\u2026';
        try{
          var res = editing
            ? await sb.from('eois').update(payload).eq('id', editing.id).select().single()
            : await sb.from('eois').insert(payload).select().single();
          if(res.error) throw res.error;
          var wasEdit = !!editing; close();
          toast(wasEdit ? 'EOI updated' : 'EOI added');
          if(onSaved) onSaved();
        }catch(e){ document.getElementById('eoErr').textContent = friendlyShort(e); }
        finally{ btn.disabled = false; if(span) span.textContent = label || 'Save EOI'; }
      }
      return { open: open };
    })();

    /* ---- office drawer: EOI history ---- */

    async function loadOfficeEoiHistory(o){

      list.innerHTML = '<div class="hist-loading">Loading\u2026</div>';

        list.innerHTML = '<p class="hist-empty">'+(setup ? 'Run the eois setup SQL to enable EOI history.' : 'Couldn\u2019t load EOIs.')+'</p>';
