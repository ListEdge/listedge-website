<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ListEdge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ▼▼▼  FILL THESE IN  ▼▼▼
     Use the SAME two values as Founder HQ (see assets/admin/supabase-config.js).
     The anon key is a public client key — safe to keep here. */
  window.LISTEDGE_SUPABASE = {
    url:     "https://YOUR-PROJECT.supabase.co",
    anonKey: "YOUR-ANON-KEY"
  };
  /* ▲▲▲  FILL THESE IN  ▲▲▲ */
</script>

<style>
  :root{
    --green:#0E5A3C; --green-dk:#0A4630; --green-deep:#063225;
    --citron:#C8F24A; --bone:#F2EFE7; --ink:#16191A; --sub:#5C6760;
    --sage:#A6C0B1; --line:#E2DCCE; --card:#FFFFFF;
    --display:'Bricolage Grotesque','Instrument Sans',sans-serif;
    --body:'Instrument Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bone);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* ---------- LOGIN ---------- */
  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(120% 120% at 50% 0%, var(--green) 0%, var(--green-dk) 45%, var(--green-deep) 100%);}
  .login-card{width:100%;max-width:400px}
  .lb{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .lb-tile{width:40px;height:40px;border-radius:11px;background:var(--green-dk);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .lb-word{font-family:var(--display);font-weight:800;font-size:23px;color:#fff;letter-spacing:-.01em}
  .lb-word b{color:var(--citron);font-weight:800}
  .login h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;color:#fff;margin:0 0 8px}
  .login p.sub{color:#BFD8C9;font-size:14.5px;line-height:1.5;margin:0 0 26px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#CFE3D7;margin-bottom:6px}
  .field input{width:100%;height:46px;border-radius:11px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);color:#fff;font-size:15px;padding:0 14px;outline:none;transition:.15s}
  .field input::placeholder{color:#8FB0A0}
  .field input:focus{border-color:var(--citron);background:rgba(255,255,255,.1)}
  .signin-btn{width:100%;height:48px;border:none;border-radius:11px;background:var(--citron);color:var(--green-deep);
    font-size:15.5px;font-weight:700;margin-top:8px;transition:.15s}
  .signin-btn:hover{filter:brightness(1.04)}
  .signin-btn:disabled{opacity:.6;cursor:default}
  .login .err{min-height:20px;color:#FFD7C2;font-size:13.5px;margin:12px 2px 0;line-height:1.45}
  .login .note{color:#9FBBAC;font-size:12.5px;margin-top:22px;text-align:center;line-height:1.5}
  .login .note a{color:#CFE3D7}
  .cfgwarn{max-width:420px;background:#fff;border-radius:14px;padding:20px 22px;color:var(--ink);font-size:14px;line-height:1.55}
  .cfgwarn b{font-family:var(--display)}
  .cfgwarn code{background:#F2EFE7;border-radius:5px;padding:1px 5px;font-size:12.5px}

  /* ---------- APP CHROME ---------- */
  .topbar{height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .tb-brand{display:flex;align-items:center;gap:9px}
  .tb-tile{width:32px;height:32px;border-radius:9px;background:var(--green-dk);display:flex;align-items:center;justify-content:center}
  .tb-word{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
  .tb-word b{color:var(--green)}
  .seg{display:inline-flex;background:#EEF1EA;border-radius:11px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;font-size:13.5px;font-weight:600;color:var(--sub);padding:7px 14px;border-radius:8px;transition:.15s}
  .seg button.on{background:#fff;color:var(--green-dk);box-shadow:0 1px 2px rgba(16,32,26,.12)}
  .sp{flex:1}
  .acct{position:relative}
  .acct-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:5px 10px 5px 5px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--green-dk);color:var(--citron);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
  .acct-meta{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .acct-meta b{font-size:13px;font-weight:650}
  .acct-meta span{font-size:11.5px;color:var(--sub)}
  .menu{position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(16,32,26,.16);min-width:190px;padding:6px;z-index:30}
  .menu button{display:flex;width:100%;align-items:center;gap:9px;border:none;background:none;text-align:left;font-size:13.5px;color:var(--ink);padding:9px 10px;border-radius:8px}
  .menu button:hover{background:#F4F6EC}
  .menu .who{padding:9px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .menu .who b{display:block;font-size:13.5px}
  .menu .who span{font-size:12px;color:var(--sub)}

  .wrap{max-width:940px;margin:0 auto;padding:26px 18px 80px}
  .greet{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em;margin:6px 0 2px}
  .greet-sub{color:var(--sub);font-size:14px;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,32,26,.04)}
  .card h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 4px}
  .card .muted{color:var(--sub);font-size:13.5px;line-height:1.5;margin:0}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 16px;color:var(--sub)}
  .empty svg{margin-bottom:10px}
  .empty .t{font-weight:650;color:var(--ink);font-size:14.5px;margin-bottom:3px}
  .empty .d{font-size:13px;max-width:360px;line-height:1.5}
  .soon{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green);background:#EAF4EC;border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:middle}
  .appwrap{max-width:480px;margin:0 auto;padding:22px 16px 96px}
  .ph{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin:4px 0 16px}
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 12px rgba(16,32,26,.05)}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:#8a948c;font:inherit;font-size:10.5px;font-weight:600;padding:6px 2px;cursor:pointer;border-radius:10px}
  .navbtn.on{color:var(--green-dk)}
  .navbtn:hover{background:#F6F4EC}
  .prof .prof-top{display:flex;align-items:center;gap:13px;margin-bottom:6px}
  .av.lg{width:48px;height:48px;border-radius:50%;font-size:17px}
  .prof-nm{font-family:var(--display);font-weight:700;font-size:18px}
  .prof-rl{font-size:13px;color:var(--sub)}
  .prof-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
  .prof-row span{color:var(--sub)} .prof-row b{font-weight:600}
  .signout-btn{width:100%;height:46px;margin-top:16px;border:1px solid var(--line);background:#fff;border-radius:11px;font:inherit;font-size:14.5px;font-weight:650;color:#9a3527;cursor:pointer}
  .signout-btn:hover{background:#FBECEA}

  /* ---------- OFFICE / TEAM ---------- */
  .secthead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
  .secthead h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
  .secthead .office{color:var(--sub);font-size:13.5px}
  .btn-primary{border:none;border-radius:10px;background:var(--green-dk);color:#fff;font-weight:650;font-size:13.5px;padding:10px 15px}
  .btn-primary:hover{background:var(--green)}
  .team{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .nm{font-weight:650;font-size:14.5px}
  .row .em{font-size:12.5px;color:var(--sub)}
  .rinfo{min-width:0;flex:1}
  .pill{font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:3px 9px}
  .pill.mgr{color:#1F5C46;background:#E1F1E7}
  .pill.agt{color:#3a4a55;background:#E9EEF2}
  .pill.on{color:#1F7A52;background:#E6F4EC}
  .pill.off{color:#9a5a1a;background:#Faecd8}
  .rowact{display:flex;align-items:center;gap:8px}
  .lnk{border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink);padding:7px 11px}
  .lnk:hover{background:#F4F6EC}
  .lnk.danger{color:#9a3527}
  .lnk.danger:hover{background:#FbeceA}
  .panel-note{background:#F3F7E6;border:1px solid rgba(10,70,48,.16);border-radius:11px;padding:11px 14px;font-size:13px;line-height:1.5;color:#33402f}
  .loading{padding:50px 0;text-align:center;color:var(--sub);font-size:14px}

  /* ---- responsive shell ---- */
  .topbar{position:sticky;top:0;z-index:40}
  .shell{display:flex;align-items:flex-start}
  .main{flex:1;min-width:0}
  .side{display:none}
  /* ---- opportunities ---- */
  .opp{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .opp-row{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;font:inherit;padding:14px 16px;cursor:pointer;border-top:1px solid var(--line);text-align:left}
  .opp-row:first-child{border-top:none}
  .opp-row:hover{background:#F8F6EF}
  .opp-ic{width:32px;height:32px;border-radius:9px;background:#EAF4EC;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .opp-tx{flex:1;font-size:14.5px;font-weight:600;color:var(--ink)}
  .opp-n{min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--green);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .opp-n.zero{background:#EEE9DC;color:#9aa49c}
  /* ---- snapshot ---- */
  .snap h3{margin:0 0 2px}
  .snap-sub{font-size:12.5px;margin:0 0 16px;line-height:1.45}
  .snap-empty{background:#F4F1E8;border:1px dashed var(--line);border-radius:12px;padding:18px;font-size:13.5px;color:var(--sub);line-height:1.5;text-align:center;margin-bottom:16px}
  .snap-hero{position:relative;background:linear-gradient(150deg,var(--green-dk),var(--green-deep));border-radius:14px;padding:20px;color:#fff;margin-bottom:16px;overflow:hidden}
  .snap-big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
  .snap-state{font-size:14px;line-height:1.5;color:#DCE9E0;margin-top:4px}
  .snap-state b{color:#fff}
  .snap-budg{margin-top:12px;font-size:13px;color:#C8F24A;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}
  .snap-budg b{color:#fff}
  .snap-form{display:flex;flex-direction:column;gap:12px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lab{font-size:12px;font-weight:600;color:var(--sub)}
  .snap-form select,.card select,.card input[type=number]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink)}
  .card input[type=number]{-moz-appearance:textfield}
  /* ---- briefs ---- */
  .bf{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .bf-h{font-size:14.5px;font-weight:600;color:var(--ink)}
  .bf-sub{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
  .bf-budg{font-size:13px;font-weight:700;color:var(--green)}
  .bf-mine{font-size:11px;font-weight:700;color:var(--green-dk);background:#EAF4EC;border-radius:999px;padding:2px 9px}
  .bf-via{font-size:11.5px;color:var(--sub)}
  .post-ok{background:#EAF4EC;border:1px solid #BFE0CC;color:#0A4630;border-radius:11px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
  /* ---- desktop ---- */
  @media(min-width:760px){
    .side{display:flex;flex-direction:column;gap:4px;width:222px;flex:0 0 222px;padding:22px 14px;position:sticky;top:60px;align-self:flex-start}
    .sidebtn{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;font:inherit;font-size:14.5px;font-weight:600;color:var(--sub);padding:11px 13px;border-radius:11px;cursor:pointer;text-align:left}
    .sidebtn.on{background:#EAF4EC;color:var(--green-dk)}
    .sidebtn:hover{background:#F6F4EC}
    .sidebtn svg{flex:0 0 auto}
    .appwrap{max-width:760px!important;margin:0 0 0 8px!important;padding:26px 30px 48px!important}
    .appwrap.office{max-width:900px!important;margin:0 auto!important}
    .tabbar{display:none}
  }
  @media(min-width:1100px){ .appwrap{max-width:860px!important} }

  /* ---- listings ---- */
  .lcard{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
  .lcard-head{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;font:inherit;padding:14px 16px;cursor:pointer;text-align:left}
  .lcard-head:hover{background:#F8F6EF}
  .lcard-main{flex:1;min-width:0}
  .lcard-h{font-size:14.5px;font-weight:700;color:var(--ink)}
  .lcard-sub{font-size:12.5px;color:var(--sub);margin-top:3px;text-transform:capitalize}
  .lcard-n{min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--green);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .lcard-n.zero{background:#EEE9DC;color:#9aa49c}
  .lcard-body{border-top:1px solid var(--line);padding:4px 16px 12px}
  .match{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F0ECDF}
  .match:last-child{border-bottom:none}
  .match-tx{flex:1;font-size:13.5px;color:var(--ink)}
  .mini-btn{border:none;background:var(--green);color:#fff;font:inherit;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .mini-btn:hover{background:var(--green-dk)}
  .intro-done{font-size:12px;font-weight:700;color:var(--green-dk);background:#EAF4EC;border-radius:999px;padding:5px 11px;white-space:nowrap}
  /* ---- introductions ---- */
  .intro{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;margin-bottom:11px}
  .intro-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .intro-role{font-size:13px;font-weight:700;color:var(--ink)}
  .intro-pill{font-size:11px;font-weight:700;color:#9a7b1f;background:#FBF1D4;border-radius:999px;padding:4px 10px;white-space:nowrap}
  .intro-pill.on{color:var(--green-dk);background:#EAF4EC}
  .intro-line{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);margin:5px 0}
  .intro-line svg{flex:0 0 auto}
  .intro-contact{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
  .intro-contact a{color:var(--green-dk);font-weight:600;text-decoration:none}
  .intro-wait{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub)}
  .intro .mini-btn{margin-top:11px}

  /* ===== prototype-style buyer board ===== */
  .fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,24,.04);transition:border-color .12s,box-shadow .12s;}
  .bcard:hover{border-color:#CFE0D3;box-shadow:0 3px 10px rgba(20,30,24,.07);}
  .bcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .price{font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink);letter-spacing:-.01em;}
  .when{display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-size:11.5px;white-space:nowrap;}
  .when svg{width:13px;height:13px;}
  .statline{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 11px;}
  .stat{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-size:13px;font-weight:600;}
  .statline .stat svg{width:14px;height:14px;}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;align-items:center;}
  .pinic{display:inline-flex;align-items:center;}
  .pinic svg{width:13px;height:13px;}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:#FBFAF6;color:var(--sub);border:1px solid var(--line);}
  .tag.green{background:#EAF4EC;color:var(--green);border:1px solid #CADFD0;}
  .bcard-note{margin:0 0 12px;font-size:13px;color:var(--sub);line-height:1.45;}
  .cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:11px;}
  .foot-who{font-size:12.5px;color:var(--ink);}
  .viewlink{display:inline-flex;align-items:center;gap:2px;color:var(--green);font-weight:700;font-size:13px;white-space:nowrap;}
  .viewlink svg{width:15px;height:15px;}
  /* filter panel */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;}
  .panelhead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;background:none;border:none;cursor:pointer;text-align:left;}
  .panelhead .stat svg{width:16px;height:16px;}
  .panelbody{padding:2px 15px 15px;display:grid;gap:12px;}
  .lab-n{font-weight:600;color:var(--green);}
  .chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
  .chosen{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;background:#FBFAF6;color:var(--ink);border:1px solid var(--line);cursor:pointer;}
  .chip svg{width:12px;height:12px;}
  .chip.on{background:#EAF4EC;color:var(--green);border-color:#CADFD0;}
  .linklike{justify-self:start;background:none;border:none;color:var(--green);font-weight:700;font-size:13px;cursor:pointer;padding:0;}
  .results-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
  .rh-count{font-size:13px;font-weight:700;color:var(--ink);}
  .rh-live{font-size:12px;color:var(--sub);}
  .rh-live svg{width:13px;height:13px;}
  /* consent */
  .consent{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;margin-top:14px;}
  .consent.on{border-color:var(--green);}
  .cbox{width:20px;height:20px;border-radius:6px;flex-shrink:0;margin-top:1px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .consent.on .cbox{background:var(--green);border-color:var(--green);}
  .cbox svg{width:14px;height:14px;}
  .ctxt{font-size:12.5px;color:var(--ink);line-height:1.45;}
  /* detail overlay */
  .overlay{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;}
  .backdrop{position:absolute;inset:0;background:rgba(8,18,12,.46);backdrop-filter:blur(2px);}

<body>
<div id="screen"><div class="login"><div class="loading" style="color:#BFD8C9">Loading…</div></div></div>

<script>
(function(){
  "use strict";
  var cfg = window.LISTEDGE_SUPABASE || {};
  var sb = null;
  var ST = { user:null, profile:null, view:"app", tab:"home", menu:false, briefs:[], snap:{suburb:"",beds:3,baths:2,type:"Any"}, postMsg:"", listings:[], intros:[], openListing:null, listMsg:"", briefDraft:{beds:3,baths:1,priceMin:"",priceMax:"",landMin:"",landMax:"",subs:[],types:[],notes:"",consent:false}, detail:null, filter:{open:false,suburb:"Any",beds:0,type:"Any"} };
  var screen = document.getElementById("screen");

  // ---- tiny helpers ----
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function initials(name,email){ var n=(name||"").trim(); if(n){var p=n.split(/\s+/);return ((p[0]||"")[0]||"").toUpperCase()+((p[1]||"")[0]||"").toUpperCase();} return ((email||"?")[0]||"?").toUpperCase(); }
  function firstName(name,email){ var n=(name||"").trim(); return n? n.split(/\s+/)[0] : (email||"there").split("@")[0]; }
  function configured(){ return cfg.url && cfg.anonKey && cfg.url.indexOf("YOUR-PROJECT")===-1 && cfg.anonKey.indexOf("YOUR-")===-1; }
  function ic(p,sw,c){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+(c||"currentColor")+'" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
  var I = {
    house:'<path d="M4 19V8l8-5 8 5v11"/><path d="M9 19v-6h6v6"/>',
    grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
    tag:'<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.4 2.4 0 0 0 3.42 0l6.58-6.58a2.4 2.4 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
    clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
    user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    home:'<path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/>',
    plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
    bed:'<path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>',
    bath:'<path d="M4 12h16v3a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M6 12V6a2 2 0 0 1 2-2"/><path d="M5 19l-1 2"/><path d="M20 19l1 2"/>',
    ruler:'<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>',
    pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    sliders:'<path d="M21 6H10"/><path d="M6 6H3"/><path d="M21 12h-7"/><path d="M10 12H3"/><path d="M21 18h-3"/><path d="M14 18H3"/><circle cx="8" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',
    chev:'<path d="m9 18 6-6-6-6"/>',
    x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    check:'<path d="M20 6 9 17l-5-5"/>'
  };

  // ============================ AUTH ============================
  function boot(){
    if(!window.supabase || !configured()){ renderConfig(); return; }
    try{ sb = window.supabase.createClient(cfg.url, cfg.anonKey); }
    catch(e){ renderConfig(); return; }
    sb.auth.getSession().then(function(r){
      var session = (r && r.data) ? r.data.session : null;
      if(session && session.user){ ST.user = session.user; afterAuth(); }
      else { renderLogin(); }
    }).catch(function(){ renderLogin(); });
    sb.auth.onAuthStateChange(function(evt, sess){
      if(evt==="SIGNED_OUT" || !sess){ ST.user=null; ST.profile=null; renderLogin(); }
    });
  }

  function afterAuth(){
    renderBusy("Signing you in…");
    sb.from("profiles").select("*").eq("id", ST.user.id).maybeSingle().then(function(r){
      if(r.error){ renderNoProfile("We couldn’t load your account just now. Please try again in a moment."); return; }
      var p = r.data;
      if(!p){ renderNoProfile(); return; }
      if(p.active===false){ renderDeactivated(); return; }
      ST.profile = p;
      ST.view = "app";
      // load agency name (best-effort)
      if(p.agency_id){
        sb.from("agencies").select("name,active").eq("id", p.agency_id).maybeSingle().then(function(a){
          var ag = (a && a.data) ? a.data : null;
          if(ag && ag.active===false){ renderOfficePaused(); return; }
          ST.profile.agency_name = (ag && ag.name) ? ag.name : "";
          loadAll(renderApp);
        }).catch(function(){ loadAll(renderApp); });
      } else { loadAll(renderApp); }
    }).catch(function(){ renderNoProfile("We couldn’t load your account just now. Please try again in a moment."); });
  }

  function signIn(){
    var email = el("email").value.trim(), pw = el("password").value;
    var btn = el("signinBtn"), err = el("loginErr");
    err.textContent = "";
    if(!email || !pw){ err.textContent = "Enter your email and password."; return; }
    btn.disabled = true; btn.textContent = "Signing in…";
    sb.auth.signInWithPassword({ email:email, password:pw }).then(function(r){
      if(r.error){
        btn.disabled=false; btn.textContent="Sign in";
        err.textContent = "That email and password didn’t match. Please try again.";
        return;
      }
      ST.user = r.data.user; afterAuth();
    }).catch(function(){
      btn.disabled=false; btn.textContent="Sign in";
      err.textContent = "Something went wrong signing in. Please try again.";
    });
  }

  function signOut(){ if(sb){ sb.auth.signOut(); } ST.user=null; ST.profile=null; renderLogin(); }

  // ============================ VIEWS ============================
  function renderBusy(msg){ screen.innerHTML = '<div class="login"><div class="loading" style="color:#BFD8C9">'+esc(msg||"Loading…")+'</div></div>'; }

  function renderConfig(){
    screen.innerHTML =
      '<div class="login"><div class="cfgwarn">'+
        '<b>Almost there.</b><br><br>This app needs your Supabase details before it can sign anyone in. '+
        'Open <code>app.html</code> and paste your project <code>url</code> and <code>anonKey</code> '+
        '(the same two values as Founder HQ) into the block near the top, then redeploy.'+
      '</div></div>';
  }

  function renderLogin(){
    ST.menu=false;
    screen.innerHTML =
      '<div class="login"><div class="login-card">'+
        '<div class="lb"><span class="lb-tile">'+ic(I.house,2.4,"#C8F24A")+'</span>'+
          '<span class="lb-word">List<b>Edge</b></span></div>'+
        '<h1>Sign in to ListEdge.</h1>'+
        '<p class="sub">The private conjunctional network for New Zealand agents.</p>'+
        '<div class="field"><label for="email">Email</label>'+
          '<input id="email" type="email" autocomplete="username" placeholder="you@youroffice.co.nz"></div>'+
        '<div class="field"><label for="password">Password</label>'+
          '<input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
        '<button id="signinBtn" class="signin-btn">Sign in</button>'+
        '<div id="loginErr" class="err"></div>'+
        '<p class="note">Accounts are created by your office. Trouble signing in? Contact your office manager.</p>'+
      '</div></div>';
    el("signinBtn").addEventListener("click", signIn);
    var onEnter = function(e){ if(e.key==="Enter"){ signIn(); } };
    el("email").addEventListener("keydown", onEnter);
    el("password").addEventListener("keydown", onEnter);
    el("email").focus();
  }

  function renderNoProfile(msg){
    screen.innerHTML =
      '<div class="login"><div class="login-card">'+
        '<div class="lb"><span class="lb-tile">'+ic(I.house,2.4,"#C8F24A")+'</span><span class="lb-word">List<b>Edge</b></span></div>'+
        '<h1>Account not set up yet.</h1>'+
        '<p class="sub">'+esc(msg||"Your sign-in works, but your ListEdge profile hasn’t been set up by your office yet. Please contact your office manager.")+'</p>'+
        '<button id="soBtn" class="signin-btn">Back to sign in</button>'+
      '</div></div>';
    el("soBtn").addEventListener("click", signOut);
  }

  function renderDeactivated(){
    screen.innerHTML =
      '<div class="login"><div class="login-card">'+
        '<div class="lb"><span class="lb-tile">'+ic(I.house,2.4,"#C8F24A")+'</span><span class="lb-word">List<b>Edge</b></span></div>'+
        '<h1>Your access is paused.</h1>'+
        '<p class="sub">This account has been deactivated by your office. Please contact your office manager if you think this is a mistake.</p>'+
        '<button id="soBtn" class="signin-btn">Back to sign in</button>'+
      '</div></div>';
    el("soBtn").addEventListener("click", signOut);
  }

  function renderOfficePaused(){
    screen.innerHTML =
      '<div class="login"><div class="login-card">'+
        '<div class="lb"><span class="lb-tile">'+ic(I.house,2.4,"#C8F24A")+'</span><span class="lb-word">List<b>Edge</b></span></div>'+
        '<h1>Your office is paused.</h1>'+
        '<p class="sub">Your office\u2019s ListEdge access has been switched off. Please contact your office manager or ListEdge.</p>'+
        '<button id="soBtn" class="signin-btn">Back to sign in</button>'+
      '</div></div>';
    el("soBtn").addEventListener("click", signOut);
  }

  function topbar(isManager){
    var p = ST.profile;
    var seg = isManager ?
      '<div class="seg">'+
        '<button data-view="app" class="'+(ST.view==="app"?"on":"")+'">My app</button>'+
        '<button data-view="office" class="'+(ST.view==="office"?"on":"")+'">Office dashboard</button>'+
      '</div>' : '';
    var menu = ST.menu ?
      '<div class="menu"><div class="who"><b>'+esc(p.full_name||firstName(p.full_name,p.email))+'</b><span>'+esc(p.email||"")+'</span></div>'+
        '<button data-act="signout">'+ic(I.out,2)+' Sign out</button></div>' : '';
    return '<div class="topbar">'+
      '<div class="tb-brand"><span class="tb-tile">'+ic(I.house,2.4,"#C8F24A")+'</span><span class="tb-word">List<b>Edge</b></span></div>'+
      seg + '<div class="sp"></div>'+
      '<div class="acct"><button class="acct-chip" data-act="menu"><span class="av">'+esc(initials(p.full_name,p.email))+'</span>'+
        '<span class="acct-meta"><b>'+esc(firstName(p.full_name,p.email))+'</b><span>'+esc(p.role==="manager"?"Office manager":"Agent")+'</span></span></button>'+
        menu+'</div>'+
    '</div>';
  }

  var TABS = [["home","Home","house"],["board","Board","grid"],["listings","Listings","tag"],["post","Post","plus"],["activity","Activity","clip"],["profile","Profile","user"]];
  var SUBURBS=["Addington","Aranui","Avondale","Avonhead","Belfast","Bishopdale","Bromley","Bryndwr","Burnside","Burwood","Cashmere","Casebrook","Cust","Darfield","Dunsandel","Edgeware","Fendalton","Fernside","Halswell","Harewood","Heathcote","Hei Hei","Hillmorton","Hoon Hay","Hornby","Huntsbury","Ilam","Kaiapoi","Kirwee","Leeston","Lincoln","Linwood","Loburn","Lyttelton","Mairehau","Mandeville","Marshland","Merivale","Middleton","New Brighton","Northwood","Ohoka","Opawa","Oxford","Papanui","Parklands","Pegasus","Phillipstown","Prebbleton","Rangiora","Redcliffs","Redwood","Riccarton","Richmond","Rolleston","Russley","Sefton","Shirley","Sockburn","Somerfield","Southbridge","Spreydon","Springston","St Albans","St Martins","Strowan","Sumner","Swannanoa","Sydenham","Tai Tapu","Templeton","Upper Riccarton","Wainoni","Waikuku","Waltham","West Melton","Westmorland","Wigram","Woodend","Woolston","Yaldhurst"];
  var TYPES=["Any","House","Townhouse","Unit","Apartment","Section","Lifestyle"];
  var BEDS=[{l:"1",v:1},{l:"2",v:2},{l:"3",v:3},{l:"4",v:4},{l:"5+",v:5}];
  var BATHS=[{l:"1",v:1},{l:"2",v:2},{l:"3+",v:3}];
  function fp(n){ if(n==null||isNaN(n)) return ""; return n>=1e6?("$"+(n/1e6).toFixed(2).replace(/\.?0+$/,"")+"m"):("$"+Math.round(n/1000)+"k"); }
  function selOpts(arr,val,ph){ var o=ph?'<option value="">'+ph+'</option>':''; for(var i=0;i<arr.length;i++){ var x=arr[i]; var v=(typeof x==="object")?x.v:x; var l=(typeof x==="object")?x.l:x; o+='<option value="'+v+'"'+((""+v)===(""+val)?" selected":"")+'>'+l+'</option>'; } return o; }
  function snapMatches(){ var c=ST.snap; if(!c.suburb) return []; return ST.briefs.filter(function(b){ if(briefSubs(b).indexOf(c.suburb)<0) return false; if(c.beds && (b.beds||0)>c.beds) return false; if(c.baths && (b.baths||0)>c.baths) return false; if(c.type && c.type!=="Any"){ var ts=briefTypes(b); if(ts.length && ts.indexOf(c.type)<0) return false; } return true; }); }
  function loadBriefs(cb){ if(!sb){ if(cb) cb(); return; } sb.from("buyer_briefs").select("id,suburb,beds,baths,property_type,price_min,price_max,agent_id,created_at").eq("status","active").then(function(r){ ST.briefs=(r&&r.data)?r.data:[]; if(cb) cb(); }).catch(function(){ ST.briefs=[]; if(cb) cb(); }); }
  function postBrief(){ var d=ST.briefDraft; var err=el("bf-err"); if(err) err.textContent="";
    if(!d.subs.length){ if(err) err.textContent="Add at least one suburb."; return; }
    if(!d.types.length){ if(err) err.textContent="Choose at least one property type."; return; }
    var pmin=d.priceMin!==""?parseInt(d.priceMin,10):null, pmax=d.priceMax!==""?parseInt(d.priceMax,10):null;
    if(pmin!=null&&pmax!=null&&pmax<pmin){ if(err) err.textContent="The ‘to’ budget should be higher than the ‘from’ budget."; return; }
    if(!d.consent){ if(err) err.textContent="Please confirm you have your client’s consent."; return; }
    var lmin=d.landMin!==""?parseInt(d.landMin,10):null, lmax=d.landMax!==""?parseInt(d.landMax,10):null;
    var btn=document.querySelector('[data-act="post-brief"]'); if(btn){ btn.disabled=true; btn.textContent="Posting…"; }
    var rec={ agent_id:me(), agency_id:ST.profile.agency_id||null, suburb:d.subs[0], suburbs:d.subs, property_type:d.types[0], types:d.types, beds:parseInt(d.beds||"0",10)||0, baths:parseInt(d.baths||"0",10)||0, price_min:pmin, price_max:pmax, land_min:lmin, land_max:lmax, note:d.notes||null, agent_name:(ST.profile.full_name||firstName(ST.profile.full_name,ST.profile.email)), agency_name:ST.profile.agency_name||null, status:"active" };
    sb.from("buyer_briefs").insert(rec).then(function(r){ if(r&&r.error){ if(btn){btn.disabled=false;btn.textContent="Post brief to the network";} if(err) err.textContent="Couldn’t post that just now. Please try again."; return; } ST.postMsg="Brief posted — it’s now live on the board and counts toward network demand."; ST.briefDraft={beds:3,baths:1,priceMin:"",priceMax:"",landMin:"",landMax:"",subs:[],types:[],notes:"",consent:false}; loadBriefs(function(){ renderApp(); }); }).catch(function(){ if(btn){btn.disabled=false;btn.textContent="Post brief to the network";} if(err) err.textContent="Something went wrong. Please try again."; }); }
  function me(){ return ST.user ? ST.user.id : null; }
  function matchLB(L,Br){ if(!L||!Br) return false; if(briefSubs(Br).indexOf(L.suburb)<0) return false; if((L.beds||0)<(Br.beds||0)) return false; if((L.baths||0)<(Br.baths||0)) return false; var ts=briefTypes(Br); if(ts.length && L.property_type && ts.indexOf(L.property_type)<0) return false; if(L.price!=null&&Br.price_max!=null&&L.price>Br.price_max) return false; return true; }
  function myListings(){ return ST.listings.filter(function(l){return l.agent_id===me();}); }
  function myActiveListings(){ return myListings().filter(function(l){return l.status==="active";}); }
  function otherActiveListings(){ return ST.listings.filter(function(l){return l.status==="active"&&l.agent_id!==me();}); }
  function myActiveBriefs(){ return ST.briefs.filter(function(b){return b.agent_id===me();}); }
  function otherActiveBriefs(){ return ST.briefs.filter(function(b){return b.agent_id!==me();}); }
  function matchesForListing(L){ return otherActiveBriefs().filter(function(b){return matchLB(L,b);}); }
  function matchesForBrief(Br){ return otherActiveListings().filter(function(l){return matchLB(l,Br);}); }
  function buyerMatchCount(){ var n=0; myActiveListings().forEach(function(l){ n+=matchesForListing(l).length; }); return n; }
  function listingsWithMatches(){ return myActiveListings().filter(function(l){return matchesForListing(l).length>0;}).length; }
  function pendingIntros(){ return ST.intros.filter(function(x){return x.status==="pending";}).length; }
  function findIntro(listingId,briefId){ for(var i=0;i<ST.intros.length;i++){ var x=ST.intros[i]; if(x.listing_id===listingId&&x.brief_id===briefId) return x; } return null; }
  function loadListings(cb){ if(!sb){ if(cb)cb(); return; } sb.from("listings").select("id,agent_id,agency_id,title,suburb,beds,baths,property_type,price,status,created_at").then(function(r){ ST.listings=(r&&r.data)?r.data:[]; if(cb)cb(); }).catch(function(){ ST.listings=[]; if(cb)cb(); }); }
  function loadIntros(cb){ if(!sb){ if(cb)cb(); return; } sb.from("introductions").select("*").then(function(r){ var rows=(r&&r.data)?r.data:[]; ST.intros=rows.filter(function(x){return x.listing_agent_id===me()||x.buyer_agent_id===me();}); if(cb)cb(); }).catch(function(){ ST.intros=[]; if(cb)cb(); }); }

    var lt=(x.listing_type||"home").toLowerCase();
    var listingTxt=(x.listing_beds||0)+'-bed, '+(x.listing_baths||0)+'-bath '+esc(lt)+' in '+esc(x.listing_suburb||"")+(x.listing_price!=null?' · '+fp(x.listing_price):'');
    var bb=(x.brief_price_min!=null||x.brief_price_max!=null)?fp(x.brief_price_min)+(x.brief_price_max!=null?" – "+fp(x.brief_price_max):""):"budget n/a";
    var briefTxt=(x.brief_beds||0)+'-bed, '+(x.brief_baths||0)+'-bath buyer · '+esc(bb)+' in '+esc(x.brief_suburb||"");
    var role = amListing ? "You shared a listing" : "You introduced a buyer";
    var cpName,cpEmail,cpOffice;
    if(amListing){ cpName=x.buyer_contact_name; cpEmail=x.buyer_contact_email; cpOffice=x.buyer_office; } else { cpName=x.listing_contact_name; cpEmail=x.listing_contact_email; cpOffice=x.listing_office; }
    var contact = cpEmail ? '<div class="intro-contact">'+esc(cpName||"Agent")+(cpOffice?' · '+esc(cpOffice):'')+' · <a href="mailto:'+esc(cpEmail)+'">'+esc(cpEmail)+'</a></div>' : '<div class="intro-wait">Waiting for the other office to share their details.</div>';
    var pill='<span class="intro-pill '+(x.status==="contacted"?"on":"")+'">'+(x.status==="contacted"?"Contacted":"Awaiting contact")+'</span>';
    var action = (x.status==="pending") ? '<button class="mini-btn" data-act="mark-contacted" data-intro="'+x.id+'">Mark as contacted &amp; share my details</button>' : '';
    return '<div class="intro"><div class="intro-top"><span class="intro-role">'+role+'</span>'+pill+'</div><div class="intro-line">'+ic(I.tag,1.7,"#0E5A3C")+'<span>'+listingTxt+'</span></div><div class="intro-line">'+ic(I.user,1.7,"#0E5A3C")+'<span>'+briefTxt+'</span></div>'+contact+action+'</div>';
  }
  function tabActivity(){
    var list=ST.intros.slice().sort(function(a,b){return (b.created_at||"").localeCompare(a.created_at||"");});
    var body=list.length ? list.map(introCard).join("") : '<div class="card"><div class="empty">'+ic(I.clip,1.8,"#A6C0B1")+'<div class="t">No introductions yet</div><div class="d">When you introduce on a match, it is logged here as a shared conjunctional record for both offices.</div></div></div>';
    return '<div class="ph">Introductions</div><p class="muted" style="margin:-8px 0 16px">Your shared conjunctional records across the network.</p>'+body;
  }
  function tabProfile(){
    var p = ST.profile;
    return '<div class="ph">Profile</div>'+
      '<div class="card prof"><div class="prof-top"><span class="av lg">'+esc(initials(p.full_name,p.email))+'</span>'+
        '<div><div class="prof-nm">'+esc(p.full_name||firstName(p.full_name,p.email))+'</div><div class="prof-rl">'+esc(p.role==="manager"?"Office manager":"Agent")+'</div></div></div>'+
        '<div class="prof-row"><span>Email</span><b>'+esc(p.email||"")+'</b></div>'+
        '<div class="prof-row"><span>Office</span><b>'+esc(p.agency_name||"—")+'</b></div>'+
        '<button class="signout-btn" data-act="signout">Sign out</button></div>';
  }
  function tabContent(){
    if(ST.tab==="board") return tabBoard();
    if(ST.tab==="listings") return tabListings();
    if(ST.tab==="post") return tabPost();
    if(ST.tab==="activity") return tabActivity();
    if(ST.tab==="profile") return tabProfile();
    return tabHome();
  }

  function officeView(){
    return '<div class="wrap">'+
      '<div class="secthead"><div><h2>Your office</h2><div class="office">'+esc(ST.profile.agency_name||"")+'</div></div>'+
        '<button class="btn-primary" data-act="invite">'+ic(I.plus,2.2,"#fff")+' &nbsp;Add teammate</button></div>'+
      '<div class="card" style="padding:8px 16px"><div class="team" id="teamList"><div class="loading">Loading your team…</div></div></div>'+
      '<p class="panel-note" id="officeNote">Manage who in your office can use ListEdge. You can deactivate or reactivate anyone here.</p>'+
    '</div>';
  }

  function renderApp(){
    var isManager = ST.profile.role==="manager";
    if(!isManager) ST.view = "app";
    if(isManager && ST.view==="office"){
      screen.innerHTML = topbar(isManager) + '<div class="shell"><main class="main"><div class="appwrap office">' + officeView() + '</div></main></div>';
      loadTeam();
    } else {
      screen.innerHTML = topbar(isManager) + '<div class="shell">' + sideNav() + '<main class="main"><div class="appwrap">' + tabContent() + '</div></main></div>' + tabbar() + detailOverlay();
    }
  }

  function loadTeam(){
    var box = el("teamList"); if(!box) return;
    sb.from("profiles").select("id,email,full_name,role,active,agency_id").eq("agency_id", ST.profile.agency_id)
      .then(function(r){
        if(r.error || !r.data){ box.innerHTML = '<div class="empty"><div class="t">Couldn’t load your team</div><div class="d">Please try again in a moment.</div></div>'; return; }
        var rows = r.data.slice().sort(function(a,b){
          if((b.role==="manager")-(a.role==="manager")) return (b.role==="manager")-(a.role==="manager");
          return (a.full_name||a.email||"").localeCompare(b.full_name||b.email||"");
        });
        box.innerHTML = rows.map(function(m){
          var me = m.id===ST.profile.id;
          var rolePill = '<span class="pill '+(m.role==="manager"?"mgr":"agt")+'">'+(m.role==="manager"?"Manager":"Agent")+'</span>';
          var statePill = '<span class="pill '+(m.active!==false?"on":"off")+'">'+(m.active!==false?"Active":"Inactive")+'</span>';
          var act = me ? '<span class="em">You</span>' :
            (m.active!==false
              ? '<button class="lnk danger" data-deact="'+esc(m.id)+'">Deactivate</button>'
              : '<button class="lnk" data-react="'+esc(m.id)+'">Reactivate</button>');
          return '<div class="row"><span class="av">'+esc(initials(m.full_name,m.email))+'</span>'+
            '<span class="rinfo"><div class="nm">'+esc(m.full_name||"—")+'</div><div class="em">'+esc(m.email||"")+'</div></span>'+
            rolePill+statePill+'<span class="rowact">'+act+'</span></div>';
        }).join("");
      }).catch(function(){ box.innerHTML = '<div class="empty"><div class="t">Couldn’t load your team</div></div>'; });
  }

  function setActive(id, active){
    var note = el("officeNote"); if(note){ note.textContent = (active?"Reactivating…":"Deactivating…"); }
    sb.from("profiles").update({ active:active }).eq("id", id).then(function(r){
      if(note){ note.textContent = r.error ? "That didn’t save — please try again." :
        "Manage who in your office can use ListEdge. You can deactivate or reactivate anyone here."; }
      if(!r.error) loadTeam();
    }).catch(function(){ if(note){ note.textContent="That didn’t save — please try again."; } });
  }

  // ---- delegated events for the app chrome ----
  screen.addEventListener("click", function(e){
    var t = e.target;
    var _tab = t.closest ? t.closest("[data-tab]") : null;
    if(_tab){ ST.tab = _tab.getAttribute("data-tab"); ST.menu=false; ST.postMsg=""; ST.listMsg=""; ST.detail=null; renderApp(); return; }
    var _ft = t.closest ? t.closest("[data-ftype]") : null;
    if(_ft){ ST.filter.type=_ft.getAttribute("data-ftype"); renderApp(); return; }
    var act = t.closest ? t.closest("[data-act]") : null;
    if(act){
      var a = act.getAttribute("data-act");
      if(a==="menu"){ ST.menu=!ST.menu; renderApp(); return; }
      if(a==="signout"){ signOut(); return; }
      if(a==="post-brief"){ postBrief(); return; }
      if(a==="add-listing"){ addListing(); return; }
      if(a==="open-listing"){ var lid=act.getAttribute("data-listing"); ST.openListing=(ST.openListing===lid?null:lid); renderApp(); return; }
      if(a==="log-intro"){ logIntro(act.getAttribute("data-side"), act.getAttribute("data-listing"), act.getAttribute("data-brief")); return; }
      if(a==="mark-contacted"){ markContacted(act.getAttribute("data-intro")); return; }
      if(a==="invite"){ var n=el("officeNote"); if(n){ n.textContent="Adding teammates from inside ListEdge is coming next. For now, new accounts are created for your office by ListEdge."; } return; }
      if(a==="rm-sub"){ var rv=act.getAttribute("data-val"); ST.briefDraft.subs=ST.briefDraft.subs.filter(function(x){return x!==rv;}); renderApp(); return; }
      if(a==="toggle-type"){ var tv=act.getAttribute("data-val"); var ti=ST.briefDraft.types.indexOf(tv); if(ti>=0) ST.briefDraft.types.splice(ti,1); else ST.briefDraft.types.push(tv); renderApp(); return; }
      if(a==="toggle-consent"){ ST.briefDraft.consent=!ST.briefDraft.consent; renderApp(); return; }
      if(a==="open-detail"){ ST.detail=act.getAttribute("data-id"); renderApp(); return; }
      if(a==="close-detail"){ ST.detail=null; renderApp(); return; }
      if(a==="intro-from-detail"){ ST.detail=null; logIntro("listing", act.getAttribute("data-listing"), act.getAttribute("data-brief")); return; }
      if(a==="toggle-filter"){ ST.filter.open=!ST.filter.open; renderApp(); return; }
      if(a==="filter-clear"){ ST.filter={open:true,suburb:"Any",beds:0,type:"Any"}; renderApp(); return; }
    }
    var v = t.closest ? t.closest("[data-view]") : null;
    if(v){ ST.view = v.getAttribute("data-view"); ST.menu=false; renderApp(); return; }
    var d = t.closest ? t.closest("[data-deact]") : null;
    if(d){ setActive(d.getAttribute("data-deact"), false); return; }
    var re = t.closest ? t.closest("[data-react]") : null;
    if(re){ setActive(re.getAttribute("data-react"), true); return; }
    // close the account menu when clicking elsewhere
    if(ST.menu && !(t.closest && t.closest(".acct"))){ ST.menu=false; renderApp(); }
  });

  screen.addEventListener("change", function(e){
    var t=e.target; if(!t||!t.getAttribute) return;
    if(t.getAttribute("data-snap")!=null){ var k=t.getAttribute("data-snap"), v=t.value; if(k==="beds"||k==="baths") v=parseInt(v||"0",10)||0; ST.snap[k]=v; renderApp(); return; }
    var bf=t.getAttribute("data-bfield");
    if(bf!=null){ ST.briefDraft[bf]=(bf==="beds"||bf==="baths")?(parseInt(t.value||"0",10)||0):t.value; return; }
    if(t.getAttribute("data-addsub")!=null){ var sv=t.value; if(sv && ST.briefDraft.subs.indexOf(sv)<0) ST.briefDraft.subs.push(sv); renderApp(); return; }
    var fk=t.getAttribute("data-filter");
    if(fk!=null){ ST.filter[fk]=(fk==="beds")?(parseInt(t.value||"0",10)||0):t.value; renderApp(); return; }
  })
  screen.addEventListener("input", function(e){
    var t=e.target; if(!t||!t.getAttribute) return;
    var bf=t.getAttribute("data-bfield");
    if(bf!=null && bf!=="beds" && bf!=="baths"){ ST.briefDraft[bf]=t.value; return; }
  });

  boot();
})();
</script>
</body>
</html>
